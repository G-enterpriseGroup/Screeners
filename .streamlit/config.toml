[theme]
base = "dark"
primaryColor = "#fb8b1e"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0A0A0A"
# Streamlit derives dataframe-header text from textColor. Use black here so
# native Glide dataframe headers are black on Bloomberg orange. Raj's Terminal
# CSS keeps normal application text orange, and src.theme explicitly restores
# orange/default financial colors inside dataframe body cells.
textColor = "#000000"
font = "monospace"
baseRadius = "none"
buttonRadius = "none"
borderColor = "#fb8b1e"
dataframeBorderColor = "#fb8b1e"
dataframeHeaderBackgroundColor = "#fb8b1e"
showWidgetBorder = true

[server]
headless = true
