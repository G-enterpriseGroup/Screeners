name: Temporary Reboot Touch ID Validation
# rerun revision 2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reboot-touchid-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reboot-touchid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production requirements
        run: python -m pip install -r requirements.txt

      - name: Syntax check changed production files
        run: python -m py_compile streamlit_app.py src/reboot_guard.py src/passkey_auth.py src/lock_screen_v2.py

      - name: Reboot guard regression
        run: python scripts/test_reboot_guard.py

      - name: Touch ID persistence regression
        run: python scripts/test_touch_id_persistence.py

      - name: Existing hot reload regression
        run: python scripts/test_streamlit_hot_reload_import_guard.py

      - name: Top-level tab regression
        run: python scripts/test_tab_layout.py

      - name: Architecture guard
        run: python scripts/validate_architecture.py
