name: GEX live refresh and TradingView diagnostics

on:
  push:
    branches:
      - gex-live-refresh-tv-fix-20260917

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gex-live-refresh-tv-fix-20260917
          fetch-depth: 0

      - name: Apply isolated OAuth and GEX fixes
        run: python scripts/tmp_gex_live_refresh_tv_fix.py

      - name: Validate production files
        run: |
          python -m py_compile src/etrade_connection_ui_v2.py src/gex_ui_v3.py src/gex_workspace_v2.py
          python - <<'PY'
          from pathlib import Path
          from src.gex_ui_v3 import _pine_runtime_master_issues

          ui = Path('src/gex_ui_v3.py').read_text()
          oauth = Path('src/etrade_connection_ui_v2.py').read_text()
          ws = Path('src/gex_workspace_v2.py').read_text()
          app = Path('streamlit_app.py').read_text()

          sample = '''"Ticker: SPY\nSPOT,754.07,0\nGFLIP,767.83,0\nCALLWALL,800,206800000\nPUTWALL,750,-2740000000\nMAXCALLOI,800,166899\nMAXPUTOI,525,514748\nGEXNEG1,754,-1250000000\n\nTicker: QQQ\nSPOT,710,0\nGFLIP,715,0\nCALLWALL,750,200000000\nPUTWALL,700,-1900000000\nMAXCALLOI,750,100000\nMAXPUTOI,700,120000\nGEXPOS1,720,100000000"'''
          issues, counts = _pine_runtime_master_issues(sample, ['SPY', 'QQQ'])
          assert not issues, (issues, counts)
          assert counts['SPY'] >= 7 and counts['QQQ'] >= 7

          assert '@st.fragment(run_every=1.0)' in ui
          assert '_proven._render_background_status = _live_background_status_fragment' in ui
          assert 'PINE EXACT INPUT CHECK PASS' in ui
          assert 'gexv3_bridge_choice_pine_safe_v5' in ui
          assert 'REFERENCE ONLY // DO NOT PASTE' in ui
          assert 'COPY FOR TRADINGVIEW' in ui
          assert 'st.toast("E*TRADE SESSION RENEWED"' in oauth
          assert 'st.success("E*TRADE session renewed.")' not in oauth
          assert 'live_client_factory().renew()' in oauth and 'touch_session()' in oauth
          assert 'v2026.09.17.09' in ws
          assert '20 CALC // 20 FETCH // 3.7 RPS' in ws
          assert 'from src.gex_workspace_v2 import render_gex as render_gex_workspace' in app
          for tab in ['HOLDINGS', 'RISK SIZING', 'GEX', 'BULL DEBIT SPREAD', 'MUNI SCREENERS', 'ORDERS']:
              assert f'active_tab == "{tab}"' in app
          PY
          python scripts/validate_architecture.py

      - name: Commit production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/etrade_connection_ui_v2.py src/gex_ui_v3.py src/gex_workspace_v2.py src/TERMINAL_CHANGELOG.md
          git commit -m "Fix GEX live refresh and TradingView paste path"
          git push origin HEAD:gex-live-refresh-tv-fix-20260917
