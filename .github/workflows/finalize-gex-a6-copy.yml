name: Finalize GEX A6 copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-gex-a6-copy.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply isolated GEX finishing changes
        shell: python
        run: |
          from pathlib import Path

          ui_path = Path('src/gex_ui_v3.py')
          ui = ui_path.read_text()

          old_css = '''.st-key-gexv3_bridge_code [data-testid="stCodeBlockCopyButton"]:hover svg *,
          .st-key-gexv3_bridge_code [data-testid="stCodeBlockCopyButton"]:focus-visible svg *,
          .st-key-gexv3_bridge_code [data-testid="stCodeBlock"] button:hover svg *,
          .st-key-gexv3_bridge_code [data-testid="stCodeBlock"] button:focus-visible svg *,
          .st-key-gexv3_bridge_code [data-testid="stCodeBlock"] [role="button"]:hover svg *,
          .st-key-gexv3_bridge_code [data-testid="stCodeBlock"] [role="button"]:focus-visible svg * {
              color:#020202 !important;
              stroke:#020202 !important;
              fill:#020202 !important;
          }
          </style>'''
          new_css = '''.st-key-gexv3_bridge_code [data-testid="stCodeBlockCopyButton"]:hover svg *,
          .st-key-gexv3_bridge_code [data-testid="stCodeBlockCopyButton"]:focus-visible svg *,
          .st-key-gexv3_bridge_code [data-testid="stCodeBlock"] button:hover svg *,
          .st-key-gexv3_bridge_code [data-testid="stCodeBlock"] button:focus-visible svg *,
          .st-key-gexv3_bridge_code [data-testid="stCodeBlock"] [role="button"]:hover svg *,
          .st-key-gexv3_bridge_code [data-testid="stCodeBlock"] [role="button"]:focus-visible svg * {
              color:#020202 !important;
              stroke:#020202 !important;
              fill:#020202 !important;
          }
          /* Make Streamlit's real clipboard control unmistakable instead of an icon-only affordance. */
          .st-key-gexv3_bridge_code [data-testid="stCodeBlockCopyButton"],
          .st-key-gexv3_bridge_code [data-testid="stCodeBlock"] button,
          .st-key-gexv3_bridge_code [data-testid="stCodeBlock"] [role="button"] {
              min-width:10.4rem !important;
              width:auto !important;
              padding:.34rem .58rem !important;
              gap:.32rem !important;
          }
          .st-key-gexv3_bridge_code [data-testid="stCodeBlockCopyButton"]::after,
          .st-key-gexv3_bridge_code [data-testid="stCodeBlock"] button::after,
          .st-key-gexv3_bridge_code [data-testid="stCodeBlock"] [role="button"]::after {
              content:"COPY MASTER A6" !important;
              display:inline-block !important;
              color:inherit !important;
              -webkit-text-fill-color:inherit !important;
              font:900 8.5pt/1 "Courier New",monospace !important;
              letter-spacing:.02em !important;
              white-space:nowrap !important;
          }
          </style>'''
          if old_css not in ui:
              raise SystemExit('Expected TradingView copy CSS anchor not found')
          ui = ui.replace(old_css, new_css, 1)

          old_heading = '''    block_name = "MASTER A6 BLOCK" if is_master else "A6 / PINE BLOCK"
              st.markdown(f"**{block_name} // USE THE ORANGE COPY A6 BUTTON IN THE TOP-RIGHT OF THE BLOCK**")'''
          new_heading = '''    block_name = "MASTER A6 BLOCK" if is_master else "A6 / PINE BLOCK"
              if is_master:
                  st.markdown(
                      "**MASTER A6 BLOCK // GOOGLE APPS SCRIPT FORMAT // CLICK COPY MASTER A6 IN THE TOP-RIGHT**"
                  )
              else:
                  st.markdown(f"**{block_name} // USE THE ORANGE COPY BUTTON IN THE TOP-RIGHT OF THE BLOCK**")'''
          if old_heading not in ui:
              raise SystemExit('Expected TradingView heading anchor not found')
          ui = ui.replace(old_heading, new_heading, 1)
          ui_path.write_text(ui)

          workspace_path = Path('src/gex_workspace_v2.py')
          workspace = workspace_path.read_text()
          if 'GEX_BUILD_VERSION = "v2026.09.16.02"' not in workspace:
              raise SystemExit('Expected GEX build .02 anchor not found')
          workspace = workspace.replace(
              'GEX_BUILD_VERSION = "v2026.09.16.02"',
              'GEX_BUILD_VERSION = "v2026.09.16.03"',
              1,
          )
          workspace_path.write_text(workspace)

          changelog_path = Path('src/TERMINAL_CHANGELOG.md')
          changelog = changelog_path.read_text()
          entry = '''

          ## 2026-09-16 — MASTER A6 always-copyable Google Apps Script bridge

          - **Feature changed:** GEX TradingView MASTER A6 export finishing behavior and copy affordance.
          - **Exact production file(s) changed:** `src/gex_ui_v3.py`, `src/gex_workspace_v2.py`, `src/TERMINAL_CHANGELOG.md`.
          - **What was broken:** A failed/no-data ticker could make the older TradingView view say the Pine master was not ready and hide the useful copy block; the native Streamlit clipboard action was also visually an icon instead of the explicit MASTER A6 copy control Raj requested.
          - **Root cause:** The older bridge treated complete-ticker coverage as a prerequisite for presenting MASTER A6 and optimized the transport for a compact Pine-only payload. Raj's supplied Google Apps Script does the opposite: it always assembles A6 in saved-ticker order, emits full `summaryText` for successful symbols, emits `Ticker:` + `ERROR:` for failed symbols, trims the final joined text, and still exposes Copy A6.
          - **What was changed:** Preserved the current Google Apps Script A6 serializer as the default MASTER export, kept failed/no-result symbols as `Ticker:`/`ERROR:` blocks so one bad ticker never removes the master block, and made Streamlit's real code-block clipboard control visibly read `COPY MASTER A6`. The MASTER heading now explicitly says `GOOGLE APPS SCRIPT FORMAT`. Bumped the visible GEX build marker to `v2026.09.16.03`.
          - **Important behavior that must remain:** MASTER A6 must stay copyable whenever saved tickers exist, even when one or more symbols have no GEX data. Successful ticker blocks must remain in the supplied Apps Script field/order contract: `Ticker`, `Mode`, `Spot`, `Max DTE Used`, `Contracts Used`, `Net Current GEX`, `Source URL`, blank line, Pine instruction/separator, then `SPOT`, optional `GFLIP`, `CALLWALL`, `PUTWALL`, `MAXCALLOI`, `MAXPUTOI`, and ranked `GEXPOS/GEXNEG` rows. Failed symbols remain `Ticker:` + `ERROR:` blocks rather than blocking the whole A6.
          - **Files/features intentionally NOT changed:** GEX formulas/math in `src/gex_ui.py`, Risk Sizing, OAuth, Holdings, navigation, Bull Debit, Muni, Orders, shared theme, and `src/terminal_core.py`.
          - **Tests performed:** Python syntax compilation for the changed GEX Python files; `python scripts/validate_architecture.py`; static assertions that MASTER A6 serializer retains Google Apps Script error blocks and the visible clipboard label is present.
          - **Architecture guard result:** PASS if this one-time workflow commit is present on `main`.
          - **Commit SHA:** recorded by the resulting workflow commit.
          - **Lesson:** MASTER A6 is a copy/export contract, not a completeness gate. Match the supplied Apps Script serialization first; failed tickers should degrade locally, never suppress the entire TradingView paste block.
          '''
          entry = '\n'.join(line[10:] if line.startswith('          ') else line for line in entry.splitlines())
          if '## 2026-09-16 — MASTER A6 always-copyable Google Apps Script bridge' not in changelog:
              changelog_path.write_text(changelog.rstrip() + entry + '\n')

      - name: Syntax and architecture checks
        run: |
          python -m py_compile src/gex_ui_v3.py src/gex_workspace_v2.py src/gex_ui_v3_base.py
          python scripts/validate_architecture.py
          python - <<'PY'
          from pathlib import Path
          ui = Path('src/gex_ui_v3.py').read_text()
          assert 'COPY MASTER A6' in ui
          assert 'MASTER A6 BLOCK // GOOGLE APPS SCRIPT FORMAT' in ui
          assert 'ERROR: No refreshed GEX result available.' in ui
          assert 'summary.split("\\n")' in ui
          assert 'return "\\n".join(all_output_lines).strip()' in ui
          workspace = Path('src/gex_workspace_v2.py').read_text()
          assert 'GEX_BUILD_VERSION = "v2026.09.16.03"' in workspace
          print('GEX MASTER A6 finishing assertions: PASS')
          PY
      - name: Commit production fix and remove one-time workflow
        run: |
          git config user.name "G-enterpriseGroup"
          git config user.email "143067071+G-enterpriseGroup@users.noreply.github.com"
          git rm .github/workflows/finalize-gex-a6-copy.yml
          git add src/gex_ui_v3.py src/gex_workspace_v2.py src/TERMINAL_CHANGELOG.md
          git commit -m "Finalize GEX MASTER A6 copy workflow"
          git push origin HEAD:main
