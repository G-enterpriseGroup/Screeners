name: Temporary Risk Copy Browser Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  browser-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production + browser dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install selenium
      - name: Focused Risk regressions
        run: |
          python -m py_compile streamlit_app.py src/risk_sizing_ui_v7.py src/risk_sizing_ui_v10.py src/risk_sizing_ui_v9.py src/risk_sizing_ui_v2.py
          python scripts/test_risk_production_ui.py
          python scripts/test_risk_intent_override.py
          python scripts/test_tab_layout.py
          python scripts/validate_architecture.py
      - name: Launch isolated browser fixture
        shell: bash
        run: |
          cat > /tmp/risk_copy_app.py <<'PY'
          import streamlit as st
          from src.risk_sizing_ui_v2 import _render_target_stop_copy
          from src.risk_sizing_ui_v9 import _render_css, _compact_metric_box

          st.set_page_config(layout="wide")
          _render_css()
          st.title("Risk Copy Browser Fixture")
          left, right = st.columns([1.0, 0.055], gap="small", vertical_alignment="center")
          _compact_metric_box(
              left,
              "UNUSED RISK // TARGET STOP $704.58",
              "$0.01 (0.01%)",
              "neutral",
              help_text=(
                  "MATH CHECK: PASS\n"
                  "Risk/share: |$771.35 - $704.58| = $66.77.\n"
                  "Max shares: min(2, 2) = 2.\n"
                  "Target stop: 2 x ($771.35 - $704.58) = $133.54 modeled risk <= $133.55 budget."
              ),
          )
          with right:
              _render_target_stop_copy(704.58)
          PY
          PYTHONPATH="$PWD" streamlit run /tmp/risk_copy_app.py --server.headless true --server.port 8502 > /tmp/risk-copy-streamlit.log 2>&1 &
          echo $! > /tmp/risk-copy-streamlit.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8502/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/risk-copy-streamlit.log
          exit 1
      - name: Browser render and copy click
        shell: bash
        run: |
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          opts = Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=1400,900")
          driver = webdriver.Chrome(options=opts)
          try:
              driver.get("http://127.0.0.1:8502")
              deadline = time.time() + 20
              while time.time() < deadline:
                  if "Risk Copy Browser Fixture" in driver.page_source:
                      break
                  time.sleep(0.5)
              assert "Risk Copy Browser Fixture" in driver.page_source, driver.page_source[:1000]
              assert "MATH CHECK: PASS" in driver.page_source
              assert "Oh no" not in driver.page_source

              frames = driver.find_elements(By.TAG_NAME, "iframe")
              copy_frame = None
              for frame in frames:
                  try:
                      driver.switch_to.frame(frame)
                      buttons = driver.find_elements(By.CSS_SELECTOR, 'button[aria-label="Copy target stop"]')
                      if buttons:
                          copy_frame = frame
                          button = buttons[0]
                          button.click()
                          deadline2 = time.time() + 5
                          while time.time() < deadline2 and button.text != "✓":
                              time.sleep(0.2)
                          assert button.text == "✓", f"copy button did not confirm: {button.text!r}"
                          break
                  finally:
                      driver.switch_to.default_content()
              assert copy_frame is not None, "copy iframe/button not found"
          finally:
              driver.quit()
          PY
      - name: Dump Streamlit log on failure
        if: failure()
        run: cat /tmp/risk-copy-streamlit.log || true
