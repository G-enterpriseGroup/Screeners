name: Temporary Risk Book Sort Export Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/risk-book-sort-export-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  risk-book-sort-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production requirements
        run: python -m pip install -r requirements.txt

      - name: Syntax check production Risk path
        run: python -m py_compile streamlit_app.py src/risk_sizing_ui_v7.py src/risk_sizing_ui_v10.py src/risk_sizing_ui_v9.py src/risk_sizing_ui_v2.py

      - name: Focused Risk production regression
        run: python scripts/test_risk_production_ui.py

      - name: Risk intent sort/export regression
        run: python scripts/test_risk_intent_override.py

      - name: Top-level tab regression
        run: python scripts/test_tab_layout.py

      - name: Architecture guard
        run: python scripts/validate_architecture.py
