name: Temporary Reboot Persistence Validation

on:
  push:
    branches:
      - fix/reboot-persistence-20260927

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install production requirements
        run: python -m pip install -r requirements.txt
      - name: Syntax check changed Python
        run: |
          python -m py_compile src/risk_sizing_ui_v2.py
          python -m py_compile src/rebalance_portfolio_ui.py
          python -m py_compile scripts/test_risk_intent_override.py
          python -m py_compile scripts/test_rebalance_portfolio.py
      - name: Test Risk memory and LONG-TERM persistence
        run: python scripts/test_risk_intent_override.py
      - name: Test Rebalance persistence and math
        run: python scripts/test_rebalance_portfolio.py
      - name: Test production Risk route
        run: python scripts/test_risk_production_ui.py
      - name: Test connected Rebalance route
        run: python scripts/test_rebalance_connected_ui.py
      - name: Test reboot guard
        run: python scripts/test_reboot_guard.py
      - name: Architecture guard
        run: python scripts/validate_architecture.py
      - name: Render all top-level tabs
        run: python scripts/test_tab_layout.py
