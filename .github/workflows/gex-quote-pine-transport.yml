name: Fix GEX Pine quoted transport

on:
  push:
    branches:
      - gex-pine-quoted-master-20260916

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gex-pine-quoted-master-20260916
          fetch-depth: 0

      - name: Apply minimal GEX transport fix
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('src/gex_ui_v3.py')
          text = ui.read_text()

          old = '''    byte_count = len(text.encode("utf-8"))
    headers = _proven._pine_router_headers(text)
    missing_headers = [ticker for ticker in expected if ticker not in headers]
    pine_issues, parsed_counts = _proven._pine_master_issues(text, expected)
    too_large = byte_count > _proven._PINE_TEXT_LIMIT
    transport_ok = not missing_headers and not pine_issues and not too_large
'''
          new = '''    # TradingView/Pine accepts the pasted multiline payload as one string value
    # only when the complete compact transport is enclosed by one opening and
    # one closing double quote. Keep parser validation on the unquoted payload
    # so the exact Ticker:/packed-row contract remains unchanged internally.
    parser_text = text
    if not is_full:
        text = f'"{parser_text.strip()}"'

    byte_count = len(text.encode("utf-8"))
    headers = _proven._pine_router_headers(parser_text)
    missing_headers = [ticker for ticker in expected if ticker not in headers]
    pine_issues, parsed_counts = _proven._pine_master_issues(parser_text, expected)
    too_large = byte_count > _proven._PINE_TEXT_LIMIT
    quoted_transport_ok = is_full or (text.startswith('"') and text.endswith('"'))
    transport_ok = not missing_headers and not pine_issues and not too_large and quoted_transport_ok
'''
          if old not in text:
              raise SystemExit('Expected Pine validation block not found')
          text = text.replace(old, new, 1)

          old = '''        if too_large:
            details.append("TEXT_LIMIT")
        st.error("PINE ROUTER CHECK FAILED // " + ", ".join(details[:16]))
'''
          new = '''        if too_large:
            details.append("TEXT_LIMIT")
        if not quoted_transport_ok:
            details.append("MISSING_OUTER_DOUBLE_QUOTES")
        st.error("PINE ROUTER CHECK FAILED // " + ", ".join(details[:16]))
'''
          if old not in text:
              raise SystemExit('Expected Pine failure block not found')
          text = text.replace(old, new, 1)

          old = '''            "**COPY THIS BLOCK INTO GEX TEST → Packed Gamma Levels. It intentionally contains only `Ticker:` headers and packed rows.**"
'''
          new = '''            "**COPY THIS ENTIRE BLOCK INTO GEX TEST → Packed Gamma Levels. The opening and closing double quotes are required and are already included.**"
'''
          if old not in text:
              raise SystemExit('Expected master instruction not found')
          text = text.replace(old, new, 1)

          old = '''        st.markdown("**COPY THIS SINGLE-TICKER BLOCK INTO GEX TEST → Packed Gamma Levels.**")
'''
          new = '''        st.markdown("**COPY THIS ENTIRE SINGLE-TICKER BLOCK INTO GEX TEST → Packed Gamma Levels. Keep the opening and closing double quotes.**")
'''
          if old not in text:
              raise SystemExit('Expected single-ticker instruction not found')
          text = text.replace(old, new, 1)

          ui.write_text(text)

          workspace = Path('src/gex_workspace_v2.py')
          ws = workspace.read_text()
          old_version = 'GEX_BUILD_VERSION = "v2026.09.17.06"'
          new_version = 'GEX_BUILD_VERSION = "v2026.09.17.07"'
          if old_version not in ws:
              raise SystemExit('Expected GEX build version not found')
          workspace.write_text(ws.replace(old_version, new_version, 1))
          PY

      - name: Verify quote contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/gex_ui_v3.py').read_text()
          assert "parser_text = text" in text
          assert "text = f'\"{parser_text.strip()}\"'" in text
          assert "headers = _proven._pine_router_headers(parser_text)" in text
          assert "_pine_master_issues(parser_text, expected)" in text
          assert "text.startswith('\"') and text.endswith('\"')" in text
          assert 'opening and closing double quotes are required' in text
          assert 'v2026.09.17.07' in Path('src/gex_workspace_v2.py').read_text()
          PY

      - name: Syntax check affected Python files
        run: python -m py_compile src/gex_ui_v3.py src/gex_workspace_v2.py

      - name: Validate production architecture
        run: python scripts/validate_architecture.py

      - name: Commit production code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gex_ui_v3.py src/gex_workspace_v2.py
          git commit -m "Wrap GEX Pine transport in double quotes"
          echo "CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Append permanent changelog
        run: |
          cat >> src/TERMINAL_CHANGELOG.md <<EOF

          ## 2026-09-16 — Quote-wrap TradingView GEX transport

          - **Feature changed:** GEX TradingView / Pine `Packed Gamma Levels` copy transport.
          - **Exact production file(s) changed:** `src/gex_ui_v3.py`, `src/gex_workspace_v2.py`, `src/TERMINAL_CHANGELOG.md`.
          - **What was broken:** The compact Pine-router payload had correct `Ticker:` headers and packed rows but was copied as bare multiline text. The working TradingView input requires the entire pasted block to be one quoted string value, with one opening double quote before the first `Ticker:` and one closing double quote after the final packed row.
          - **Root cause:** The previous transport fix corrected the row grammar but omitted the outer string delimiters that TradingView/Pine expects for this multiline input.
          - **What was changed:** The terminal now wraps every Pine-safe MASTER and single-ticker copy payload in exactly one opening and one closing double quote. Parser validation continues to run against the unquoted internal payload so ticker routing and packed-row parsing are unchanged. A dedicated validation check fails if a Pine-safe copy payload is missing either outer quote. The Google Sheets full/reference block remains unmodified because it is not the TradingView paste payload. Visible build bumped to `v2026.09.17.07`.
          - **Important behavior that must remain:** Pine-safe output must begin exactly with `"Ticker: SYMBOL` and end with the final packed-row value followed immediately by `"`. Do not add quotes around each line; only wrap the complete multiline payload once. Preserve the exact internal `Ticker:` + `SPOT/GFLIP/CALLWALL/PUTWALL/MAXCALLOI/MAXPUTOI/GEXPOS*/GEXNEG*` contract.
          - **Files/features intentionally NOT changed:** GEX calculations in `src/gex_ui.py`, E*TRADE request/session plumbing, Refresh All concurrency/rate limits, IV Rank, Google Sheets full/reference serialization, TradingView Pine script, Risk Sizing, OAuth, Holdings, navigation, Bull Debit, Muni, Orders, shared theme, authentication, and `src/terminal_core.py`.
          - **Tests performed:** Static quote-contract assertions; Python syntax compilation for both changed GEX production Python files; `python scripts/validate_architecture.py`; production route and changed-file review in PR; final post-merge architecture guard required.
          - **Architecture guard result:** PASS on staging before code commit.
          - **Commit SHA:** `${CODE_SHA}` (production code stage); final merge SHA recorded by GitHub after merge.
          - **Lesson:** The TradingView parser contract has two layers: the internal packed-row grammar and the outer Pine string boundary. Validate the grammar without delimiters, but copy/paste the entire transport with exactly one leading and one trailing double quote.
          EOF
          git add src/TERMINAL_CHANGELOG.md
          git commit -m "Record quoted GEX Pine transport fix"

      - name: Final validation
        run: |
          python -m py_compile src/gex_ui_v3.py src/gex_workspace_v2.py
          python scripts/validate_architecture.py

      - name: Push
        run: git push origin HEAD:gex-pine-quoted-master-20260916
