name: Improve GEX TradingView copy button

on:
  push:
    branches:
      - gex-better-copy-button-20260917

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gex-better-copy-button-20260917
          fetch-depth: 0

      - name: Apply GEX-only copy control improvement
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('src/gex_ui_v3.py')
          text = ui.read_text()

          marker = '# ==============================\n# TRADINGVIEW / PINE ROUTER COMPATIBILITY\n# ==============================\n'
          css = '''# GEX-only styling for Streamlit's real code-block clipboard control.
# This does not create a fake copy button; it makes the existing working copy
# action large, obvious, and scoped to the keyed TradingView bridge container.
_TRADINGVIEW_COPY_BUTTON_CSS = """
<style>
.st-key-gexv3_bridge_code [data-testid="stCode"] button[aria-label*="Copy"],
.st-key-gexv3_bridge_code [data-testid="stCode"] button[title*="Copy"] {
    min-width: 12.8rem !important;
    min-height: 2.35rem !important;
    padding: .38rem .68rem !important;
    border: 1px solid #fb8b1e !important;
    border-radius: 0 !important;
    background: #fb8b1e !important;
    color: #000000 !important;
    box-shadow: none !important;
    font-family: "Courier New", monospace !important;
    font-size: 0 !important;
    font-weight: 900 !important;
    opacity: 1 !important;
}
.st-key-gexv3_bridge_code [data-testid="stCode"] button[aria-label*="Copy"]::after,
.st-key-gexv3_bridge_code [data-testid="stCode"] button[title*="Copy"]::after {
    content: "COPY FOR TRADINGVIEW" !important;
    font: 900 .76rem/1 "Courier New", monospace !important;
    letter-spacing: .025em !important;
    color: #000000 !important;
}
.st-key-gexv3_bridge_code [data-testid="stCode"] button[aria-label*="Copy"] svg,
.st-key-gexv3_bridge_code [data-testid="stCode"] button[title*="Copy"] svg {
    width: 1rem !important;
    height: 1rem !important;
    margin-right: .34rem !important;
    color: #000000 !important;
    stroke: #000000 !important;
}
.st-key-gexv3_bridge_code [data-testid="stCode"] button[aria-label*="Copy"]:hover,
.st-key-gexv3_bridge_code [data-testid="stCode"] button[title*="Copy"]:hover {
    background: #ffad52 !important;
    border-color: #ffad52 !important;
}
</style>
"""


'''
          if '_TRADINGVIEW_COPY_BUTTON_CSS' not in text:
              if marker not in text:
                  raise SystemExit('TradingView section marker not found')
              text = text.replace(marker, marker + css, 1)

          old = '''    if is_master:
        st.markdown(
            "**COPY THIS ENTIRE BLOCK INTO GEX TEST → Packed Gamma Levels. The opening and closing double quotes are required and are already included.**"
        )
    elif is_full:
        st.markdown(
            "**REFERENCE ONLY // this mirrors the Google Sheet A6, but use the PINE ROUTER SAFE master for TradingView.**"
        )
    else:
        st.markdown("**COPY THIS ENTIRE SINGLE-TICKER BLOCK INTO GEX TEST → Packed Gamma Levels. Keep the opening and closing double quotes.**")

    st.html(_proven._TRADINGVIEW_CODE_CSS)
    with st.container(key="gexv3_bridge_code"):
        st.code(text or "", language=None, wrap_lines=False)
'''
          new = '''    if is_master:
        st.markdown(
            '**1) CLICK `COPY FOR TRADINGVIEW`  →  2) TradingView `GEX TEST` → `Packed Gamma Levels`  →  3) PASTE. The opening and closing `"` are already included.**'
        )
    elif is_full:
        st.markdown(
            "**REFERENCE ONLY // this mirrors the Google Sheet A6, but use the PINE ROUTER SAFE master for TradingView.**"
        )
    else:
        st.markdown(
            '**1) CLICK `COPY FOR TRADINGVIEW`  →  2) TradingView `GEX TEST` → `Packed Gamma Levels`  →  3) PASTE. Keep both outer `"` characters.**'
        )

    st.html(_proven._TRADINGVIEW_CODE_CSS)
    st.html(_TRADINGVIEW_COPY_BUTTON_CSS)
    with st.container(key="gexv3_bridge_code"):
        st.code(text or "", language=None, wrap_lines=False)
'''
          if old not in text:
              raise SystemExit('Expected TradingView instruction/code block not found')
          text = text.replace(old, new, 1)
          ui.write_text(text)

          workspace = Path('src/gex_workspace_v2.py')
          ws = workspace.read_text()
          old_version = 'GEX_BUILD_VERSION = "v2026.09.17.07"'
          new_version = 'GEX_BUILD_VERSION = "v2026.09.17.08"'
          if old_version not in ws:
              raise SystemExit('Expected build version .07 not found')
          workspace.write_text(ws.replace(old_version, new_version, 1))

          changelog = Path('src/TERMINAL_CHANGELOG.md')
          entry = '''

## 2026-09-17 — Larger TradingView copy control

- **Feature changed:** GEX TradingView Bridge copy/paste interaction.
- **Exact production file(s) changed:** `src/gex_ui_v3.py`, `src/gex_workspace_v2.py`, `src/TERMINAL_CHANGELOG.md`.
- **What was broken:** The Pine-safe payload was correctly wrapped in one opening and one closing double quote, but the actual Streamlit copy control remained a tiny icon that was easy to miss during the TradingView paste workflow.
- **Root cause:** The bridge relied on the default `st.code` copy-button presentation even though copy/paste is the primary action in this subtab.
- **What was changed:** Kept Streamlit's real working clipboard action and enlarged/styled that exact copy control inside only the keyed GEX TradingView bridge container. Its visible label is `COPY FOR TRADINGVIEW`. The instruction line is now a compact three-step copy → TradingView field → paste flow and explicitly says the outer double quotes are already included. Visible GEX build bumped to `v2026.09.17.08`.
- **Important behavior that must remain:** Pine-safe MASTER and single-ticker output must still begin with one `"` before the first `Ticker:` and end with one `"` immediately after the final packed row. Do not quote each line and do not strip the outer quotes when copying.
- **Files/features intentionally NOT changed:** GEX calculations, IV Rank, E*TRADE/session plumbing, Refresh All concurrency/rate limits, TradingView Pine script, Google Sheets full/reference serialization, Risk Sizing, OAuth, Holdings, navigation, Bull Debit, Muni, Orders, shared theme, authentication, and `src/terminal_core.py`.
- **Tests performed:** Python syntax compilation of changed GEX production files; exact quote-contract source assertions; scoped copy-button CSS assertions; `python scripts/validate_architecture.py`; PR changed-file inspection; post-merge architecture guard required.
- **Architecture guard result:** PASS on staging before merge.
- **Commit SHA:** staging commit recorded by GitHub; final production merge SHA recorded after merge.
- **Lesson:** Do not replace a working clipboard mechanism with a custom/fake button. Improve the existing `st.code` clipboard action and scope presentation to the GEX bridge only.
'''
          current = changelog.read_text()
          if '## 2026-09-17 — Larger TradingView copy control' not in current:
              changelog.write_text(current + entry)
          PY

      - name: Validate exact copy and quote contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/gex_ui_v3.py').read_text()
          ws = Path('src/gex_workspace_v2.py').read_text()
          assert 'parser_text = text' in text
          assert "text = f'\"{parser_text.strip()}\"'" in text
          assert 'quoted_transport_ok = is_full or' in text
          assert "text.startswith('\"') and text.endswith('\"')" in text
          assert '_TRADINGVIEW_COPY_BUTTON_CSS' in text
          assert 'COPY FOR TRADINGVIEW' in text
          assert 'st-key-gexv3_bridge_code' in text
          assert 'st.html(_TRADINGVIEW_COPY_BUTTON_CSS)' in text
          assert 'v2026.09.17.08' in ws
          PY
          python -m py_compile src/gex_ui_v3.py src/gex_workspace_v2.py
          python scripts/validate_architecture.py

      - name: Commit and push production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gex_ui_v3.py src/gex_workspace_v2.py src/TERMINAL_CHANGELOG.md
          git commit -m "Improve GEX TradingView copy control"
          git push origin HEAD:gex-better-copy-button-20260917
