name: Temporary Dropdown Hover Readability Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dropdown-hover-readability-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dropdown-hover-readability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production requirements
        run: python -m pip install -r requirements.txt

      - name: Syntax check shared theme and Risk route
        run: python -m py_compile streamlit_app.py src/theme.py src/risk_sizing_ui_v7.py src/risk_sizing_ui_v10.py src/risk_sizing_ui_v9.py src/risk_sizing_ui_v2.py

      - name: Dropdown typography and hover regression
        run: python scripts/test_dropdown_typography.py

      - name: Focused Risk production regression
        run: python scripts/test_risk_production_ui.py

      - name: Top-level tab regression
        run: python scripts/test_tab_layout.py

      - name: Architecture guard
        run: python scripts/validate_architecture.py
