name: Temporary CBOE GEX parity validation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/gex_cboe.py"
      - "scripts/test_gex_cboe.py"
      - ".github/workflows/tmp-cboe-gex-parity.yml"

permissions:
  contents: read

jobs:
  validate-cboe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Syntax check CBOE production path
        run: python -m py_compile src/gex_cboe.py src/gex_ui_v3.py src/gex_github_bridge.py scripts/test_gex_cboe.py
      - name: Run focused CBOE regression
        run: python scripts/test_gex_cboe.py
      - name: Run live CBOE SPY calculation smoke
        run: |
          python scripts/test_gex_cboe.py --live
          python - <<'PY'
          from src.gex_cboe import build_cboe_gex
          result = build_cboe_gex("SPY", 180, "America/New_York", "NET_GEX")
          top = result["topGex"][0]
          print(
              "LIVE SPY 180D // "
              f"spot={result['spot']} // "
              f"callwall={result['callWall']['strike']} // "
              f"putwall={result['putWall']['strike']} // "
              f"gflip={result['gammaFlip']} // "
              f"maxcalloi={result['maxCallOi']['strike']} // "
              f"top={top['strike']}:{top['net_gex']} // "
              f"contracts={result['contractsUsed']}"
          )
          assert result["contractsUsed"] > 0
          assert result["sourceUrl"].endswith("/SPY.json")
          assert result["callWall"]["strike"] == result["maxCallOi"]["strike"]
          assert result["putWall"]["strike"] == min(
              result["rawRows"], key=lambda row: row["net_gex"]
          )["strike"]
          PY
      - name: Architecture guard
        run: python scripts/validate_architecture.py
      - name: Top-level tab smoke
        run: python scripts/test_tab_layout.py
