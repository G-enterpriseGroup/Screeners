name: Temporary Live CBOE Source Smoke

on:
  pull_request:
    paths:
      - "scripts/test_gex_cboe.py"
      - ".github/workflows/cboe-live-smoke.yml"

permissions:
  contents: read

jobs:
  live-cboe-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production requirements
        run: python -m pip install -r requirements.txt
      - name: Verify live CBOE SPY delayed-options schema
        run: python scripts/test_gex_cboe.py --live
