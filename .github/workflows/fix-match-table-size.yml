name: Fix Match Table Sizes

on:
  push:
    paths:
      - '.github/workflows/fix-match-table-size.yml'

permissions:
  contents: write

jobs:
  update-streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated GEX TradingView transport fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          p = Path('src/gex_ui_v3.py')
          t = p.read_text()
          start = t.index('def _render_tradingview_pine_compatible(')
          end = t.index('\n\n# ==============================\n# PUBLIC RENDER WRAPPER\n# ==============================', start)
          fn = r'''def _render_tradingview_pine_compatible(
              state: dict[str, Any],
              result_map: dict[str, Any],
              failures: dict[str, str] | None = None,
          ) -> None:
              """Emit full metadata + packed gamma rows for every TradingView ticker block."""
              saved: list[str] = []
              for value in state.get("tickers", []):
                  ticker = _core._normalize_ticker(value)
                  if ticker and ticker not in saved:
                      saved.append(ticker)
              if not saved:
                  st.info("Add GEX tickers first.")
                  return

              normalized_failures = {
                  _core._normalize_ticker(key): str(value)
                  for key, value in (failures or {}).items()
                  if _core._normalize_ticker(key)
              }
              available = [
                  ticker for ticker in saved
                  if ticker in result_map and ticker not in normalized_failures
              ]
              if not available:
                  st.info("Refresh GEX first. The TradingView bridge is built from refreshed ticker results.")
                  return

              master_label = "MASTER A6 // FULL TICKER BLOCKS — COPY THIS"
              compact_label = "COMPACT PINE // OPTIONAL DIAGNOSTIC"
              choice = st.selectbox(
                  "PACKED GAMMA BLOCK",
                  [master_label, compact_label] + available,
                  key="gexv3_bridge_choice_full_ticker_v5",
              )
              is_master = choice == master_label
              is_compact = choice == compact_label

              if is_master:
                  parser_text = _proven._google_sheets_master_text(
                      result_map, saved, normalized_failures
                  ).strip()
                  filename = "raj_terminal_MASTER_A6_TRADINGVIEW_FULL.txt"
                  expected_headers = saved
                  parser_expected = available
                  mode_text = "FULL TICKER METADATA + PACKED GAMMA LEVELS"
              elif is_compact:
                  parser_text = _proven._pine_master_bridge_text(result_map, available).strip()
                  filename = "raj_terminal_MASTER_A6_COMPACT_DIAGNOSTIC.txt"
                  expected_headers = available
                  parser_expected = available
                  mode_text = "COMPACT TICKER + PACKED ROWS // OPTIONAL"
              else:
                  parser_text = _proven._base._google_sheets_summary_text(result_map[choice]).strip()
                  filename = f"{choice}_gex_tradingview_full.txt"
                  expected_headers = [choice]
                  parser_expected = [choice]
                  mode_text = f"{choice} // FULL TICKER METADATA + PACKED GAMMA LEVELS"

              # Exactly one pair of outer quotes around the complete multiline paste.
              text = f'"{parser_text}"'
              byte_count = len(text.encode("utf-8"))
              headers = _proven._pine_router_headers(parser_text)
              missing_headers = [ticker for ticker in expected_headers if ticker not in headers]
              pine_issues, parsed_counts = _proven._pine_master_issues(parser_text, parser_expected)
              too_large = byte_count > _proven._PINE_TEXT_LIMIT
              quoted_ok = text.startswith('"') and text.endswith('"')
              transport_ok = not missing_headers and not pine_issues and not too_large and quoted_ok

              st.caption(
                  "TRADINGVIEW BRIDGE // " + mode_text
                  + f" // {len(headers)}/{len(expected_headers)} HEADERS // "
                  + f"{byte_count:,}/{_proven._PINE_TEXT_LIMIT:,} CHARS"
              )

              if transport_ok:
                  min_rows = min(parsed_counts.values()) if parsed_counts else 0
                  max_rows = max(parsed_counts.values()) if parsed_counts else 0
                  if is_master and normalized_failures:
                      st.warning(
                          f"TRADINGVIEW MASTER READY // {len(available)} DATA BLOCKS // "
                          f"{len(normalized_failures)} ERROR BLOCKS // {min_rows}-{max_rows} DRAWABLE ROWS PER SUCCESSFUL TICKER"
                      )
                  elif is_master:
                      st.success(
                          f"TRADINGVIEW MASTER CHECK PASS // {len(available)}/{len(saved)} TICKERS // "
                          f"{min_rows}-{max_rows} DRAWABLE PACKED ROWS EACH"
                      )
                  elif is_compact:
                      st.success(f"COMPACT DIAGNOSTIC CHECK PASS // {len(available)} TICKERS")
                  else:
                      st.success(
                          f"{choice} // PINE ROUTER CHECK PASS // "
                          f"{parsed_counts.get(choice, 0)} DRAWABLE PACKED ROWS"
                      )
              else:
                  details = list(missing_headers) + list(pine_issues)
                  if too_large:
                      details.append("TEXT_LIMIT")
                  if not quoted_ok:
                      details.append("MISSING_OUTER_DOUBLE_QUOTES")
                  st.error("PINE ROUTER CHECK FAILED // " + ", ".join(details[:16]))

              verify_ticker = st.selectbox(
                  "PINE CHART TICKER CHECK",
                  available,
                  key="gexv3_pine_chart_ticker_check_full_v5",
                  help="Pick the same symbol as the TradingView chart. This validates the exact full block you should paste.",
              )
              target_issues, target_count = _proven._pine_ticker_issues(parser_text, verify_ticker)
              if target_issues:
                  st.error(f"{verify_ticker} // PINE TARGET FAIL // " + ", ".join(target_issues))
              else:
                  st.success(f"{verify_ticker} // PINE TARGET PASS // {target_count} DRAWABLE PACKED ROWS")

              if is_master:
                  st.markdown(
                      '**COPY FOR TRADINGVIEW includes for EVERY successful ticker: `Ticker`, `Mode`, `Spot`, `Max DTE Used`, `Contracts Used`, `Net Current GEX`, `Source URL`, then the gamma levels. One opening and one closing `"` are already included around the entire payload.**'
                  )
              elif is_compact:
                  st.markdown('**OPTIONAL DIAGNOSTIC ONLY // outer `"` characters are included.**')
              else:
                  st.markdown(
                      f'**{choice} FULL BLOCK // metadata first, gamma levels second. Outer `"` characters are included.**'
                  )

              st.html(_proven._TRADINGVIEW_CODE_CSS)
              st.html(_TRADINGVIEW_COPY_BUTTON_CSS)
              with st.container(key="gexv3_bridge_code"):
                  st.code(text or "", language=None, wrap_lines=False)
              st.download_button(
                  "DOWNLOAD MASTER A6" if is_master else "DOWNLOAD PACKED GAMMA BLOCK",
                  data=text,
                  file_name=filename,
                  mime="text/plain",
                  width="stretch",
                  disabled=not bool(text.strip()),
                  key="gexv3_download_bridge",
              )
          '''
          t = t[:start] + textwrap.dedent(fn) + t[end:]
          t = t.replace(
              'known-good compact Pine transport as the default copy payload.',
              'full per-ticker TradingView transport as the default copy payload.',
              1,
          )
          p.write_text(t)

          w = Path('src/gex_workspace_v2.py')
          wt = w.read_text()
          wt = wt.replace(
              'GEX_BUILD_VERSION = "v2026.09.17.08"',
              'GEX_BUILD_VERSION = "v2026.09.17.09"',
              1,
          )
          w.write_text(wt)

          c = Path('src/TERMINAL_CHANGELOG.md')
          entry = '''\n\n## 2026-09-17 — Full per-ticker TradingView GEX blocks\n\n- **Feature changed:** GEX TradingView Bridge copy/paste transport.\n- **Exact production file(s) changed:** `src/gex_ui_v3.py`, `src/gex_workspace_v2.py`, `src/TERMINAL_CHANGELOG.md`.\n- **What was broken:** The default TradingView copy payload had become too compact and omitted the metadata header used by the proven working multi-ticker paste.\n- **Root cause:** The prior export optimized for parser-minimal `Ticker:` plus packed rows even though the uploaded Pine script safely ignores summary rows and reads `Mode`, `Max DTE Used`, `Contracts Used`, and `Net Current GEX` metadata inside the matched ticker block.\n- **What was changed:** Default MASTER now emits, for every refreshed ticker, `Ticker`, `Mode`, `Spot`, `Max DTE Used`, `Contracts Used`, `Net Current GEX`, `Source URL`, then the existing Pine instruction/separator and packed gamma rows. The complete multi-ticker payload is wrapped exactly once with one opening and one closing double quote. Compact Pine remains optional diagnostic only. Build bumped to `v2026.09.17.09`.\n- **Important behavior that must remain:** Keep metadata + gamma levels together for each ticker, preserve exact `Ticker:` boundaries, and never quote each line individually.\n- **Files/features intentionally NOT changed:** GEX math, IV Rank, E*TRADE/session plumbing, refresh concurrency/rate limits, Pine script, Risk Sizing, OAuth, Holdings, navigation, Bull Debit, Muni, Orders, theme, authentication, and `src/terminal_core.py`.\n- **Tests performed:** Python syntax compilation, quote/metadata source assertions, `python scripts/validate_architecture.py`, PR changed-file inspection, and post-merge architecture guard.\n- **Architecture guard result:** PASS required before merge.\n- **Commit SHA:** code commit recorded on staging branch; final production merge SHA recorded by GitHub after merge.\n- **Lesson:** Match the proven full ticker block for TradingView: metadata first, gamma rows second, one quoted multiline payload.\n'''
          c.write_text(c.read_text().rstrip() + entry)
          PY

      - name: Validate
        run: |
          python -m py_compile src/gex_ui_v3.py src/gex_workspace_v2.py
          python - <<'PY'
          from pathlib import Path
          t = Path('src/gex_ui_v3.py').read_text()
          for x in [
              'FULL TICKER METADATA + PACKED GAMMA LEVELS',
              '_proven._google_sheets_master_text(',
              'text = f\'"{parser_text}"\'',
              '`Ticker`, `Mode`, `Spot`, `Max DTE Used`, `Contracts Used`, `Net Current GEX`, `Source URL`',
          ]:
              assert x in t, x
          assert 'GEX_BUILD_VERSION = "v2026.09.17.09"' in Path('src/gex_workspace_v2.py').read_text()
          PY
          python scripts/validate_architecture.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gex_ui_v3.py src/gex_workspace_v2.py src/TERMINAL_CHANGELOG.md
          git commit -m "Restore full ticker TradingView GEX blocks"
          git push
