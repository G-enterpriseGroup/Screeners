name: Temporary Performance Validation

on:
  pull_request:
    paths:
      - "streamlit_app.py"
      - "src/**"
      - "scripts/test_performance_ui.py"
      - "scripts/test_tab_layout.py"
      - ".github/workflows/performance-validation-temp.yml"

permissions:
  contents: read

jobs:
  performance-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install production requirements
        run: python -m pip install -r requirements.txt

      - name: Syntax check affected production files
        run: |
          python -m py_compile \
            streamlit_app.py \
            src/performance_ui.py \
            src/etrade_client.py \
            src/tab_bar_v4.py \
            src/production_manifest.py \
            scripts/validate_architecture.py \
            scripts/test_performance_ui.py

      - name: Test Performance analytics
        run: python scripts/test_performance_ui.py

      - name: Render every production top-level tab
        run: python scripts/test_tab_layout.py

      - name: Validate architecture
        run: python scripts/validate_architecture.py
