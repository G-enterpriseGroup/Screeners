name: Temporary Risk Book Validation

on:
  push:
    branches:
      - fix/risk-book-integrated-checkbox-layout

permissions:
  contents: read

jobs:
  validate-risk-book:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production requirements
        run: python -m pip install -r requirements.txt

      - name: Syntax check Risk production path
        run: python -m py_compile src/risk_sizing_ui_v2.py src/risk_sizing_ui_v9.py src/risk_sizing_ui_v10.py src/risk_sizing_ui_v7.py streamlit_app.py

      - name: Architecture guard
        run: python scripts/validate_architecture.py

      - name: Risk intent regression
        run: python scripts/test_risk_intent_override.py

      - name: Top-level tab smoke test
        run: python scripts/test_tab_layout.py
