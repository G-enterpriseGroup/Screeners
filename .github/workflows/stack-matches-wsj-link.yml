name: Force Square Bloomberg UI

on:
  push:
    paths:
      - '.github/workflows/stack-matches-wsj-link.yml'

permissions:
  contents: write

jobs:
  update-streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove all rounded corners
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('streamlit_app.py')
          text = path.read_text(encoding='utf-8')

          marker = '''    hr {
        border-color:var(--bb-orange) !important;
    }
'''

          square_css = '''    hr {
        border-color:var(--bb-orange) !important;
    }

    /* Bloomberg terminal: force hard square corners everywhere */
    *, *::before, *::after {
        border-radius:0 !important;
    }

    [data-baseweb],
    [data-baseweb] > div,
    [data-baseweb] > div > div,
    [data-testid],
    [data-testid] > div,
    [data-testid] > div > div,
    button,
    input,
    textarea,
    select,
    summary,
    a[role="button"] {
        border-radius:0 !important;
    }
'''

          if 'Bloomberg terminal: force hard square corners everywhere' not in text:
              if marker not in text:
                  raise SystemExit('CSS marker not found')
              text = text.replace(marker, square_css, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit square-corner change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git commit -m "Force square Bloomberg UI corners" || exit 0
          git push
