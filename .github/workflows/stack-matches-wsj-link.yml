name: Fix Dataframe Borders

on:
  push:
    paths:
      - '.github/workflows/stack-matches-wsj-link.yml'

permissions:
  contents: write

jobs:
  update-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fix all Streamlit dataframe borders
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('streamlit_app.py')
          text = path.read_text(encoding='utf-8')

          old = '''    [data-testid="stDataFrame"] {
        border:1px solid var(--bb-orange) !important;
        border-radius:0 !important;
    }
'''

          new = '''    [data-testid="stDataFrame"] {
        border:1px solid var(--bb-orange) !important;
        border-radius:0 !important;
        box-sizing:border-box !important;
        overflow:hidden !important;
        outline:1px solid var(--bb-orange) !important;
        outline-offset:-1px !important;
        box-shadow:inset 0 0 0 1px var(--bb-orange) !important;
    }

    [data-testid="stDataFrame"] > div,
    [data-testid="stDataFrame"] [role="grid"] {
        box-sizing:border-box !important;
    }

    [data-testid="stDataFrame"] [role="grid"] {
        border-bottom:1px solid var(--bb-orange) !important;
    }
'''

          if old not in text:
              raise SystemExit('Original dataframe border CSS block not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git commit -m "Fix orange borders around all dataframes"
          git push
