name: GEX final fallback parity

on:
  push:
    branches:
      - gex-final-fallback-parity-20260916

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: gex-final-fallback-parity-20260916
          fetch-depth: 0

      - name: Patch exact Apps Script fallback parity and architecture map
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {count}")
              return text.replace(old, new, 1)

          gex_path = Path("src/gex_ui.py")
          gex = gex_path.read_text(encoding="utf-8")
          gex = replace_once(
              gex,
              "    if iv > 5.0:\n        iv /= 100.0",
              "    if iv > 3.0:\n        iv /= 100.0",
              "IV percent normalization cutoff",
          )
          gex = replace_once(
              gex,
              '''    return iv if 0.0 < iv < 5.0 else None\n\n\ndef _parse_contracts''',
              '''    return iv if 0.0 < iv < 5.0 else None\n\n\ndef _script_bs_gamma(spot: float, strike: float, dte: int, iv: float) -> float:\n    \"\"\"Match the supplied Apps Script fallback gamma exactly.\"\"\"\n    if not spot or not strike or not dte:\n        return 0.0\n    t = max(float(dte) / 365.0, 1.0 / 365.0)\n    sigma = max(float(iv or DEFAULT_IV), 0.05)\n    sqrt_t = math.sqrt(t)\n    d1 = (math.log(float(spot) / float(strike)) + (0.5 * sigma * sigma) * t) / (sigma * sqrt_t)\n    return math.exp(-0.5 * d1 * d1) / math.sqrt(2.0 * math.pi) / (float(spot) * sigma * sqrt_t)\n\n\ndef _parse_contracts''',
              "Apps Script fallback gamma helper",
          )
          gex = replace_once(
              gex,
              "                else _legacy._bs_gamma(spot, float(strike), iv, dte)",
              "                else _script_bs_gamma(spot, float(strike), dte, iv)",
              "current gamma fallback",
          )
          gex_path.write_text(gex, encoding="utf-8")

          arch_path = Path("src/ARCHITECTURE.md")
          arch = arch_path.read_text(encoding="utf-8")
          arch = replace_once(
              arch,
              '''| GEX terminal wrapper/context | `src/gex_workspace_v2.py` | `src/gex_ui_v3.py` | Risk/OAuth/Holdings files |\n| GEX UI / subtabs / tables | `src/gex_ui_v3.py` | `src/gex_ui.py` only when legacy calculation helpers are intentionally reused | `streamlit_app.py` for ordinary GEX layout changes |''',
              '''| GEX terminal wrapper/context | `src/gex_workspace_v2.py` | `src/gex_ui_v3.py` | Risk/OAuth/Holdings files |\n| GEX UI / subtabs / tables / TradingView bridge | `src/gex_ui_v3.py` | `src/gex_ui_v3_proven.py`, `src/gex_ui_v3_base.py` | `streamlit_app.py` for ordinary GEX layout changes |\n| GEX formulas / wall / gamma-flip / IV-rank data | `src/gex_ui.py` | `src/gex_ui_legacy.py` for preserved legacy helpers only | Risk/OAuth/Holdings/navigation files |''',
              "GEX production feature map",
          )
          arch = replace_once(
              arch,
              '''Production path:\n\n`streamlit_app.py` → `src/gex_workspace_v2.py` → `src/gex_ui_v3.py`\n\n- Change **subtabs, tables, multi-ticker layout, settings, notes, TradingView presentation** → `src/gex_ui_v3.py`.\n- Change **how GEX obtains the live E*TRADE client / vault key / session touch callback** → `src/gex_workspace_v2.py`.\n- Do not patch global Streamlit functions from GEX.''',
              '''Production path:\n\n`streamlit_app.py` → `src/gex_workspace_v2.py` → `src/gex_ui_v3.py` → preserved `src/gex_ui_v3_proven.py` / `src/gex_ui_v3_base.py`, with calculations supplied by `src/gex_ui.py` and preserved helper compatibility from `src/gex_ui_legacy.py`.\n\n- Change **subtabs, tables, multi-ticker layout, settings, notes, TradingView presentation** → `src/gex_ui_v3.py`; preserve the proven TradingView/A6 contract unless Raj explicitly requests a bridge change.\n- Change **GEX formulas, Call/Put Wall selection, gamma flip, option parsing fallback math, or IV-rank data derivation** → `src/gex_ui.py`.\n- Treat `src/gex_ui_v3_proven.py` and `src/gex_ui_legacy.py` as preserved compatibility modules; do not casually edit them while fixing a new UI or formula issue.\n- Change **how GEX obtains the live E*TRADE client / vault key / session touch callback or GEX-only request cache/prefetch behavior** → `src/gex_workspace_v2.py`.\n- Do not patch global Streamlit functions from GEX.''',
              "GEX edit map",
          )
          arch_path.write_text(arch, encoding="utf-8")

          guard_path = Path("scripts/validate_architecture.py")
          guard = guard_path.read_text(encoding="utf-8")
          guard = replace_once(
              guard,
              '''    SRC / "gex_workspace_v2.py",\n    SRC / "gex_ui_v3.py",\n    SRC / "gex_ui_v3_base.py",''',
              '''    SRC / "gex_workspace_v2.py",\n    SRC / "gex_ui.py",\n    SRC / "gex_ui_legacy.py",\n    SRC / "gex_ui_v3.py",\n    SRC / "gex_ui_v3_proven.py",\n    SRC / "gex_ui_v3_base.py",''',
              "GEX architecture-guard files",
          )
          guard_path.write_text(guard, encoding="utf-8")
          PY

      - name: Syntax and exact fallback tests
        shell: bash
        run: |
          python -m py_compile src/gex_ui.py src/gex_ui_legacy.py src/gex_ui_v3.py src/gex_ui_v3_proven.py src/gex_ui_v3_base.py src/gex_workspace_v2.py streamlit_app.py
          python scripts/validate_architecture.py
          python - <<'PY'
          import ast, math
          from pathlib import Path
          from typing import Any

          text = Path('src/gex_ui.py').read_text(encoding='utf-8')
          tree = ast.parse(text)
          wanted = {'_normalize_observed_iv', '_script_bs_gamma'}
          nodes = [node for node in tree.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in wanted]
          assert {node.name for node in nodes} == wanted
          module = ast.Module(body=nodes, type_ignores=[])
          ast.fix_missing_locations(module)
          ns = {'math': math, 'Any': Any, 'DEFAULT_IV': 0.35}
          exec(compile(module, 'gex_exact_helpers', 'exec'), ns)
          norm = ns['_normalize_observed_iv']
          gamma = ns['_script_bs_gamma']
          assert abs(norm(0.3145) - 0.3145) < 1e-12
          assert abs(norm(31.45) - 0.3145) < 1e-12
          assert gamma(100.0, 100.0, 0, 0.30) == 0.0
          expected = 0.04634181533763664
          assert abs(gamma(100.0, 100.0, 30, 0.30) - expected) < 1e-12
          parse = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == '_parse_contracts')
          parse_text = ast.unparse(parse)
          assert '_script_bs_gamma' in parse_text
          assert '_legacy._bs_gamma' not in parse_text

          app = Path('streamlit_app.py').read_text(encoding='utf-8')
          for marker in [
              'from src.gex_workspace_v2 import render_gex as render_gex_workspace',
              'active_tab == "HOLDINGS"',
              'active_tab == "RISK SIZING"',
              'active_tab == "GEX"',
              'active_tab == "BULL DEBIT SPREAD"',
              'active_tab == "MUNI SCREENERS"',
              'active_tab == "ORDERS"',
          ]:
              assert marker in app, marker
          print('GEX EXACT FALLBACK TEST: PASS')
          print('TOP-LEVEL ROUTE ASSERTIONS: PASS')
          PY

      - name: Commit tested code and permanent history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gex_ui.py src/ARCHITECTURE.md scripts/validate_architecture.py
          git commit -m "Match final GEX fallback math to Apps Script"
          CODE_SHA=$(git rev-parse HEAD)
          cat >> src/TERMINAL_CHANGELOG.md <<EOF

## 2026-09-16 — Exact Apps Script fallback gamma parity + GEX guard coverage

- **Feature changed:** GEX formula parity and production architecture coverage.
- **Exact production file(s) changed:** \`src/gex_ui.py\`, \`src/ARCHITECTURE.md\`, \`scripts/validate_architecture.py\`, \`src/TERMINAL_CHANGELOG.md\`.
- **What was broken:** The main GEX wall/flip definitions already matched the supplied Apps Script, but the rare fallback path used when E*TRADE omits option gamma still called the legacy Black–Scholes helper, which includes a risk-free-rate term and nonzero 0-DTE fallback. The Apps Script uses no rate term, a 5% IV floor, and zero gamma when DTE is zero. E*TRADE IV normalization also needed to use the script's percent cutoff. The architecture guard did not yet parse the newly introduced GEX calculation/proven compatibility modules.
- **Root cause:** The first parity pass intentionally delegated unchanged helpers to the preserved legacy module, leaving one fallback helper with legacy math. The production map also predated the new adapter/proven-module split.
- **What was changed:** Added a GEX-local Apps Script fallback gamma helper; E*TRADE feed gamma remains authoritative when present, but missing gamma now uses the exact script formula and zeroes 0-DTE just like the reference. IV values above 3 are normalized as percentages, matching the supplied script. Updated \`src/ARCHITECTURE.md\` to record the real production GEX dependency path and extended \`scripts/validate_architecture.py\` to parse \`src/gex_ui.py\`, \`src/gex_ui_legacy.py\`, and \`src/gex_ui_v3_proven.py\` on every guard run.
- **Important behavior that must remain:** Full eligible E*TRADE expiration coverage, 4-way ticker scheduling, 20 chain-prefetch slots, batch quotes, caches, MASTER A6/Pine serialization, and IV Rank behavior remain unchanged. The TradingView script was not changed.
- **Files/features intentionally NOT changed:** \`src/gex_ui_v3.py\`, \`src/gex_ui_v3_proven.py\`, \`src/gex_ui_v3_base.py\`, \`src/gex_workspace_v2.py\`, \`src/etrade_client.py\`, Risk Sizing, OAuth, Holdings, Bull Debit, Muni, Orders, navigation, theme, and \`src/terminal_core.py\`.
- **Tests performed:** Python syntax compilation of every production GEX layer and \`streamlit_app.py\`; \`python scripts/validate_architecture.py\`; AST-executed tests of the exact production IV-normalization and fallback-gamma helpers; assertion that \`_parse_contracts\` uses only the script fallback helper; static assertions that all six top-level terminal routes remain present.
- **Architecture guard result:** PASS.
- **Commit SHA:** \`${CODE_SHA}\` (tested code commit); plus the following append-only changelog commit.
- **Lesson:** Script parity must include fallback math, not only the normal live-feed path. When production is split into adapters/proven compatibility modules, the architecture map and guard must be updated in the same fix so future edits trace the real import graph.
EOF
          git add src/TERMINAL_CHANGELOG.md
          git rm .github/workflows/gex-final-fallback-parity.yml
          git commit -m "Record final GEX fallback parity fix"
          git push origin HEAD:gex-final-fallback-parity-20260916
