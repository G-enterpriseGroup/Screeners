# one-time staging trigger
name: Stage full ticker TradingView transport

on:
  push:
    branches:
      - gex-full-ticker-tradingview-20260917

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gex-full-ticker-tradingview-20260917
          fetch-depth: 0

      - name: Apply isolated GEX TradingView transport fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          ui = Path('src/gex_ui_v3.py')
          text = ui.read_text()
          start = text.index('def _render_tradingview_pine_compatible(')
          end = text.index('\n\n# ==============================\n# PUBLIC RENDER WRAPPER\n# ==============================', start)
          new_func = r'''def _render_tradingview_pine_compatible(
              state: dict[str, Any],
              result_map: dict[str, Any],
              failures: dict[str, str] | None = None,
          ) -> None:
              """Emit the full per-ticker block consumed by Raj's GEX TEST input.

              Every successful ticker keeps the human-readable metadata header
              (Ticker/Mode/Spot/DTE/Contracts/Net GEX/Source URL) immediately
              before the packed gamma rows. The uploaded Pine router explicitly
              ignores non-packed summary lines while it is inside the matching
              ticker block, so this format preserves both metadata and drawable
              gamma levels. The entire multi-ticker payload is wrapped once in
              one opening and one closing double quote for TradingView paste.
              """
              saved: list[str] = []
              for value in state.get("tickers", []):
                  ticker = _core._normalize_ticker(value)
                  if ticker and ticker not in saved:
                      saved.append(ticker)
              if not saved:
                  st.info("Add GEX tickers first.")
                  return

              normalized_failures = {
                  _core._normalize_ticker(key): str(value)
                  for key, value in (failures or {}).items()
                  if _core._normalize_ticker(key)
              }
              available = [
                  ticker
                  for ticker in saved
                  if ticker in result_map and ticker not in normalized_failures
              ]
              if not available:
                  st.info("Refresh GEX first. The TradingView bridge is built from refreshed ticker results.")
                  return

              master_label = "MASTER A6 // FULL TICKER BLOCKS — COPY THIS"
              compact_label = "COMPACT PINE // OPTIONAL DIAGNOSTIC"
              options = [master_label, compact_label] + available
              choice = st.selectbox(
                  "PACKED GAMMA BLOCK",
                  options,
                  key="gexv3_bridge_choice_full_ticker_v5",
              )

              is_master = choice == master_label
              is_compact = choice == compact_label
              if is_master:
                  parser_text = _proven._google_sheets_master_text(
                      result_map,
                      saved,
                      normalized_failures,
                  ).strip()
                  filename = "raj_terminal_MASTER_A6_TRADINGVIEW_FULL.txt"
                  expected_headers = saved
                  parser_expected = available
                  mode_text = "FULL TICKER METADATA + PACKED GAMMA LEVELS"
              elif is_compact:
                  parser_text = _proven._pine_master_bridge_text(result_map, available).strip()
                  filename = "raj_terminal_MASTER_A6_COMPACT_DIAGNOSTIC.txt"
                  expected_headers = available
                  parser_expected = available
                  mode_text = "COMPACT Ticker: + PACKED ROWS ONLY // OPTIONAL"
              else:
                  parser_text = _proven._base._google_sheets_summary_text(result_map[choice]).strip()
                  filename = f"{choice}_gex_tradingview_full.txt"
                  expected_headers = [choice]
                  parser_expected = [choice]
                  mode_text = f"{choice} // FULL TICKER METADATA + PACKED GAMMA LEVELS"

              text = f'"{parser_text}"'

              byte_count = len(text.encode("utf-8"))
              headers = _proven._pine_router_headers(parser_text)
              missing_headers = [ticker for ticker in expected_headers if ticker not in headers]
              pine_issues, parsed_counts = _proven._pine_master_issues(parser_text, parser_expected)
              too_large = byte_count > _proven._PINE_TEXT_LIMIT
              quoted_transport_ok = text.startswith('"') and text.endswith('"')
              transport_ok = not missing_headers and not pine_issues and not too_large and quoted_transport_ok

              st.caption(
                  "TRADINGVIEW BRIDGE // "
                  + mode_text
                  + f" // {len(headers)}/{len(expected_headers)} HEADERS // {byte_count:,}/{_proven._PINE_TEXT_LIMIT:,} CHARS"
              )

              if transport_ok:
                  min_rows = min(parsed_counts.values()) if parsed_counts else 0
                  max_rows = max(parsed_counts.values()) if parsed_counts else 0
                  if is_master and normalized_failures:
                      st.warning(
                          f"TRADINGVIEW MASTER READY // {len(available)} DATA BLOCKS // "
                          f"{len(normalized_failures)} ERROR BLOCKS // {min_rows}-{max_rows} DRAWABLE ROWS PER SUCCESSFUL TICKER"
                      )
                  elif is_master:
                      st.success(
                          f"TRADINGVIEW MASTER CHECK PASS // {len(available)}/{len(saved)} TICKERS // "
                          f"{min_rows}-{max_rows} DRAWABLE PACKED ROWS EACH"
                      )
                  elif is_compact:
                      st.success(f"COMPACT DIAGNOSTIC CHECK PASS // {len(available)} TICKERS")
                  else:
                      st.success(
                          f"{choice} // PINE ROUTER CHECK PASS // {parsed_counts.get(choice, 0)} DRAWABLE PACKED ROWS"
                      )
              else:
                  details = list(missing_headers) + list(pine_issues)
                  if too_large:
                      details.append("TEXT_LIMIT")
                  if not quoted_transport_ok:
                      details.append("MISSING_OUTER_DOUBLE_QUOTES")
                  st.error("PINE ROUTER CHECK FAILED // " + ", ".join(details[:16]))

              verify_ticker = st.selectbox(
                  "PINE CHART TICKER CHECK",
                  available,
                  key="gexv3_pine_chart_ticker_check_full_v5",
                  help="Pick the same symbol as the TradingView chart. This validates the exact full ticker block you should paste.",
              )
              target_issues, target_count = _proven._pine_ticker_issues(parser_text, verify_ticker)
              if target_issues:
                  st.error(f"{verify_ticker} // PINE TARGET FAIL // " + ", ".join(target_issues))
              else:
                  st.success(f"{verify_ticker} // PINE TARGET PASS // {target_count} DRAWABLE PACKED ROWS")

              if is_master:
                  st.markdown(
                      '**COPY FOR TRADINGVIEW includes, for EVERY successful ticker: `Ticker`, `Mode`, `Spot`, `Max DTE Used`, `Contracts Used`, `Net Current GEX`, `Source URL`, then the gamma rows. One opening and one closing `"` are already included around the entire payload.**'
                  )
              elif is_compact:
                  st.markdown(
                      '**OPTIONAL DIAGNOSTIC ONLY // compact ticker headers + packed rows. Outer `"` characters are included.**'
                  )
              else:
                  st.markdown(
                      f'**{choice} FULL BLOCK // metadata first, gamma rows second. Outer `"` characters are included.**'
                  )

              st.html(_proven._TRADINGVIEW_CODE_CSS)
              st.html(_TRADINGVIEW_COPY_BUTTON_CSS)
              with st.container(key="gexv3_bridge_code"):
                  st.code(text or "", language=None, wrap_lines=False)
              st.download_button(
                  "DOWNLOAD MASTER A6" if is_master else "DOWNLOAD PACKED GAMMA BLOCK",
                  data=text,
                  file_name=filename,
                  mime="text/plain",
                  width="stretch",
                  disabled=not bool(text.strip()),
                  key="gexv3_download_bridge",
              )
          '''
          new_func = textwrap.dedent(new_func)
          text = text[:start] + new_func + text[end:]
          text = text.replace(
              'known-good compact Pine transport as the default copy payload.',
              'full per-ticker TradingView transport as the default copy payload.',
              1,
          )
          ui.write_text(text)

          workspace = Path('src/gex_workspace_v2.py')
          w = workspace.read_text()
          old = 'GEX_BUILD_VERSION = "v2026.09.17.08"'
          new = 'GEX_BUILD_VERSION = "v2026.09.17.09"'
          if old not in w:
              raise SystemExit('Expected .08 build marker not found')
          workspace.write_text(w.replace(old, new, 1))

          changelog = Path('src/TERMINAL_CHANGELOG.md')
          entry = r'''

## 2026-09-17 — Full per-ticker TradingView GEX blocks

- **Feature changed:** GEX TradingView Bridge copy/paste transport.
- **Exact production file(s) changed:** `src/gex_ui_v3.py`, `src/gex_workspace_v2.py`, `src/TERMINAL_CHANGELOG.md`.
- **What was broken:** The default TradingView copy payload had become too compact. Raj's working GEX TEST workflow expects each ticker section to preserve its metadata header before the drawable gamma rows.
- **Root cause:** The prior Pine-safe export optimized for parser-minimal `Ticker:` plus packed rows even though the uploaded Pine script safely ignores non-packed summary rows and also reads `Mode`, `Max DTE Used`, `Contracts Used`, and `Net Current GEX` metadata inside the matching ticker section.
- **What was changed:** The default MASTER copy now emits the full deterministic per-ticker summary block for every refreshed ticker: `Ticker`, `Mode`, `Spot`, `Max DTE Used`, `Contracts Used`, `Net Current GEX`, `Source URL`, then the existing Pine instruction/separator and `SPOT/GFLIP/CALLWALL/PUTWALL/MAXCALLOI/MAXPUTOI/GEXPOS*/GEXNEG*` rows. The complete multi-ticker payload remains wrapped exactly once in one opening and one closing double quote. Compact Pine remains available only as an optional diagnostic. Build bumped to `v2026.09.17.09`.
- **Important behavior that must remain:** Do not remove per-ticker metadata from the default TradingView copy block. Do not quote every line. Keep one quote around the entire paste and preserve each exact `Ticker:` boundary so the Pine router can select the chart symbol.
- **Files/features intentionally NOT changed:** GEX formulas/math, IV Rank, E*TRADE request/session plumbing, Refresh All concurrency/rate limits, TradingView Pine script, Risk Sizing, OAuth, Holdings, navigation, Bull Debit, Muni, Orders, shared theme, authentication, and `src/terminal_core.py`.
- **Tests performed:** Python syntax compilation for changed GEX production files; source assertions for every required metadata label, packed gamma serializer usage, and outer quote contract; `python scripts/validate_architecture.py`; PR changed-file inspection; post-merge architecture guard required.
- **Architecture guard result:** PASS required before merge.
- **Commit SHA:** code commit recorded on staging branch; final production merge SHA recorded by GitHub after merge.
- **Lesson:** The TradingView transport must match the proven working full ticker block, not merely the minimum parser grammar. Preserve metadata + gamma rows together and keep the whole multi-ticker dump as one quoted paste value.
          '''
          changelog.write_text(changelog.read_text().rstrip() + textwrap.dedent(entry).rstrip() + '\n')
          PY

      - name: Validate production files
        run: |
          python -m py_compile src/gex_ui_v3.py src/gex_workspace_v2.py
          python - <<'PY'
          from pathlib import Path
          text = Path('src/gex_ui_v3.py').read_text()
          for required in [
              'FULL TICKER METADATA + PACKED GAMMA LEVELS',
              '_proven._google_sheets_master_text(',
              'text = f\'"{parser_text}"\'',
              '`Ticker`, `Mode`, `Spot`, `Max DTE Used`, `Contracts Used`, `Net Current GEX`, `Source URL`',
          ]:
              assert required in text, required
          assert 'GEX_BUILD_VERSION = "v2026.09.17.09"' in Path('src/gex_workspace_v2.py').read_text()
          PY
          python scripts/validate_architecture.py

      - name: Commit production GEX files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gex_ui_v3.py src/gex_workspace_v2.py src/TERMINAL_CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "Restore full ticker TradingView GEX blocks"
          git push origin HEAD:gex-full-ticker-tradingview-20260917
