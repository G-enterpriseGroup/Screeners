name: Set State Tax IG Default

on:
  push:
    paths:
      - '.github/workflows/set-state-ig-default.yml'

permissions:
  contents: write

jobs:
  update-streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Default investment grade checkbox to checked
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('streamlit_app.py')
          t = p.read_text(encoding='utf-8')
          old = '''        ig_only = st.checkbox(\n            "Investment grade only",\n            key="state_ig",\n        )\n'''
          new = '''        ig_only = st.checkbox(\n            "Investment grade only",\n            value=True,\n            key="state_ig",\n        )\n'''
          if old not in t:
              raise SystemExit('State IG checkbox block not found')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py
          git commit -m "Default state tax comparison to investment grade"
          git push
