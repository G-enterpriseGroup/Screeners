name: Temporary GEX CBOE Format Validation

on:
  push:
    branches:
      - fix/gex-cboe-tradingview-clean-format-20261004

permissions:
  contents: read

jobs:
  validate-gex-cboe-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production requirements
        run: python -m pip install -r requirements.txt
      - name: Syntax-check changed GEX files
        run: python -m py_compile src/gex_ui_v3.py scripts/test_gex_cboe.py
      - name: Run focused CBOE regression
        run: python scripts/test_gex_cboe.py
      - name: Validate architecture
        run: python scripts/validate_architecture.py
      - name: Render top-level tabs
        run: python scripts/test_tab_layout.py
