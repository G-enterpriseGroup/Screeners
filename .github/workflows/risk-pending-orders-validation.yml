name: Risk Pending Orders Validation

on:
  pull_request:
    paths:
      - "src/theme.py"
      - "src/etrade_client.py"
      - "src/risk_sizing_ui_v10.py"
      - "src/ARCHITECTURE.md"
      - "scripts/test_risk_production_ui.py"
      - "scripts/test_risk_live_order_helpers.py"
      - "scripts/test_tab_layout.py"
      - "scripts/validate_architecture.py"
      - ".github/workflows/risk-pending-orders-validation.yml"

permissions:
  contents: read

jobs:
  validate-risk-pending-orders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production requirements
        run: python -m pip install -r requirements.txt

      - name: Syntax check changed production path
        run: >
          python -m py_compile
          src/theme.py
          src/etrade_client.py
          src/risk_sizing_ui_v10.py
          scripts/test_risk_production_ui.py
          scripts/test_risk_live_order_helpers.py
          scripts/test_tab_layout.py
          scripts/validate_architecture.py

      - name: Test Risk production interactions
        run: python scripts/test_risk_production_ui.py

      - name: Test Risk live-order helpers
        run: python scripts/test_risk_live_order_helpers.py

      - name: Render every top-level tab
        run: python scripts/test_tab_layout.py

      - name: Validate architecture
        run: python scripts/validate_architecture.py
