name: Vertical Options Repair Workbench
on:
  push:
    branches: [fix/vo-seamless-execution-20261106]
    paths:
      - scripts/_vo_repair_patch.py
      - .github/workflows/vo-repair-workbench.yml
permissions:
  contents: write
concurrency:
  group: vo-repair-workbench
  cancel-in-progress: false
jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vo-seamless-execution-20261106
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact source and dependencies for offline debugging
        run: |
          mkdir -p /tmp/vo-offline/wheels /tmp/vo-evidence
          git archive HEAD -o /tmp/vo-offline/source.zip
          python -m pip download --only-binary=:all: --python-version 3.13 --implementation cp --abi cp313 --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 --dest /tmp/vo-offline/wheels 'streamlit>=1.61,<2' 'yfinance>=1.7,<2' requests-oauthlib webauthn selenium
      - uses: actions/upload-artifact@v4
        with:
          name: vo-offline-workbench
          path: /tmp/vo-offline
          retention-days: 3
      - name: Apply bounded patch and syntax-check
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/_vo_repair_patch.py');text=p.read_text()
          anchor='    if text.count(old) != 1:\n'
          replacement='    if old == "    store.prune_before(_minimum_expiry_date())":\n        start = text.index(old, text.index("def _rank_cached_vertical_chains("))\n        return text[:start] + text[start:].replace(old, new, 1)\n' + anchor
          assert text.count(anchor)==1
          text=text.replace(anchor,replacement,1)
          text=text.replace("'   if(NUMERIC.has(openKey))syncNumericInputs();'", "'  if(NUMERIC.has(openKey))syncNumericInputs();'")
          text=text.replace("'   if(NUMERIC.has(openKey)){syncNumericInputs();updateBandPreview();}'", "'  if(NUMERIC.has(openKey)){syncNumericInputs();updateBandPreview();}'")
          text=text.replace('assert changed <= allowed, changed - allowed','changed.discard("scripts/_vo_repair_patch.py")\nassert changed <= allowed, changed - allowed')
          p.write_text(text)
          PY
          python scripts/_vo_repair_patch.py
          python -m py_compile src/vertical_options.py src/vertical_options_ui.py src/vertical_options_execution.py src/vertical_options_store.py
          python scripts/validate_architecture.py
          python - <<'PY'
          import subprocess
          from pathlib import Path
          for name in ('vo_pricing_preference_v1', 'vo_spread_scroller_v1'):
              html = Path('src/components', name, 'index.html').read_text()
              js = html.split('<script>', 1)[1].split('</script>', 1)[0]
              file = Path('/tmp', name + '.js');file.write_text(js)
              subprocess.run(['node', '--check', str(file)], check=True)
          PY
          git diff --check
      - name: Save isolated source changes on workbench branch
        run: |
          git config user.name 'G-enterpriseGroup'
          git config user.email '143067071+G-enterpriseGroup@users.noreply.github.com'
          git add src/vertical_options.py src/vertical_options_ui.py src/vertical_options_store.py src/vertical_options_execution.py src/components/vo_pricing_preference_v1/index.html src/components/vo_spread_scroller_v1/index.html src/TERMINAL_CHANGELOG.md
          git commit -m 'Repair desktop vertical startup, quote display, filters and ASK-only smart execution'
          git push origin HEAD:fix/vo-seamless-execution-20261106
          git rev-parse HEAD
      - name: Install production and browser test dependencies
        run: python -m pip install -r requirements.txt selenium==4.36.0
      - name: Run feature and neighboring regression tests
        run: |
          set +e
          python -m unittest tests.test_vertical_execution tests.test_vertical_options tests.test_verti_phone > /tmp/vo-evidence/unit.log 2>&1
          unit=$?
          python scripts/test_tab_layout.py > /tmp/vo-evidence/tabs.log 2>&1
          tabs=$?
          python scripts/test_vertical_options_scanner_browser.py > /tmp/vo-evidence/browser.log 2>&1
          browser=$?
          tail -n 150 /tmp/vo-evidence/unit.log
          cat /tmp/vo-evidence/tabs.log
          tail -n 100 /tmp/vo-evidence/browser.log
          printf 'UNIT=%s TABS=%s BROWSER=%s\n' "$unit" "$tabs" "$browser"
          test "$unit" = 0 -a "$tabs" = 0 -a "$browser" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vo-repair-evidence
          path: /tmp/vo-evidence
          retention-days: 3
