name: Temporary Rendered Dropdown Probe

on:
  push:
    branches:
      - fix/dropdown-rendered-consistency-v2

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and browser probe dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Write focused Streamlit probe
        run: |
          cat > /tmp/dropdown_probe.py <<'PY'
          import streamlit as st
          from src.theme import install_typing_caret_theme

          st.set_page_config(layout="wide")
          install_typing_caret_theme()
          st.selectbox(
              "E*TRADE Account",
              ["Raj Singh // 5474", "Individual Brokerage // 7022", "Baljinder // 0057"],
              key="probe_account",
          )
          PY
      - name: Start Streamlit
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" streamlit run /tmp/dropdown_probe.py             --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          echo $! > /tmp/streamlit.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
      - name: Inspect real computed dropdown typography
        run: |
          cat > /tmp/probe.py <<'PY'
          from playwright.sync_api import sync_playwright
          import json

          def style(el):
              return el.evaluate("""el => {
                const s = getComputedStyle(el);
                return {
                  tag: el.tagName,
                  role: el.getAttribute('role'),
                  cls: el.className,
                  fontFamily: s.fontFamily,
                  fontSize: s.fontSize,
                  fontWeight: s.fontWeight,
                  lineHeight: s.lineHeight,
                  color: s.color,
                  html: el.outerHTML.slice(0, 1000)
                };
              }""")

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1280, "height": 900})
              page.goto("http://127.0.0.1:8501", wait_until="networkidle")

              box = page.locator('[data-testid="stSelectbox"]').first
              print("SELECTBOX_HTML", box.evaluate("el => el.outerHTML"))

              selected = page.locator('[data-testid="stSelectbox"] input[role="combobox"]').first
              print("SELECTED_VALUE", selected.input_value())
              print("SELECTED_STYLE", json.dumps(style(selected), indent=2))

              candidates = [
                  '[data-testid="stSelectbox"] button[aria-haspopup="listbox"]',
                  '[data-testid="stSelectbox"] [role="combobox"]',
                  '[data-testid="stSelectbox"] [aria-haspopup="listbox"]',
                  '[data-testid="stSelectbox"] [data-baseweb="select"]',
                  '[data-testid="stSelectbox"] [role="group"]',
              ]
              clicked = False
              for selector in candidates:
                  loc = page.locator(selector).first
                  if loc.count():
                      try:
                          print("TRIGGER", selector, json.dumps(style(loc), indent=2))
                          loc.click()
                          clicked = True
                          break
                      except Exception as exc:
                          print("CLICK_FAIL", selector, str(exc))
              if not clicked:
                  box.click()

              page.wait_for_timeout(300)
              option = page.locator('[role="option"]').filter(has_text="Individual Brokerage // 7022").first
              print("OPTION_STYLE", json.dumps(style(option), indent=2))
              option_inner = option.locator("*").filter(has_text="Individual Brokerage // 7022").first
              if option_inner.count():
                  print("OPTION_INNER_STYLE", json.dumps(style(option_inner), indent=2))

              listboxes = page.locator('[role="listbox"]')
              print("LISTBOX_COUNT", listboxes.count())
              if listboxes.count():
                  print("LISTBOX_HTML", listboxes.first.evaluate("el => el.outerHTML"))

              sw = selected.evaluate("el => getComputedStyle(el).fontWeight")
              ow = option.evaluate("el => getComputedStyle(el).fontWeight")
              sf = selected.evaluate("el => getComputedStyle(el).fontFamily")
              of = option.evaluate("el => getComputedStyle(el).fontFamily")
              ss = selected.evaluate("el => getComputedStyle(el).fontSize")
              os = option.evaluate("el => getComputedStyle(el).fontSize")
              print("SUMMARY", json.dumps({"selectedWeight": sw, "optionWeight": ow, "selectedFamily": sf, "optionFamily": of, "selectedSize": ss, "optionSize": os}))
              browser.close()
          PY
          PYTHONPATH="$GITHUB_WORKSPACE" python /tmp/probe.py
      - name: Syntax check affected production files
        run: python -m py_compile streamlit_app.py src/theme.py
      - name: Dropdown typography regression
        run: python scripts/test_dropdown_typography.py
      - name: Top-level tab smoke test
        run: python scripts/test_tab_layout.py
      - name: Architecture validation
        run: python scripts/validate_architecture.py
