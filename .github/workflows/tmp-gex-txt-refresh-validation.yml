name: Temporary GEX TXT Refresh Validation

on:
  push:
    branches: [main]
    paths:
      - "src/gex_ui_v3.py"
      - "scripts/test_gex_cboe.py"
      - "scripts/test_gex_dte.py"
      - ".github/workflows/tmp-gex-txt-refresh-validation.yml"

permissions:
  contents: read

jobs:
  validate-gex-txt-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production requirements
        run: python -m pip install -r requirements.txt
      - name: Run GEX CBOE/TXT regression
        run: python scripts/test_gex_cboe.py
      - name: Run GEX DTE/TXT regression
        run: python scripts/test_gex_dte.py
      - name: Validate architecture
        run: python scripts/validate_architecture.py
      - name: Render top-level tabs
        run: python scripts/test_tab_layout.py
