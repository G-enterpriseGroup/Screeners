name: Temporary Risk Ticker Validation

on:
  push:
    branches:
      - fix/risk-ticker-edit-20260927

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install production requirements
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: |
          python -m py_compile src/risk_sizing_ui_v2.py
          python -m py_compile scripts/test_risk_intent_override.py
          python -m py_compile scripts/test_risk_production_ui.py
      - name: Risk persistence regression
        run: python scripts/test_risk_intent_override.py
      - name: Production Risk ticker interaction
        run: python scripts/test_risk_production_ui.py
      - name: Architecture guard
        run: python scripts/validate_architecture.py
      - name: Render all top-level tabs
        run: python scripts/test_tab_layout.py
