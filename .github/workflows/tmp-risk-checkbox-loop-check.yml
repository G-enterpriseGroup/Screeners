name: Temporary Risk Checkbox Loop Check

on:
  push:
    branches:
      - fix/risk-long-term-checkbox-loop

permissions:
  contents: read

jobs:
  validate-risk-checkbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Syntax check Risk path
        run: python -m py_compile src/risk_sizing_ui_v2.py src/risk_sizing_ui_v9.py src/risk_sizing_ui_v10.py streamlit_app.py
      - name: Run Risk intent regression
        run: python scripts/test_risk_intent_override.py
      - name: Verify local checkbox contract
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("src/risk_sizing_ui_v2.py").read_text(encoding="utf-8")
          assert "st.data_editor(" not in source
          assert 'st.checkbox(' in source
          assert 'on_change=_set_long_term_override' in source
          assert 'border:1px solid #fb8b1e !important;' in source
          assert 'with st.container(key="risk_book_override_controls")' in source
          assert 'st.dataframe(' in source
          assert "src/theme.py" not in Path("src/TERMINAL_CHANGELOG.md").read_text(encoding="utf-8")[-500:]
          print("local checkbox contract: PASS")
          PY
      - name: Render all production top-level tabs
        run: python scripts/test_tab_layout.py
