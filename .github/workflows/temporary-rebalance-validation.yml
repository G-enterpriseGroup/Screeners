name: Temporary Rebalance Validation

on:
  push:
    branches:
      - feature/rebalance-smart-v1-20260927

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install production requirements
        run: python -m pip install -r requirements.txt
      - name: Syntax check changed production files
        run: |
          python -m py_compile streamlit_app.py
          python -m py_compile src/rebalance_portfolio_ui.py
          python -m py_compile src/production_manifest.py
          python -m py_compile scripts/validate_architecture.py
          python -m py_compile scripts/test_rebalance_portfolio.py
      - name: Focused Rebalance regression
        run: python scripts/test_rebalance_portfolio.py
      - name: Architecture guard
        run: python scripts/validate_architecture.py
      - name: Render all top-level tabs
        run: python scripts/test_tab_layout.py
