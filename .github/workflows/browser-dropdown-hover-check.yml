name: Temporary Browser Dropdown Hover Validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-dropdown-hover-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-dropdown-hover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production and browser dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright==1.55.0
          python -m playwright install chromium

      - name: Create synthetic production-style dropdown app
        run: |
          cat > /tmp/raj_dropdown_hover_app.py <<'PY'
          import streamlit as st
          from src.theme import install_typing_caret_theme
          from src.risk_sizing_ui_v9 import _render_css

          st.set_page_config(layout="wide")
          install_typing_caret_theme()
          _render_css()
          st.selectbox(
              "Risk Book Sort",
              ("DEFAULT", "LONG-TERM", "SLEEVE / %", "SYMBOL", "P&L %", "P&L", "VALUE", "% ACCT"),
              key="risk_book_sort_browser_test",
              format_func=lambda value: f"SORT: {value}",
          )
          PY

      - name: Start Streamlit
        run: |
          python -m streamlit run /tmp/raj_dropdown_hover_app.py --server.headless true --server.port 8501 > /tmp/raj_dropdown.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/raj_dropdown.log
          exit 1

      - name: Verify actual hover computed styles
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto("http://127.0.0.1:8501", wait_until="networkidle")
              select = page.locator('[data-testid="stSelectbox"]').first
              select.click()
              option = page.get_by_role("option", name="SORT: SYMBOL")
              option.wait_for(state="visible")
              option.hover()
              styles = option.evaluate(
                  """el => {
                      const own = getComputedStyle(el);
                      const child = el.querySelector('*');
                      const nested = child ? getComputedStyle(child) : own;
                      return {
                          background: own.backgroundColor,
                          color: own.color,
                          fill: own.webkitTextFillColor,
                          nestedColor: nested.color,
                          nestedFill: nested.webkitTextFillColor,
                      };
                  }"""
              )
              print(styles)
              expected_color = "rgb(255, 173, 82)"
              expected_background = "rgb(23, 16, 7)"
              assert styles["background"] == expected_background, styles
              assert styles["color"] == expected_color, styles
              assert styles["nestedColor"] == expected_color, styles
              browser.close()
          PY
