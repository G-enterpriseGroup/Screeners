name: Vertical Stacked Columns Workbench
on:
  push:
    branches: [fix/vertical-stacked-legs-oi-20261106]
    paths: [.github/workflows/vo-stacked-workbench.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact locally verified changes
        run: |
          python scripts/_vo_stacked_patch.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
            'src/vertical_options_ui.py': 'f7f221195e55c3e533adf33304d8875d279bce85194c082dd7038448d60dc4db',
            'src/components/vo_spread_scroller_v1/index.html': '245c3faad591715b51dc1b4467cf86f07916ccdf7cb3e3b104852f3ba96245bf',
            'tests/test_vertical_options.py': '4def8474abbf9dad208ca7005b61d146be9801e585ececaf2a7f84ccfb117c7f',
            'scripts/test_vertical_options_scanner_browser.py': 'acf4ee5d0896da8edf964999d1a5eb68ab82e27f26d26cb867d474ac3627882c',
          }
          for name, want in expected.items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              print(name, actual)
              assert actual == want, (name, actual, want)
          source = Path('src/components/vo_spread_scroller_v1/index.html').read_text()
          Path('/tmp/vo-stacked.js').write_text(source.split('<script>', 1)[1].split('</script>', 1)[0])
          PY
          node --check /tmp/vo-stacked.js
          python -m py_compile src/vertical_options_ui.py tests/test_vertical_options.py scripts/test_vertical_options_scanner_browser.py
          python scripts/validate_architecture.py
          git diff --check
      - name: Commit isolated production diff and append implementation receipt
        run: |
          git config user.name 'G-enterpriseGroup'
          git config user.email '143067071+G-enterpriseGroup@users.noreply.github.com'
          git rm scripts/_vo_stacked_patch.py .github/workflows/vo-stacked-workbench.yml
          git add src/vertical_options_ui.py src/components/vo_spread_scroller_v1/index.html tests/test_vertical_options.py scripts/test_vertical_options_scanner_browser.py src/TERMINAL_CHANGELOG.md
          git commit -m 'Vertical Options: stacked BUY/SELL strike, last and open-interest columns'
          implementation="$(git rev-parse HEAD)"
          printf '\n- **Implementation receipt:** Commit `%s` contains the isolated source changes; production UI/component and focused tests are byte-identical to the locally tested files. Architecture guard PASS, 144 local focused tests PASS; final PR/production CI and signed-in deployment status remain separately verified. Temporary workbench files were removed before review.\n' "$implementation" >> src/TERMINAL_CHANGELOG.md
          git add src/TERMINAL_CHANGELOG.md
          git commit -m 'Record stacked-column implementation SHA and verification scope'
          git push origin HEAD:fix/vertical-stacked-legs-oi-20261106
          mkdir -p /tmp/vo-stacked
          git rev-parse HEAD > /tmp/vo-stacked/commit.txt
          git diff --stat 232a88eb441416fdc0f6d62c61ab22087c65ff0e > /tmp/vo-stacked/diff-stat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vo-stacked-published
          path: /tmp/vo-stacked
          retention-days: 1
