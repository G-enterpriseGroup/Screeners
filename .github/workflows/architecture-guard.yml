name: Terminal Architecture Guard

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "streamlit_app.py"
      - "src/**"
      - "scripts/validate_architecture.py"
      - ".github/workflows/**"
      - "scripts/validate_workflows.py"

permissions:
  contents: read

jobs:
  validate-boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate production architecture
        run: python scripts/validate_architecture.py

      - name: Install workflow YAML validator dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Validate active workflow YAML
        run: python scripts/validate_workflows.py

      - name: Verify production Streamlit health after push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          url="https://terminal8.streamlit.app/_stcore/health"
          for attempt in $(seq 1 36); do
            status="$(curl -L --connect-timeout 5 --max-time 10 -sS -o /tmp/raj_terminal_health -w "%{http_code}" "$url" 2>/dev/null || true)"
            if [ "$status" = "200" ]; then
              echo "Raj's Terminal health check PASS after commit $GITHUB_SHA"
              cat /tmp/raj_terminal_health || true
              exit 0
            fi
            echo "Waiting for Streamlit reboot/health... HTTP $status // attempt $attempt/36"
            sleep 5
          done
          echo "Raj's Terminal did not return HTTP 200 after the production commit."
          exit 1
