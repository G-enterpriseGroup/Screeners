name: Terminal Architecture Guard

on:
  push:
    branches: [main]
    paths:
      - "streamlit_app.py"
      - "src/**"
      - "scripts/validate_architecture.py"
      - ".github/workflows/architecture-guard.yml"
  pull_request:
    paths:
      - "streamlit_app.py"
      - "src/**"
      - "scripts/validate_architecture.py"
      - ".github/workflows/architecture-guard.yml"

permissions:
  contents: read

jobs:
  validate-boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate production architecture
        run: python scripts/validate_architecture.py
