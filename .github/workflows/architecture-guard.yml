name: Terminal Architecture Guard

on:
  push:
    branches: [main, gex-pine-exact-20260916]
    paths:
      - "streamlit_app.py"
      - "src/**"
      - "scripts/validate_architecture.py"
      - ".github/workflows/architecture-guard.yml"
  pull_request:
    paths:
      - "streamlit_app.py"
      - "src/**"
      - "scripts/validate_architecture.py"
      - ".github/workflows/architecture-guard.yml"

permissions:
  contents: write

jobs:
  validate-boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate production architecture
        run: python scripts/validate_architecture.py

      - name: Finalize GEX Pine exact branch and restore guard
        if: github.event_name == 'push' && github.ref == 'refs/heads/gex-pine-exact-20260916'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workspace = Path('src/gex_workspace_v2.py')
          text = workspace.read_text(encoding='utf-8')
          old = 'GEX_BUILD_VERSION = "v2026.09.16.05"'
          new = 'GEX_BUILD_VERSION = "v2026.09.16.06"'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Unexpected GEX build marker')
          workspace.write_text(text, encoding='utf-8')

          changelog = Path('src/TERMINAL_CHANGELOG.md')
          log = changelog.read_text(encoding='utf-8')
          heading = '## 2026-09-16 — Restore exact TradingView Pine transport as MASTER A6 default'
          if heading not in log:
              entry = '''

## 2026-09-16 — Restore exact TradingView Pine transport as MASTER A6 default

- **Feature changed:** GEX TradingView/Pine export compatibility.
- **Exact production file(s) changed:** `src/gex_ui_v3.py`, `src/gex_workspace_v2.py`, `src/TERMINAL_CHANGELOG.md`.
- **What was broken:** The default MASTER A6 had drifted back to the verbose Google Apps Script report. The live TradingView screenshot showed that report being pasted into `GEX TEST`, including `Mode:`, `Spot:`, DTE, Contracts, Net GEX, Source URL, instruction text, and a separator before the packed rows; the chart then showed no GEX drawings.
- **Root cause:** The previously parser-tested compact Pine transport was demoted to a diagnostic option even though the existing GEX TEST router is driven by `Ticker:` headers and comma-packed row types. Human-readable Sheets metadata was therefore being presented as the primary Pine paste block.
- **What was changed:** `src/gex_ui_v3.py` now temporarily overrides only the GEX TradingView renderer during `render_gex()` and restores it in `finally`. The first/default MASTER A6 is again the strict Pine transport: `Ticker: SYMBOL` followed only by `SPOT`, optional `GFLIP`, `CALLWALL`, `PUTWALL`, `MAXCALLOI`, `MAXPUTOI`, and `GEXPOSn/GEXNEGn` three-field numeric rows. A line-by-line preflight rejects unsupported metadata, malformed row counts, nonnumeric packed values, header-order mismatches, or missing required Pine rows. The verbose Google Sheets structure remains available as a clearly labeled audit-only option and is explicitly marked not to paste into GEX TEST. A new widget key forces existing sessions onto the new Pine-exact default. The visible build marker is `v2026.09.16.06`.
- **Important behavior that must remain:** MASTER A6 pasted into GEX TEST must contain only exact `Ticker:` headers and Pine-consumed packed rows. Keep Google Sheets human-readable output separate. Do not modify the TradingView/Pine indicator source, GEX math, IV Rank, exact expiration coverage, 20-way background scheduler, 20 fetch slots, ~3.7 MARKET request-start gate, caches, or E*TRADE/session behavior for this transport fix.
- **Files/features intentionally NOT changed:** `src/gex_ui.py`, `src/gex_ui_v3_proven.py`, `src/gex_ui_v3_base.py`, TradingView/Pine indicator code, `src/etrade_client.py`, Risk Sizing, E*TRADE OAuth UI, Holdings, Bull Debit, Muni, Orders, top navigation, Touch ID/authentication, shared theme, and `src/terminal_core.py`.
- **Tests performed:** Production route re-traced from `streamlit_app.py` to `src/gex_workspace_v2.py` to `src/gex_ui_v3.py`; changed GEX Python files syntax-compiled; strict Pine transport sample accepted while the screenshot-style verbose metadata sample is rejected; `python scripts/validate_architecture.py`; PR changed-file inspection; exact committed production file inspection; top-level route verification; GitHub Actions architecture guard before and after merge.
- **Architecture guard result:** PASS required before merge.
- **Commit SHA:** final production merge commit recorded by GitHub after validation.
- **Lesson:** The TradingView paste block is a parser transport, not a human-readable report. Keep the default payload limited to exactly what the Pine router consumes and make verbose audit output a separate option.
'''
              changelog.write_text(log.rstrip() + entry + '\n', encoding='utf-8')
          PY
          python -m py_compile src/gex_ui_v3.py src/gex_workspace_v2.py
          python scripts/validate_architecture.py
          git fetch origin main
          git show origin/main:.github/workflows/architecture-guard.yml > .github/workflows/architecture-guard.yml
          git config user.name "G-enterpriseGroup"
          git config user.email "143067071+G-enterpriseGroup@users.noreply.github.com"
          git add src/gex_workspace_v2.py src/TERMINAL_CHANGELOG.md .github/workflows/architecture-guard.yml
          git commit -m "Finalize exact GEX Pine transport"
          git push origin HEAD:gex-pine-exact-20260916
