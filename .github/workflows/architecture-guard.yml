name: Terminal Architecture Guard

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "streamlit_app.py"
      - "src/**"
      - "scripts/validate_architecture.py"
      - ".github/workflows/**"
      - "scripts/validate_workflows.py"

permissions:
  contents: read

jobs:
  validate-boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate production architecture
        run: python scripts/validate_architecture.py

      - name: Test Risk live-order helpers without broker submission
        run: python scripts/test_risk_live_order_helpers.py

      - name: Test Performance analytics and read-only boundary
        run: python scripts/test_performance_ui.py

      - name: Install workflow YAML validator dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Validate active workflow YAML
        run: python scripts/validate_workflows.py

      - name: Verify production Streamlit health after push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          url="https://terminal8.streamlit.app/_stcore/health"
          for attempt in $(seq 1 24); do
            status="$(curl --connect-timeout 5 --max-time 8 -sS -D /tmp/raj_terminal_headers -o /tmp/raj_terminal_health -w "%{http_code}" "$url" 2>/dev/null || true)"
            if [ "$status" = "200" ] || [ "$status" = "303" ]; then
              echo "Raj's Terminal deployment endpoint PASS after commit $GITHUB_SHA // HTTP $status"
              grep -i '^location:' /tmp/raj_terminal_headers || true
              exit 0
            fi
            echo "Waiting for Streamlit reboot/health... HTTP $status // attempt $attempt/24"
            sleep 5
          done
          echo "Raj's Terminal deployment endpoint did not return HTTP 200/303 after the production commit."
          exit 1

      - name: Verify deployed frontend is not on Oh no page
        if: github.event_name == 'push'
        run: |
          python -m pip install selenium==4.36.0
          python - <<'PY'
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--window-size=1440,1000")

          driver = webdriver.Chrome(options=options)
          try:
              deadline = time.time() + 90
              last_text = ""
              while time.time() < deadline:
                  driver.get("https://terminal8.streamlit.app/")
                  time.sleep(4)
                  last_text = driver.find_element(By.TAG_NAME, "body").text
                  if "Oh no." in last_text and "Error running app" in last_text:
                      raise AssertionError("Deployed frontend rendered Streamlit's Oh no error page.")
                  if last_text.strip():
                      print("Raj's Terminal browser render PASS")
                      break
                  time.sleep(3)
              else:
                  raise AssertionError("Deployed frontend never produced visible page content.")
          finally:
              driver.quit()
          PY
