name: Vertical Toolbar Alignment Workbench
on:
  push:
    branches: [fix/vertical-toolbar-align-20261106]
    paths: [.github/workflows/vo-align-workbench.yml, scripts/_vo_align_patch.py]
permissions:
  contents: write
concurrency:
  group: vo-toolbar-alignment-workbench
  cancel-in-progress: true
jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the exact scoped toolbar patch
        run: |
          mkdir -p /tmp/vo-align-evidence
          python scripts/_vo_align_patch.py
          python -m py_compile src/vertical_options_ui.py tests/test_vertical_options.py scripts/test_vertical_options_scanner_browser.py
          python scripts/validate_architecture.py | tee /tmp/vo-align-evidence/architecture.log
          git diff --check
          git diff > /tmp/vo-align-evidence/review.diff
      - name: Install production test requirements
        run: python -m pip install -r requirements.txt selenium==4.36.0
      - name: Desktop and phone regressions
        run: |
          python -m unittest tests.test_vertical_options tests.test_verti_phone > /tmp/vo-align-evidence/unit.log 2>&1 || { tail -100 /tmp/vo-align-evidence/unit.log; exit 1; }
          tail -5 /tmp/vo-align-evidence/unit.log
      - name: Unrelated top-level tab smoke
        run: |
          python scripts/test_tab_layout.py > /tmp/vo-align-evidence/tabs.log 2>&1 || { tail -100 /tmp/vo-align-evidence/tabs.log; exit 1; }
          tail -25 /tmp/vo-align-evidence/tabs.log
      - name: Full browser regression and pixel alignment
        env:
          VO_TOOLBAR_EVIDENCE_DIR: /tmp/vo-align-evidence
        run: |
          python scripts/test_vertical_options_scanner_browser.py > /tmp/vo-align-evidence/browser.log 2>&1 || { tail -100 /tmp/vo-align-evidence/browser.log; exit 1; }
          grep -E 'PASS|Toolbar edge' /tmp/vo-align-evidence/browser.log | tail -25
      - name: Commit tested feature patch and remove temporary workbench
        run: |
          git config user.name 'G-enterpriseGroup'
          git config user.email '143067071+G-enterpriseGroup@users.noreply.github.com'
          git rm scripts/_vo_align_patch.py .github/workflows/vo-align-workbench.yml
          git add src/vertical_options_ui.py tests/test_vertical_options.py scripts/test_vertical_options_scanner_browser.py src/TERMINAL_CHANGELOG.md
          git commit -m 'Vertical Options: align cash and portfolio toolbar and close mode-switch gap'
          implementation="$(git rev-parse HEAD)"
          printf '\n- **Implementation receipt:** `%s` passed 144 focused tests, architecture/syntax checks, neighboring-tab smoke and the full renderer browser suite including 1529/1440/1100/1040px toolbar measurements. Only the Vertical Options UI owner, focused tests and this history remain changed; temporary workbench files were removed. No live broker orders or authenticated-user-session test is claimed.\n' "$implementation" >> src/TERMINAL_CHANGELOG.md
          git add src/TERMINAL_CHANGELOG.md
          git commit -m 'Record verified toolbar implementation and scope'
          git push origin HEAD:fix/vertical-toolbar-align-20261106
          git rev-parse HEAD > /tmp/vo-align-evidence/commit.txt
          git archive --format=zip HEAD -o /tmp/vo-align-evidence/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vo-align-verified
          path: /tmp/vo-align-evidence
          retention-days: 2
