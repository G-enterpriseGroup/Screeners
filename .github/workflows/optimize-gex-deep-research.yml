          replacement = '''def _representative_iv(contracts: list[dict[str, Any]], spot: float) -> float | None:
    """Consistent E*TRADE-only ATM IV observation used for trailing IV Rank."""
    observed = [
        c for c in contracts
        if c.get("iv_from_feed") and int(c.get("dte", 0) or 0) > 0
        and float(c.get("iv", 0.0) or 0.0) > 0
    ]
    if not observed or spot <= 0:
        return None
    dtes = sorted({int(c["dte"]) for c in observed})
    eligible = [d for d in dtes if d >= 30]
    target_dte = min(eligible) if eligible else max(dtes)
    target = [c for c in observed if int(c["dte"]) == target_dte]
    nearest = min(abs(float(c["strike"]) - spot) for c in target)
    atm = [float(c["iv"]) for c in target if abs(abs(float(c["strike"]) - spot) - nearest) < 1e-9]
    return float(sum(atm) / len(atm)) if atm else None


def _estimate_gamma_flip(contracts: list[dict[str, Any]], spot: float, strikes: list[float]) -> float | None:
    """Match supplied Apps Script: 160 samples over spot +/-20%, first crossing."""
    del strikes
    valid = [c for c in contracts if int(c.get("dte", 0) or 0) > 0]
    if not valid or spot <= 0:
        return None
    ks = np.asarray([c["strike"] for c in valid], dtype=float)
    iv = np.maximum(np.asarray([c["iv"] for c in valid], dtype=float), 0.05)
    t = np.maximum(np.asarray([c["dte"] for c in valid], dtype=float) / 365.0, 1.0 / 365.0)
    root_t = np.sqrt(t)
    oi = np.asarray([c["oi"] for c in valid], dtype=float)
    sign = np.asarray([1.0 if c["cp"] == "C" else -1.0 for c in valid], dtype=float)

    def total(px: float) -> float:
        d1 = (np.log(px / ks) + (0.5 * iv * iv) * t) / (iv * root_t)
        gamma = np.exp(-0.5 * d1 * d1) / math.sqrt(2.0 * math.pi) / (px * iv * root_t)
        return float(np.sum(sign * gamma * oi * CONTRACT_SIZE * px * px * 0.01))

    low = max(0.01, spot * (1.0 - GAMMA_FLIP_RANGE_PCT))
    high = spot * (1.0 + GAMMA_FLIP_RANGE_PCT)
    prev_px = low
    prev = total(prev_px)
    best_px, best_abs = low, abs(prev)
    for i in range(1, GAMMA_FLIP_STEPS + 1):
        px = low + (high - low) * i / GAMMA_FLIP_STEPS
        now = total(px)
        if abs(now) < best_abs:
            best_px, best_abs = px, abs(now)
        if (prev <= 0 <= now) or (prev >= 0 >= now):
            denom = abs(prev) + abs(now)
            return prev_px + (px - prev_px) * (abs(prev) / denom) if denom else px
        prev_px, prev = px, now
    return best_px
'''
