          iv_helpers = '''def _apply_iv_rank_history(
    state: dict[str, Any],
    result_map: dict[str, Any],
) -> bool:
    """Attach IV Rank fields and persist one E*TRADE IV point per day.

    Cheap/Neutral/Expensive thresholds are 30/70. Before ten distinct daily
    observations, the table explicitly says BUILDING. Until stored history
    spans roughly a full year, the numerical rank is marked P (provisional).
    """
    history_map = state.setdefault("iv_history", {})
    changed = False

    for raw_ticker, result in result_map.items():
        ticker = _base.core._normalize_ticker(raw_ticker)
        if not ticker or not isinstance(result, dict):
            continue

        try:
            current_iv = float(result.get("representativeIv"))
        except (TypeError, ValueError):
            current_iv = 0.0
        if not (0 < current_iv < 5):
            result["ivRank"] = None
            result["ivRankDisplay"] = "N/A | NO IV"
            result["ivRankTone"] = "orange"
            continue

        result_day = str(result.get("updated") or "")[:10]
        try:
            today = date.fromisoformat(result_day)
        except ValueError:
            today = date.today()
            result_day = today.isoformat()
        cutoff_ordinal = today.toordinal() - _IV_RANK_LOOKBACK_DAYS

        by_day: dict[str, float] = {}
        for row in history_map.get(ticker, []) or []:
            if not isinstance(row, dict):
                continue
            day = str(row.get("date") or "")[:10]
            try:
                day_value = date.fromisoformat(day)
                iv = float(row.get("iv"))
            except (TypeError, ValueError):
                continue
            if day_value.toordinal() >= cutoff_ordinal and 0 < iv < 5:
                by_day[day] = iv

        by_day[result_day] = current_iv
        compact = [
            {"date": day, "iv": by_day[day]}
            for day in sorted(by_day)
        ]
        old_compact = history_map.get(ticker, []) or []
        if compact != old_compact:
            history_map[ticker] = compact
            changed = True

        values = [float(row["iv"]) for row in compact]
        count = len(values)
        result["ivRankHistoryCount"] = count
        if count < _IV_RANK_MIN_OBSERVATIONS:
            result["ivRank"] = None
            result["ivRankDisplay"] = "N/A | BUILDING"
            result["ivRankTone"] = "orange"
            continue

        low_iv = min(values)
        high_iv = max(values)
        if high_iv <= low_iv:
            rank = 50.0
        else:
            rank = 100.0 * (current_iv - low_iv) / (high_iv - low_iv)
            rank = max(0.0, min(100.0, rank))

        if rank < 30.0:
            reference = "Cheap"
            tone = "green"
        elif rank > 70.0:
            reference = "Expensive"
            tone = "red"
        else:
            reference = "Neutral"
            tone = "orange"

        try:
            first_day = date.fromisoformat(compact[0]["date"])
            span_days = max(0, (today - first_day).days)
        except (TypeError, ValueError):
            span_days = 0
        provisional = span_days < _IV_RANK_FULL_SPAN_DAYS
        prefix = "P " if provisional else ""
        result["ivRank"] = rank
        result["ivRankReference"] = reference
        result["ivRankProvisional"] = provisional
        result["ivRankDisplay"] = f"{prefix}{rank:.1f} | {reference}"
        result["ivRankTone"] = tone

    return changed


'''
