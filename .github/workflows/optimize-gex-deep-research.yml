    contracts: list[dict[str, Any]],
    spot: float,
) -> float | None:
    """Return a consistent current ATM IV observation for IV Rank history.

    Use E*TRADE-supplied IV only (never the fallback IV). Prefer the first
    positive expiration at or beyond 30 DTE, otherwise the furthest available
    positive DTE, then average call/put IV at the strike nearest spot.
    """
    observed = [
        contract
        for contract in contracts
        if contract.get("iv_from_feed")
        and int(contract.get("dte", 0) or 0) > 0
        and float(contract.get("iv", 0.0) or 0.0) > 0
    ]
    if not observed or spot <= 0:
        return None

    dtes = sorted({int(contract["dte"]) for contract in observed})
    at_or_above_30 = [dte for dte in dtes if dte >= 30]
    target_dte = min(at_or_above_30) if at_or_above_30 else max(dtes)
    target = [contract for contract in observed if int(contract["dte"]) == target_dte]
    if not target:
        return None

    nearest_distance = min(abs(float(contract["strike"]) - spot) for contract in target)
    atm = [
        float(contract["iv"])
        for contract in target
        if abs(abs(float(contract["strike"]) - spot) - nearest_distance) < 1e-9
    ]
    if not atm:
        return None
    return float(sum(atm) / len(atm))


def _estimate_gamma_flip(
    contracts: list[dict[str, Any]],
    spot: float,
    strikes: list[float],
) -> float | None:
    """Match the supplied Apps Script: 160 steps across spot +/-20%.

    The Apps Script recalculates Black-Scholes gamma with no risk-free-rate
    term, returns the first sign crossing with linear interpolation, and falls
    back to the sampled spot where absolute net gamma is smallest.
    """
    del strikes  # retained in the signature for compatibility with callers
    if not contracts or spot <= 0:
        return None

    valid = [contract for contract in contracts if int(contract.get("dte", 0) or 0) > 0]
    if not valid:
        return None

    c_strikes = np.asarray([contract["strike"] for contract in valid], dtype=float)
    c_iv = np.maximum(np.asarray([contract["iv"] for contract in valid], dtype=float), 0.05)
    c_t = np.maximum(
        np.asarray([contract["dte"] for contract in valid], dtype=float) / 365.0,
        1.0 / 365.0,
    )
    c_sqrt_t = np.sqrt(c_t)
    c_oi = np.asarray([contract["oi"] for contract in valid], dtype=float)
    c_sign = np.asarray(
        [1.0 if contract["cp"] == "C" else -1.0 for contract in valid],
        dtype=float,
    )

    def total_at(test_spot: float) -> float:
        d1 = (
            np.log(test_spot / c_strikes)
            + (0.5 * c_iv * c_iv) * c_t
        ) / (c_iv * c_sqrt_t)
        gamma = (
            np.exp(-0.5 * d1 * d1)
            / math.sqrt(2.0 * math.pi)
            / (test_spot * c_iv * c_sqrt_t)
        )
        exposure = gamma * c_oi * CONTRACT_SIZE * test_spot * test_spot * 0.01
        return float(np.sum(c_sign * exposure))

    scan_low = max(0.01, spot * (1.0 - GAMMA_FLIP_RANGE_PCT))
    scan_high = spot * (1.0 + GAMMA_FLIP_RANGE_PCT)
    steps = GAMMA_FLIP_STEPS
    prev_spot = scan_low
    prev_gex = total_at(prev_spot)
    best_spot = scan_low
    best_abs = abs(prev_gex)

    for index in range(1, steps + 1):
        test_spot = scan_low + (scan_high - scan_low) * index / steps
        net_gex = total_at(test_spot)
        absolute = abs(net_gex)
        if absolute < best_abs:
            best_abs = absolute
            best_spot = test_spot

        crossed = (
            (prev_gex <= 0 <= net_gex)
            or (prev_gex >= 0 >= net_gex)
        )
        if crossed:
            denominator = abs(prev_gex) + abs(net_gex)
            if denominator:
                return prev_spot + (test_spot - prev_spot) * (
                    abs(prev_gex) / denominator
                )
            return test_spot
        prev_spot = test_spot
        prev_gex = net_gex

    return best_spot
'''
