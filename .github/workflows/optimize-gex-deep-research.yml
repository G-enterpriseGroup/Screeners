- **Exact production file(s) changed:** `src/gex_ui.py`, `src/gex_ui_v3.py`, `src/gex_workspace_v2.py`, `src/TERMINAL_CHANGELOG.md`.
- **What was broken:** Cold multi-ticker GEX remained slow; gamma flip did 1,000 full-contract spot samples per ticker; Call Wall/Put Wall did not match the supplied Apps Script; Overview lacked IV Rank/reference.
- **Root cause:** E*TRADE requires expiration discovery plus exact option-chain retrieval, so cold runs remain market-data-request bound even with the existing 4-calc/20-fetch pipeline. Avoidable CPU work came from the 1,000-step flip rescan. The old terminal used max call OI/min net GEX for walls instead of positive call-GEX/negative put-GEX walls. E*TRADE exposes current option IV but no ready 52-week IV Rank series.
- **What changed:** Kept full exact-expiration coverage, caches, 4 calculation workers, 20 fetch slots, 3.7 request-starts/sec gate, and 50-symbol quote batch. Gamma flip now matches the supplied 160-step +/-20% first-crossing/min-|GEX| fallback model (84% fewer sampled spots), wall definitions match the supplied script, missing-IV fallback is 35%, and current ATM IV is derived from already-loaded E*TRADE Greeks. Added `IV RANK / REF` using a trailing 365-day E*TRADE IV history with `<30 Cheap`, `30-70 Neutral`, `>70 Expensive`; it shows `N/A | BUILDING` before 10 observations and `P` while history is not yet roughly one year, rather than fabricating a 52-week rank.
- **Important behavior that must remain:** MASTER A6/Pine field names, order, delimiters, failure blocks, and the existing Pine script stay unchanged. IV Rank is terminal-only. Preserve multi-ticker support, GEX subtabs, live E*TRADE context, exact expiration coverage, request throttling, caching, and the existing parallel fetch pipeline.
- **Files/features intentionally NOT changed:** `streamlit_app.py`, `src/gex_ui_v3_base.py`, Risk Sizing, OAuth UI, Holdings, Bull Debit, Muni, Orders, navigation, shared theme, authentication, and `src/terminal_core.py`.
