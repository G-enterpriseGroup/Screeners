          faster_flip = '''def _representative_iv(contracts: list[dict[str, Any]], spot: float) -> float | None:
    """Return a consistent current ATM IV observation from E*TRADE feed IV only."""
    observed = [
        c for c in contracts
        if c.get("iv_from_feed") and int(c.get("dte", 0) or 0) > 0
        and float(c.get("iv", 0.0) or 0.0) > 0
    ]
    if not observed or spot <= 0:
        return None
    dtes = sorted({int(c["dte"]) for c in observed})
    target_candidates = [dte for dte in dtes if dte >= 30]
    target_dte = min(target_candidates) if target_candidates else max(dtes)
    target = [c for c in observed if int(c["dte"]) == target_dte]
    nearest = min(abs(float(c["strike"]) - spot) for c in target)
    atm = [
        float(c["iv"])
        for c in target
        if abs(abs(float(c["strike"]) - spot) - nearest) < 1e-9
    ]
    return float(sum(atm) / len(atm)) if atm else None


def _estimate_gamma_flip(
    contracts: list[dict[str, Any]],
    spot: float,
    strikes: list[float],
) -> float | None:
    """Match supplied Apps Script: 160 steps across spot +/-20%."""
    del strikes
    valid = [c for c in contracts if int(c.get("dte", 0) or 0) > 0]
    if not valid or spot <= 0:
        return None

    c_strikes = np.asarray([c["strike"] for c in valid], dtype=float)
    c_iv = np.maximum(np.asarray([c["iv"] for c in valid], dtype=float), 0.05)
    c_t = np.maximum(
        np.asarray([c["dte"] for c in valid], dtype=float) / 365.0,
        1.0 / 365.0,
    )
    c_sqrt_t = np.sqrt(c_t)
    c_oi = np.asarray([c["oi"] for c in valid], dtype=float)
    c_sign = np.asarray([1.0 if c["cp"] == "C" else -1.0 for c in valid], dtype=float)

    def total_at(test_spot: float) -> float:
        d1 = (
            np.log(test_spot / c_strikes)
            + (0.5 * c_iv * c_iv) * c_t
        ) / (c_iv * c_sqrt_t)
        gamma = (
            np.exp(-0.5 * d1 * d1)
            / math.sqrt(2.0 * math.pi)
            / (test_spot * c_iv * c_sqrt_t)
        )
        exposure = gamma * c_oi * CONTRACT_SIZE * test_spot * test_spot * 0.01
        return float(np.sum(c_sign * exposure))

    scan_low = max(0.01, spot * (1.0 - GAMMA_FLIP_RANGE_PCT))
    scan_high = spot * (1.0 + GAMMA_FLIP_RANGE_PCT)
    prev_spot = scan_low
    prev_gex = total_at(prev_spot)
    best_spot = scan_low
    best_abs = abs(prev_gex)

    for index in range(1, GAMMA_FLIP_STEPS + 1):
        test_spot = scan_low + (scan_high - scan_low) * index / GAMMA_FLIP_STEPS
        net_gex = total_at(test_spot)
        absolute = abs(net_gex)
        if absolute < best_abs:
            best_abs = absolute
            best_spot = test_spot
        if (prev_gex <= 0 <= net_gex) or (prev_gex >= 0 >= net_gex):
            denominator = abs(prev_gex) + abs(net_gex)
            if denominator:
                return prev_spot + (test_spot - prev_spot) * (abs(prev_gex) / denominator)
            return test_spot
        prev_spot = test_spot
        prev_gex = net_gex
    return best_spot
'''
