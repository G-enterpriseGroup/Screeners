- **Architecture guard result:** PASS before commit.
- **Commit SHA:** `{sha}`.
- **Lesson:** The remaining cold-run floor is primarily E*TRADE per-expiration market-data traffic, not missing thread count. Optimize calculation work without dropping weekly/daily expirations or changing the Pine contract; never fake IV Rank from one current chain.
'''
