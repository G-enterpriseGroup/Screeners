- **Feature changed:** GEX calculation parity/performance and Overview IV Rank reference.
- **Exact production file(s) changed:** `src/gex_ui.py`, `src/gex_ui_v3.py`, `src/gex_workspace_v2.py`, `src/TERMINAL_CHANGELOG.md`.
- **What was broken:** Fresh multi-ticker GEX still felt slow, the terminal gamma-flip scan performed 1,000 full-contract evaluations per ticker, Call Wall/Put Wall did not match Raj's supplied Apps Script definitions, and the Overview had no IV Rank/reference column.
- **Root cause:** E*TRADE requires separate expiration-list and per-expiration option-chain requests, creating a hard network-request floor even after the existing 4-ticker/20-fetch pipeline. On top of that network cost, the calculation engine used a wider 1,000-step gamma-flip rescan instead of the supplied script's 160-step +/-20% scan. The terminal also selected Call Wall from max call OI and Put Wall from min net GEX instead of strongest positive call GEX / strongest negative put GEX. E*TRADE supplies current option IV but no historical IV-Rank series.
