name: Optimize GEX deep research

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-gex-deep-research.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch only production GEX-owned code
        shell: bash
        run: |
          python - <<'PY'
