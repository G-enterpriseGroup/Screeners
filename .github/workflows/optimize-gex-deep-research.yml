          iv_helper = '''def _apply_iv_rank_history(
    state: dict[str, Any],
    result_map: dict[str, Any],
) -> bool:
    """Attach IV Rank/reference using trailing E*TRADE IV observations."""
    history = state.setdefault("iv_history", {})
    changed = False
    for raw_ticker, result in result_map.items():
        ticker = _base.core._normalize_ticker(raw_ticker)
        if not ticker or not isinstance(result, dict):
            continue
        try:
            current_iv = float(result.get("representativeIv"))
        except (TypeError, ValueError):
            current_iv = 0.0
        if not 0 < current_iv < 5:
            result.update(ivRank=None, ivRankDisplay="N/A | NO IV", ivRankTone="orange")
            continue

        raw_day = str(result.get("updated") or "")[:10]
        try:
            today = date.fromisoformat(raw_day)
            day = raw_day
        except ValueError:
            today = date.today()
            day = today.isoformat()
        cutoff = today.toordinal() - _IV_RANK_LOOKBACK_DAYS

        by_day: dict[str, float] = {}
        for row in history.get(ticker, []) or []:
            if not isinstance(row, dict):
                continue
            old_day = str(row.get("date") or "")[:10]
            try:
                parsed_day = date.fromisoformat(old_day)
                old_iv = float(row.get("iv"))
            except (TypeError, ValueError):
                continue
            if parsed_day.toordinal() >= cutoff and 0 < old_iv < 5:
                by_day[old_day] = old_iv
        by_day[day] = current_iv
        compact = [{"date": d, "iv": by_day[d]} for d in sorted(by_day)]
        if compact != (history.get(ticker, []) or []):
            history[ticker] = compact
            changed = True

        values = [float(row["iv"]) for row in compact]
        result["ivRankHistoryCount"] = len(values)
        if len(values) < _IV_RANK_MIN_OBSERVATIONS:
            result.update(ivRank=None, ivRankDisplay="N/A | BUILDING", ivRankTone="orange")
            continue

        low_iv, high_iv = min(values), max(values)
        rank = 50.0 if high_iv <= low_iv else max(
            0.0,
            min(100.0, 100.0 * (current_iv - low_iv) / (high_iv - low_iv)),
        )
        if rank < 30.0:
            reference, tone = "Cheap", "green"
        elif rank > 70.0:
            reference, tone = "Expensive", "red"
        else:
            reference, tone = "Neutral", "orange"

        try:
            span_days = max(0, (today - date.fromisoformat(compact[0]["date"])).days)
        except (TypeError, ValueError):
            span_days = 0
        provisional = span_days < _IV_RANK_FULL_SPAN_DAYS
        prefix = "P " if provisional else ""
        result.update(
            ivRank=rank,
            ivRankReference=reference,
            ivRankProvisional=provisional,
            ivRankDisplay=f"{prefix}{rank:.1f} | {reference}",
            ivRankTone=tone,
        )
    return changed


