    """Attach IV Rank + reference without pretending a single chain is 52-week history."""
    history = state.setdefault("iv_history", {})
    changed = False
    for raw_ticker, result in result_map.items():
        ticker = _base.core._normalize_ticker(raw_ticker)
        if not ticker or not isinstance(result, dict):
            continue
        try:
