name: Optimize GEX deep research

on:
  push:
    branches: [main]
    paths:
      - ".github/gex-deep-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
