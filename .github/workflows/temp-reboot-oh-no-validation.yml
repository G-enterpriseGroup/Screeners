name: Temporary Reboot Oh No Validation

on:
  push:
    branches:
      - temp-reboot-oh-no-validation

permissions:
  contents: read

jobs:
  validate-reboot-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production requirements
        run: python -m pip install -r requirements.txt

      - name: Syntax-check reboot production path
        run: |
          python -m py_compile streamlit_app.py src/reboot_guard.py scripts/test_reboot_guard.py

      - name: Run reboot guard regression
        run: python scripts/test_reboot_guard.py

      - name: Verify top-level tab rendering
        run: python scripts/test_tab_layout.py

      - name: Validate architecture
        run: python scripts/validate_architecture.py

      - name: Validate workflow YAML
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/validate_workflows.py
