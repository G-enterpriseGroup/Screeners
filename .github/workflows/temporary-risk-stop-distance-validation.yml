name: Temporary Risk Stop Distance Validation

on:
  push:
    branches:
      - fix/risk-editable-stop-distance-20260926

jobs:
  validate-risk-stop-distance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install production requirements
        run: python -m pip install -r requirements.txt
      - name: Syntax check Risk production path
        run: python -m py_compile streamlit_app.py src/risk_sizing_ui_v7.py src/risk_sizing_ui_v10.py src/risk_sizing_ui_v9.py src/risk_sizing_ui_v2.py
      - name: Focused Risk production regression
        run: python scripts/test_risk_production_ui.py
      - name: Top-level tab render regression
        run: python scripts/test_tab_layout.py
      - name: Architecture guard
        run: python scripts/validate_architecture.py
