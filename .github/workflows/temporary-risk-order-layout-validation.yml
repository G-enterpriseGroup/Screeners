name: Temporary Risk Order Layout Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-risk-order-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production requirements
        run: python -m pip install -r requirements.txt
      - name: Install browser test dependency
        run: python -m pip install selenium==4.36.0
      - name: Syntax-check Risk production path
        run: |
          python -m py_compile streamlit_app.py src/risk_sizing_ui_v7.py src/risk_sizing_ui_v10.py src/risk_sizing_ui_v9.py src/risk_sizing_ui_v2.py src/etrade_client.py
      - name: Run Risk production interaction regression
        run: python scripts/test_risk_production_ui.py
      - name: Run live-order payload simulation
        run: python scripts/test_risk_live_order_helpers.py
      - name: Run Risk order browser overlap regression
        run: python scripts/test_risk_order_layout_browser.py
      - name: Render all top-level tabs
        run: python scripts/test_tab_layout.py
      - name: Architecture guard
        run: python scripts/validate_architecture.py
