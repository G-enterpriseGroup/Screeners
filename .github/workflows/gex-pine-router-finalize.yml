name: Finalize GEX Pine Router Restore

on:
  push:
    branches:
      - gex-pine-quoted-master-20260916

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: gex-pine-quoted-master-20260916
          fetch-depth: 0

      - name: Apply exact outer-quote fix
        run: |
          python - <<'PY'
          from pathlib import Path
          ui = Path('src/gex_ui_v3.py')
          text = ui.read_text()

          old = '''    byte_count = len(text.encode("utf-8"))
    headers = _proven._pine_router_headers(text)
    missing_headers = [ticker for ticker in expected if ticker not in headers]
    pine_issues, parsed_counts = _proven._pine_master_issues(text, expected)
    too_large = byte_count > _proven._PINE_TEXT_LIMIT
    transport_ok = not missing_headers and not pine_issues and not too_large
'''
          new = '''    # TradingView/Pine treats the complete pasted multiline transport as one
    # string value only when it has one opening and one closing double quote.
    # Keep parser checks on the unquoted payload so the internal router grammar
    # remains exact: Ticker: headers plus packed rows only.
    parser_text = text
    if not is_full:
        text = f'"{parser_text.strip()}"'

    byte_count = len(text.encode("utf-8"))
    headers = _proven._pine_router_headers(parser_text)
    missing_headers = [ticker for ticker in expected if ticker not in headers]
    pine_issues, parsed_counts = _proven._pine_master_issues(parser_text, expected)
    too_large = byte_count > _proven._PINE_TEXT_LIMIT
    quoted_transport_ok = is_full or (text.startswith('"') and text.endswith('"'))
    transport_ok = not missing_headers and not pine_issues and not too_large and quoted_transport_ok
'''
          if old not in text:
              raise SystemExit('Expected Pine validation block not found')
          text = text.replace(old, new, 1)

          old = '''        if too_large:
            details.append("TEXT_LIMIT")
        st.error("PINE ROUTER CHECK FAILED // " + ", ".join(details[:16]))
'''
          new = '''        if too_large:
            details.append("TEXT_LIMIT")
        if not quoted_transport_ok:
            details.append("MISSING_OUTER_DOUBLE_QUOTES")
        st.error("PINE ROUTER CHECK FAILED // " + ", ".join(details[:16]))
'''
          if old not in text:
              raise SystemExit('Expected failure block not found')
          text = text.replace(old, new, 1)

          old = '''            "**COPY THIS BLOCK INTO GEX TEST → Packed Gamma Levels. It intentionally contains only `Ticker:` headers and packed rows.**"
'''
          new = '''            "**COPY THIS ENTIRE BLOCK INTO GEX TEST → Packed Gamma Levels. The opening and closing double quotes are required and are already included.**"
'''
          if old not in text:
              raise SystemExit('Expected master instruction not found')
          text = text.replace(old, new, 1)

          old = '''        st.markdown("**COPY THIS SINGLE-TICKER BLOCK INTO GEX TEST → Packed Gamma Levels.**")
'''
          new = '''        st.markdown("**COPY THIS ENTIRE SINGLE-TICKER BLOCK INTO GEX TEST → Packed Gamma Levels. Keep the opening and closing double quotes.**")
'''
          if old not in text:
              raise SystemExit('Expected single ticker instruction not found')
          text = text.replace(old, new, 1)
          ui.write_text(text)

          workspace = Path('src/gex_workspace_v2.py')
          ws = workspace.read_text()
          old_version = 'GEX_BUILD_VERSION = "v2026.09.17.06"'
          new_version = 'GEX_BUILD_VERSION = "v2026.09.17.07"'
          if old_version not in ws:
              raise SystemExit('Expected build version not found')
          workspace.write_text(ws.replace(old_version, new_version, 1))
          PY

      - name: Quote contract assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/gex_ui_v3.py').read_text()
          assert "parser_text = text" in text
          assert "text = f'\"{parser_text.strip()}\"'" in text
          assert "_pine_router_headers(parser_text)" in text
          assert "_pine_master_issues(parser_text, expected)" in text
          assert "text.startswith('\"') and text.endswith('\"')" in text
          assert "MISSING_OUTER_DOUBLE_QUOTES" in text
          assert "opening and closing double quotes are required" in text
          assert 'v2026.09.17.07' in Path('src/gex_workspace_v2.py').read_text()
          PY

      - name: Syntax check
        run: python -m py_compile src/gex_ui_v3.py src/gex_workspace_v2.py

      - name: Validate production architecture
        run: python scripts/validate_architecture.py

      - name: Commit production code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gex_ui_v3.py src/gex_workspace_v2.py
          git commit -m "Wrap GEX Pine transport in double quotes"
          echo "CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Append permanent changelog
        run: |
          cat >> src/TERMINAL_CHANGELOG.md <<EOF

          ## 2026-09-16 — Quote-wrap TradingView GEX transport

          - **Feature changed:** GEX TradingView / Pine `Packed Gamma Levels` copy transport.
          - **Exact production file(s) changed:** `src/gex_ui_v3.py`, `src/gex_workspace_v2.py`, `src/TERMINAL_CHANGELOG.md`.
          - **What was broken:** The compact Pine-router payload had the correct internal ticker headers and packed rows but was copied as bare multiline text. The working TradingView input requires the whole paste to be one quoted string value, with an opening double quote before the first `Ticker:` and a closing double quote immediately after the final packed row.
          - **Root cause:** The prior router fix corrected the internal row grammar but omitted the outer Pine string delimiters shown by the working paste.
          - **What was changed:** Pine-safe MASTER and single-ticker copy payloads are now wrapped exactly once with one leading and one trailing double quote. Parser validation still runs on the unquoted internal payload, and a separate check rejects a Pine-safe copy payload missing either outer quote. The Google Sheets full/reference block remains unchanged. Visible build bumped to `v2026.09.17.07`.
          - **Important behavior that must remain:** Pine-safe output begins with `"Ticker: SYMBOL` and ends with the final packed-row value followed immediately by `"`. Do not quote each line. Preserve the internal `Ticker:` plus `SPOT/GFLIP/CALLWALL/PUTWALL/MAXCALLOI/MAXPUTOI/GEXPOS*/GEXNEG*` contract exactly.
          - **Files/features intentionally NOT changed:** GEX calculations, E*TRADE request/session plumbing, Refresh All concurrency/rate limits, IV Rank, Google Sheets full/reference serialization, the TradingView Pine script, Risk Sizing, OAuth, Holdings, navigation, Bull Debit, Muni, Orders, shared theme, authentication, and `src/terminal_core.py`.
          - **Tests performed:** Quote-contract static assertions; Python syntax compilation for changed GEX production files; `python scripts/validate_architecture.py`; PR changed-file inspection; post-merge architecture guard required.
          - **Architecture guard result:** PASS on staging before code commit.
          - **Commit SHA:** `${CODE_SHA}` (production code stage); final merge SHA recorded by GitHub after merge.
          - **Lesson:** The TradingView contract has two layers: parser-native packed rows internally and one pair of outer double quotes around the complete multiline paste externally.
          EOF
          git add src/TERMINAL_CHANGELOG.md
          git commit -m "Record quoted GEX Pine transport fix"

      - name: Final validation
        run: |
          python -m py_compile src/gex_ui_v3.py src/gex_workspace_v2.py
          python scripts/validate_architecture.py

      - name: Push
        run: git push origin HEAD:gex-pine-quoted-master-20260916
