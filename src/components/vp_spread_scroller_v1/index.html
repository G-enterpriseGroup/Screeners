<html lang="en">
<head>
<meta charset="utf-8">

<style>
:root{--vp-row-height:43px}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;color:#f6b56a;overflow:hidden;font-family:"Courier New",monospace}

#head{height:43px;background:#fb8b1e;color:#000;font-size:.68rem;font-weight:900}
#head>span,.row>.cell{display:flex;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px;border-right:1px solid #a65c16;border-bottom:1px solid #a65c16}
#head>span{border-top:1px solid #fb8b1e;white-space:normal;line-height:1.2}
#head>span:has(.filter-button){padding:0}
.filter-button{display:flex;align-items:center;justify-content:space-between;gap:2px;width:100%;height:100%;min-width:0;padding:0 3px;border:0;border-radius:0;background:transparent;color:#000;font:900 .64rem/1.1 "Courier New",monospace;cursor:pointer;text-align:left}
.filter-button:hover,.filter-button:focus-visible,.filter-button.active{background:#c96c0c;outline:none}

.leg-filter-pair .filter-icon{font-size:.55rem}
.leg-order{font:700 .55rem/1 "Courier New",monospace;white-space:nowrap}
.row>.cell.leg-stack{flex-direction:column;justify-content:center;align-items:flex-end;gap:2px;line-height:16px;text-decoration:none}
.leg-stack>.buy-leg{font-size:14px;font-weight:900}
.leg-stack>.sell-leg{font-size:14px;font-weight:500}

.row.unreliable>.cell.cost{box-shadow:inset 3px 0 #fb8b1e}

#scroll{height:52px;max-height:516px;overflow-y:auto;overflow-x:hidden;scrollbar-color:#fb8b1e #111;overscroll-behavior:contain}
#space{position:relative;width:100%}

.row{height:43px;min-height:43px;font-size:16px;font-weight:800;color:#000;font-variant-numeric:tabular-nums}
.row.call,.row.call>.cell,.row.call>.select,.row.call .open{background:#a3e635!important;color:#000!important;-webkit-text-fill-color:#000!important}
.row.put,.row.put>.cell,.row.put>.select,.row.put .open{background:#ea0101!important;color:#000!important;-webkit-text-fill-color:#000!important}
.row>.cell.cost{background:#000!important;color:#ff3030!important;-webkit-text-fill-color:#ff3030!important}

.expiry-detail,.fill-detail{font-size:.50rem;line-height:1;font-weight:600;white-space:nowrap}
.row>.cell.fill-scale{padding:1px 4px;background:#000!important;color:#fb8b1e!important;-webkit-text-fill-color:#fb8b1e!important;justify-content:center}
.fill-ruler{width:100%;min-width:0;display:flex;flex-direction:column;gap:2px;font:800 8px/1 "Courier New",monospace}
.fill-labels{display:flex;justify-content:space-between;gap:2px;white-space:nowrap}

.fill-track:before{content:"";position:absolute;left:50%;top:-3px;height:9px;border-left:1px solid #f6b56a}
.fill-marker{position:absolute;top:-5px;width:5px;height:13px;background:#4af6c3;transform:translateX(-50%);box-shadow:0 0 2px #4af6c3}
.fill-estimate{font:800 10px/1 "Courier New",monospace;text-align:center;color:#4af6c3!important;-webkit-text-fill-color:#4af6c3!important;white-space:nowrap}
.fill-estimate.unavailable{color:#8f99a8!important;-webkit-text-fill-color:#8f99a8!important}

.row.annual>.select{box-shadow:inset 3px 0 #fff}
.row>.cell.cost,.row>.cell[data-field="breakeven"],.row>.cell[data-field="profit"]{font-weight:900!important;text-decoration:underline;text-underline-offset:2px}
.select,.open{height:43px;width:100%;padding:0!important;display:flex;align-items:center;justify-content:center;border:0;border-right:1px solid #a65c16;border-bottom:1px solid #a65c16;border-radius:0;font:900 .7rem/1 "Courier New",monospace}

#filter-panel{position:absolute;z-index:5;width:min(270px,calc(100vw - 8px));max-height:330px;overflow-y:auto;padding:8px;border:1px solid #fb8b1e;background:#080808;box-shadow:0 4px 16px #000;color:#f6b56a;font-size:.7rem}

.filter-actions{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.filter-actions button{min-height:25px;padding:2px 5px;border:1px solid #fb8b1e;border-radius:0;background:#050505;color:#fb8b1e;font:900 .65rem/1 "Courier New",monospace;cursor:pointer}
.filter-actions button:hover,.filter-actions button:focus-visible{background:#fb8b1e;color:#000}

.filter-field{display:flex;align-items:center;gap:5px;margin:5px 0;color:#fb8b1e;font-weight:900}
.filter-field input{width:100%;min-width:0;height:27px;padding:3px 5px;border:1px solid #fb8b1e;border-radius:0;background:#000;color:#fff;font:700 .72rem/1 "Courier New",monospace}
.filter-choices{max-height:165px;overflow-y:auto;border:1px solid #5d3605}
.filter-choice{display:flex;align-items:center;gap:6px;min-height:24px;padding:2px 4px;cursor:pointer}
.filter-choice:hover{background:#1b1106}
.filter-choice input{accent-color:#fb8b1e}
.filter-choice span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-empty{padding:6px;color:#8f99a8}
#vp-filter-toggle{display:none}

 :root{--vp-row-height:230px}
 #table{width:100%;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y pinch-zoom}
 #table-content{width:100%;min-width:0}
 #vp-filter-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:6px 8px;border:1px solid #fb8b1e;border-radius:0;background:#000;color:#fb8b1e;font:900 13px/1.2 "Courier New",monospace;text-align:left;cursor:pointer}
 #vp-filter-toggle:focus-visible{outline:2px solid #fff;outline-offset:-3px}
 #head{height:auto;grid-template-columns:repeat(3,minmax(0,1fr));padding-right:0!important}
 #table:not(.vp-filters-open) #head{display:none}
 #head>span:nth-child(-n+2){display:none}
 #head>span{min-height:44px}
 .filter-button{min-height:44px;font-size:11px}
 #scroll{max-height:460px;overscroll-behavior:auto;overscroll-behavior-x:none;touch-action:pan-y pinch-zoom}
 .row{height:calc(var(--vp-row-height) - 8px);min-height:calc(var(--vp-row-height) - 8px);margin-bottom:8px;border:1px solid #fb8b1e;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:44px 46px 46px 44px 40px;font-size:16px}
 .row>.cell{flex-direction:column;justify-content:center!important;align-items:flex-start!important;gap:2px;padding:3px 6px;line-height:1.1;text-decoration:none!important}
 .row>.cell::before{content:attr(data-label);display:block;max-width:100%;font-size:9px;line-height:1;font-weight:700;overflow:hidden;text-overflow:ellipsis}
 .row>.select{grid-area:1/1}
 .row>.link-pair{grid-area:1/4}
 .row>.cell[data-field="ticker"]{grid-area:1/2}
 .row>.cell[data-field="side"]{grid-area:1/3}
 .row>.cell[data-field="expiry"]{grid-area:2/1/3/3}
 .row>.cell[data-field="cost"]{grid-area:2/3/3/5}
 .row>.cell[data-field="strike_pair"]{grid-area:3/1}
 .row>.cell[data-field="last_pair"]{grid-area:3/2}
 .row>.cell[data-field="open_interest"]{grid-area:3/3/4/5}
 .row>.cell.leg-stack{gap:1px;line-height:13px}
 .leg-stack>.buy-leg,.leg-stack>.sell-leg{font-size:13px}
 .row>.cell[data-field="breakeven"]{grid-area:4/1/5/3}
 .row>.cell[data-field="ratio"]{grid-area:4/3/5/5}
 .row>.cell[data-field="profit"]{grid-area:5/1/6/3}
 .row>.cell[data-field="fill_scale"]{grid-area:5/3/6/5}
 .row>.cell.fill-scale::before{display:none}
 .row>.cell.cost::before{color:#fb8b1e;-webkit-text-fill-color:#fb8b1e}
 .select,.open,.link-pair{height:44px;min-height:44px}
 .link-pair .open{font-size:13px}
 .square{width:20px;height:20px}
 #filter-panel{width:min(360px,calc(100vw - 8px));max-height:420px;font-size:13px}
 .filter-actions button{min-height:44px;padding:5px 8px;font-size:12px}
 .filter-field{font-size:12px}
 .filter-field input{height:44px;font-size:16px}
 .filter-choice{min-height:44px;padding:6px}
 .filter-choice input{width:20px;height:20px;flex:none}
 .filter-choices{max-height:220px}
}
@media(min-width:700px) and (max-width:1023px){
 :root{--vp-row-height:164px}
 #head{grid-template-columns:repeat(6,minmax(0,1fr))}
 #scroll{max-height:320px}
 .row{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:44px 55px 55px}
 .row>.link-pair{grid-area:1/6}
 .row>.cell[data-field="expiry"]{grid-area:1/4/2/6}
 .row>.cell[data-field="strike_pair"]{grid-area:2/1}
 .row>.cell[data-field="last_pair"]{grid-area:2/2}
 .row>.cell[data-field="open_interest"]{grid-area:2/3}
 .row>.cell[data-field="cost"]{grid-area:2/4/3/7}
 .row>.cell[data-field="breakeven"]{grid-area:3/1/4/3}
 .row>.cell[data-field="ratio"]{grid-area:3/3}
 .row>.cell[data-field="profit"]{grid-area:3/4}
 .row>.cell[data-field="fill_scale"]{grid-area:3/5/4/7}
}
</style>
</head>
<body>
<div id="table" role="region" aria-label="Vertical spread results and column filters" tabindex="0"><div id="table-content">
<button id="vp-filter-toggle" type="button" aria-expanded="false" aria-controls="head">FILTERS / SORT ▾</button>
<div id="head" aria-label="Vertical option spread columns"></div>
<div id="scroll" role="region" aria-label="Scrollable vertical option spreads" tabindex="0">
  <div id="space"><div id="visible"></div></div>
  <div id="empty">NO MATCHING VERTICAL SPREADS</div>
</div>
</div></div>
<div id="filter-panel" role="dialog" aria-label="Spread column filter" hidden></div>
<script>
(()=>{
"use strict";
let ROW_HEIGHT=43;
const HEAD=["SELECT","OS","TICKER","TYPE","EXP / YEAR","BUY STRIKE","SELL STRIKE","BUY LAST","SELL LAST","Debit","BREAKEVEN","RISK:REWARD","MAX PROFIT","FILL","FILL EST"];
const KEYS=["ticker","side","expiry","buy","sell","buy_last","sell_last","cost","breakeven","ratio","profit","basis"];
const FILTER_KEYS=[...KEYS,"fill_scale"]; // Keep canonical payload fields unchanged.
const NUMERIC=new Set(["buy","sell","buy_last","sell_last","cost","breakeven","ratio","profit","fill_scale"]);
const table=document.getElementById("table"),head=document.getElementById("head"),scroll=document.getElementById("scroll"),space=document.getElementById("space"),visible=document.getElementById("visible"),empty=document.getElementById("empty"),panel=document.getElementById("filter-panel");
const filterToggle=document.getElementById("vp-filter-toggle");
let scope="",filterScope="",sortKey="",rows=[],selected=new Set(),pendingSelection=null;
let totalRows=0,rowOffset=0,viewportTimer=null,pendingViewport=null;
let start=-1,end=-1,revision=0,pendingRevision=0,acknowledgedRevision=0;
let columnFilters={},filterChoices={},pendingFilters=null,filterRevision=0,pendingFilterRevision=0,acknowledgedFilterRevision=0;
let openKey="",searchTerm="",filterTimer=null,pendingTypedFilter=false;
const SORT_FIELDS={ticker:"TICKER",side:"TYPE",fill_scale:"FILL EST",expiry:"EXPIRATION",buy:"BUY STRIKE",sell:"SELL STRIKE",buy_last:"BUY LAST",sell_last:"SELL LAST",cost:"COST",breakeven:"BREAKEVEN",ratio:"R:R",profit:"MAX PROFIT",basis:"FILL QUALITY"};
let sortBy="FILL + TARGET",sortDirection="ASC",sortView="",pendingSort=null,sortable=false,hasTarget=false;
let quoteEnabled=false,quoteTimer=null,quoteInFlight=null,quoteRevision=0,quoteAcknowledgedRevision=0,quoteNextAt=0;
let quoteChannel=null,quoteChannelName="",quoteBridgeReady=false,quoteSampler=null;
let quoteContext="",quoteIntersecting=typeof IntersectionObserver==="undefined",quoteIntersection=null;
let liveMarkets=new Map();
function post(type,props){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},props||{}),"*");}
function syncHeight(){
 head.style.paddingRight=(scroll.offsetWidth-scroll.clientWidth)+"px";
 const panelBottom=panel.hidden?0:Number.parseFloat(panel.style.top||"0")+panel.offsetHeight;
 post("streamlit:setFrameHeight",{height:Math.max(table.offsetHeight,panelBottom)});
}
function sizeRows(){
 const height=Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--vp-row-height"))||43;
 const first=Math.floor(scroll.scrollTop/ROW_HEIGHT),changed=height!==ROW_HEIGHT;
 ROW_HEIGHT=height;
 const limit=height===43?516:height===164?320:460;
 scroll.style.height=Math.min(limit,Math.max(52,totalRows*ROW_HEIGHT))+"px";
 space.style.height=(totalRows*ROW_HEIGHT)+"px";
 if(changed){scroll.scrollTop=first*ROW_HEIGHT;start=-1;end=-1;}
 return changed;
}
function clearQuoteTimer(){if(quoteTimer!==null){clearTimeout(quoteTimer);quoteTimer=null;}}
function visibleQuoteIDs(){
 const clip=scroll.getBoundingClientRect(),bounds=quoteIntersection||clip;
 const top=Math.max(0,clip.top,bounds.top),bottom=Math.min(window.innerHeight,clip.bottom,bounds.bottom);
 const left=Math.max(0,clip.left),right=Math.min(window.innerWidth,clip.right);
 const ids=[];
 for(const line of visible.querySelectorAll(".row")){
  const cell=line.querySelector(".fill-scale");if(!cell)continue;
  const box=cell.getBoundingClientRect(),row=rows[Number(line.dataset.index)-rowOffset];
  if(box.bottom<=top||box.top>=bottom||box.right<=left||box.left>=right||box.width<=0||box.height<=0)continue;
  if(row&&typeof row.id==="string"&&!ids.includes(row.id))ids.push(row.id);
  if(ids.length===20)break;
 }
 return ids;
}
function scheduleQuote(delay=10000){
 clearQuoteTimer();
 if(!quoteEnabled||!quoteBridgeReady||document.hidden||!quoteIntersecting)return;
 quoteTimer=setTimeout(pollQuotes,Math.max(0,delay));
}
function wakeQuotes(){
 const delay=quoteInFlight?Math.max(0,30000-(Date.now()-quoteInFlight.sentAt)):Math.max(0,quoteNextAt-Date.now());
 scheduleQuote(delay);
}
function pollQuotes(freshIntersection=false){
 quoteTimer=null;
 if(!quoteEnabled||!quoteBridgeReady||document.hidden||!quoteIntersecting)return;
 if(liveMarkets.size)patchLiveQuotes();
 if(quoteInFlight){
  const remaining=30000-(Date.now()-quoteInFlight.sentAt);
  if(remaining>0){scheduleQuote(remaining);return;}
  quoteInFlight=null;quoteNextAt=Date.now()+30000;scheduleQuote(30000);return;
 }
 if(!panel.hidden||pendingFilters||pendingSelection||pendingViewport!==null){scheduleQuote();return;}
 if(Date.now()<quoteNextAt){scheduleQuote(quoteNextAt-Date.now());return;}
 if(!freshIntersection&&typeof IntersectionObserver!=="undefined"){
  if(quoteSampler)return;
  const context=quoteContext;
  const sampler=new IntersectionObserver(entries=>{
   sampler.disconnect();if(quoteSampler!==sampler)return;quoteSampler=null;
   const entry=entries[entries.length-1];quoteIntersecting=Boolean(entry&&entry.isIntersecting);
   quoteIntersection=entry?.intersectionRect||null;clearQuoteTimer();
   if(context===quoteContext)pollQuotes(true);else wakeQuotes();
  });
  quoteSampler=sampler;sampler.observe(scroll);return;
 }
 const ids=visibleQuoteIDs();if(!ids.length){scheduleQuote();return;}
 quoteRevision+=1;quoteInFlight={revision:quoteRevision,context:quoteContext,sentAt:Date.now()};
 quoteNextAt=Date.now()+10000;
 quoteChannel.postMessage({kind:"quote_tick",scope,quote_sort_key:sortKey,
  quote_revision:quoteRevision,quote_ids:ids});
 scheduleQuote(30000);
}
function receiveLiveQuote(message){
 if(!quoteEnabled||!message||message.scope!==scope||message.quote_sort_key!==sortKey)return;
 if(message.kind==="quote_ready"){
  quoteBridgeReady=message.enabled===true;
  if(!quoteBridgeReady){
   quoteInFlight=null;liveMarkets=new Map([...liveMarkets].map(([id,market])=>[id,{...market,stale:true}]));patchLiveQuotes();
  }
  wakeQuotes();return;
 }
 if(message.kind!=="quote_update"||!quoteBridgeReady)return;
 const update=message.update;if(!update||typeof update!=="object")return;
 const ack=update.revision;
 if(!Number.isSafeInteger(ack)||ack<quoteAcknowledgedRevision)return;
 quoteRevision=Math.max(quoteRevision,ack);quoteAcknowledgedRevision=ack;
 if(quoteInFlight&&quoteInFlight.context===quoteContext&&ack>=quoteInFlight.revision){
  const retry=Number(update.retry_seconds);
  quoteNextAt=Math.max(quoteNextAt,Date.now()+Math.max(10,Number.isFinite(retry)?retry:10)*1000);
  quoteInFlight=null;
 }
 const allowed=new Set(rows.map(row=>row.id)),markets=update.markets;
 if(markets&&typeof markets==="object"&&!Array.isArray(markets)){
  liveMarkets=new Map(Object.entries(markets).filter(([id,market])=>allowed.has(id)&&market&&typeof market==="object"));
  patchLiveQuotes();
 }
 wakeQuotes();
}
function configureLiveQuotes(args){
 const context=String(args.scope||"")+"|"+String(args.sort_key||""),nextName=String(args.live_quote_channel||"");
 if(context!==quoteContext){
  if(quoteSampler){quoteSampler.disconnect();quoteSampler=null;}
  quoteContext=context;quoteBridgeReady=false;quoteInFlight=null;quoteNextAt=0;liveMarkets=new Map();
 }
 quoteEnabled=args.live_quotes_enabled===true&&typeof BroadcastChannel!=="undefined"&&Boolean(nextName);
 if(nextName!==quoteChannelName||!quoteEnabled||(quoteEnabled&&!quoteChannel)){
  if(quoteSampler){quoteSampler.disconnect();quoteSampler=null;}
  if(nextName!==quoteChannelName){quoteRevision=0;quoteAcknowledgedRevision=0;}
  if(quoteChannel)quoteChannel.close();quoteChannel=null;quoteChannelName=nextName;
  quoteBridgeReady=false;quoteInFlight=null;liveMarkets=new Map();
  if(quoteEnabled){quoteChannel=new BroadcastChannel(nextName);quoteChannel.onmessage=event=>receiveLiveQuote(event.data);}
 }
 if(quoteChannel)quoteChannel.postMessage({kind:"quote_client_ready",scope:String(args.scope||""),quote_sort_key:String(args.sort_key||"")});
 wakeQuotes();
}
function renderFillScale(cell,row){
 const live=liveMarkets.get(row.id),market=live||row.fill_market||{};
 const number=value=>value===null||value===undefined||value===""?NaN:Number(value);
 const bid=number(market.bid),mid=number(market.mid),ask=number(market.ask);
 const debit=number(row.fill_market?.debit),estimate=number(market.estimate);
 const quoted=Number.isFinite(bid)&&Number.isFinite(ask)&&ask>bid;
 const position=quoted&&Number.isFinite(debit);
 const ruler=document.createElement("div");ruler.className="fill-ruler";
 const labels=document.createElement("div");labels.className="fill-labels";
 for(const [word,value] of [["BID",bid],["MID",mid],["ASK",ask]]){
  const tag=document.createElement("span"),price=Number.isFinite(value)?value.toFixed(2):"—";
  tag.textContent=price;tag.setAttribute("aria-label",word+" "+price);labels.appendChild(tag);
 }
 const track=document.createElement("div");track.className="fill-track";
 const odds=document.createElement("small");odds.className="fill-estimate";
 if(position){
  const marker=document.createElement("i");marker.className="fill-marker";
  marker.style.left=(100*Math.max(0,Math.min(1,(debit-bid)/(ask-bid))))+"%";track.appendChild(marker);
 }
 let freshness="SNAP",detail="Scan snapshot quotes.";
 if(live){
  const status=String(live.status||"UNKNOWN").toUpperCase(),normalized=status.replace(/[\s_-]/g,"");
  const asOf=number(live.as_of),age=Date.now()/1000-asOf;
  const knownTime=Number.isFinite(asOf)&&asOf>0&&age>=-60;
  const stale=Boolean(live.stale)||!knownTime||(normalized==="REALTIME"&&age>30);
  const badge=stale?"STALE":normalized==="REALTIME"?"RT":normalized.includes("DELAY")?"DLY":normalized.includes("CLOS")?"CLOSE":"N/A";
  const seconds=Math.max(0,Math.floor(age));
  const ageText=knownTime?(seconds<60?seconds+"s":seconds<3600?Math.floor(seconds/60)+"m":Math.floor(seconds/3600)+"h"):"?";

  acknowledgedFilterRevision=serverFilterRevision;filterRevision=Math.max(filterRevision,serverFilterRevision);
 }else if(!hasFilterAck&&sameFilters(serverFilters,pendingFilters)){
  columnFilters=serverFilters;pendingFilters=null;pendingSort=null;pendingFilterRevision=0;
 }else if(hasFilterAck&&serverFilterRevision>acknowledgedFilterRevision){
  acknowledgedFilterRevision=serverFilterRevision;replayPending=true;
 }
 if(scopeChanged&&!filterScopeChanged){
  closePanel(false);
  if(pendingFilters)replayPending=true;
 }
 const serverSelection=new Set(Array.isArray(args.selected_ids)?args.selected_ids:[]);
 const hasAck=Number.isInteger(args.ack_revision)&&args.ack_revision>=0;
 const serverRevision=hasAck?args.ack_revision:0;
 if(scopeChanged){
  pendingSelection=null;pendingRevision=0;acknowledgedRevision=serverRevision;revision=serverRevision;selected=serverSelection;
 }else if(!pendingSelection){
  if(!hasAck||serverRevision>=acknowledgedRevision)selected=serverSelection;
  acknowledgedRevision=Math.max(acknowledgedRevision,serverRevision);revision=Math.max(revision,serverRevision);
 }else if(hasAck&&serverRevision>=pendingRevision){
  selected=serverSelection;pendingSelection=null;pendingRevision=0;acknowledgedRevision=serverRevision;revision=Math.max(revision,serverRevision);
 }else if(!hasAck&&serverSelection.size===pendingSelection.size&&[...serverSelection].every(id=>pendingSelection.has(id))){
  selected=serverSelection;pendingSelection=null;pendingRevision=0;
 }else if(hasAck&&serverRevision>acknowledgedRevision){
  acknowledgedRevision=serverRevision;
  replayPending=true;
 }
 if(replayPending)emitValue();
 updateTargetAvailability(!pendingFilters&&Boolean(args.has_target));
 updateFilterHeaders();
 if(!panel.hidden){
  if(NUMERIC.has(openKey))syncNumericInputs();
  else if(JSON.stringify(priorFilters[openKey])!==JSON.stringify(columnFilters[openKey])
          ||JSON.stringify(priorChoices[openKey])!==JSON.stringify(filterChoices[openKey]))renderPanel();
 }
 if(needsReset)scroll.scrollTop=0;
 sizeRows();
 scroll.setAttribute("aria-label","Scrollable vertical option spreads; "+totalRows.toLocaleString()+" results");
 empty.style.display=totalRows?"none":"block";
 start=-1;end=-1;paint(true);syncHeight();
});
window.addEventListener("resize",()=>{
 if(sizeRows())paint(true);
 if(!panel.hidden){
  const anchor=head.querySelector('[data-key="'+(openKey==="basis"?"cost":openKey)+'"]');
  if(anchor){
   const width=Math.min(ROW_HEIGHT===43?270:360,window.innerWidth-8);
   panel.style.left=Math.max(4,Math.min(anchor.getBoundingClientRect().left,window.innerWidth-width-4))+"px";
   panel.style.top=head.getBoundingClientRect().bottom+"px";
  }
 }
 syncHeight();
});
document.addEventListener("visibilitychange",wakeQuotes);
window.addEventListener("pagehide",clearQuoteTimer);
window.addEventListener("beforeunload",()=>{if(quoteChannel)quoteChannel.close();});
window.addEventListener("pageshow",wakeQuotes);
if(typeof IntersectionObserver!=="undefined")new IntersectionObserver(entries=>{
 const entry=entries[0];quoteIntersecting=Boolean(entry&&entry.isIntersecting);
 quoteIntersection=entry?.intersectionRect||null;wakeQuotes();
}).observe(scroll);
new ResizeObserver(()=>syncHeight()).observe(document.getElementById("table"));
sizeRows();
post("streamlit:componentReady",{apiVersion:1});syncHeight();
})();
</script>
