<!doctype html>
<!-- OWNERSHIP / EDITING NOTES
EDIT THIS FILE FOR: Persistent GEX snapshot transport and its previous-good backup.
DO NOT EDIT THIS FILE FOR: Broker data, authentication, orders or other components.
-->
<html lang="en"><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}</style>
</head><body><script>
(()=>{
"use strict";
let lastEvent="",queue=Promise.resolve();
function post(type,props){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},props||{}),"*");}
function send(value){post("streamlit:setComponentValue",{value,dataType:"json"});}
function valid(state){return state&&typeof state==="object"&&typeof state.packed==="string"&&typeof state.digest==="string";}
function database(){return new Promise((resolve,reject)=>{
 const request=indexedDB.open("raj-terminal-gex-snapshots-v1",1);
 request.onupgradeneeded=()=>request.result.createObjectStore("snapshots");
 request.onsuccess=()=>resolve(request.result);
 request.onerror=()=>reject(request.error);
 request.onblocked=()=>reject(new Error("Storage blocked"));
});}
async function read(key){
 let saved=null;
 try{
  const db=await database();
  try{saved=await new Promise((resolve,reject)=>{
   const request=db.transaction("snapshots","readonly").objectStore("snapshots").get(key);
   request.onsuccess=()=>{
    const record=request.result||{};
    resolve(valid(record.current)?Object.assign({},record.current,{previous:record.previous}):valid(record.previous)?record.previous:null);
   };
   request.onerror=()=>reject(request.error);
  });}finally{db.close();}
 }catch{}
 try{
  const local=JSON.parse(localStorage.getItem(key)||"null");
  if(valid(local)&&(!saved||Number(local.revision)>Number(saved.revision)))saved=local;
 }catch{}
 return saved;
}
async function write(key,state){
 try{
  const db=await database();
  try{await new Promise((resolve,reject)=>{
   const transaction=db.transaction("snapshots","readwrite"),store=transaction.objectStore("snapshots");
   const request=store.get(key);
   request.onsuccess=()=>{
    const record=request.result||{};
    if(record.current?.digest===state.digest)return;
    store.put({current:state,previous:valid(record.current)?record.current:record.previous||null},key);
   };
   transaction.oncomplete=resolve;
   transaction.onerror=()=>reject(transaction.error);
   transaction.onabort=()=>reject(transaction.error);
  });}finally{db.close();}
  return true;
 }catch{
  try{localStorage.setItem(key,JSON.stringify(state));return true;}catch{return false;}
 }
}
async function apply(args){
 const key=String(args.storage_key||""),mode=String(args.mode||"read"),state=args.server_state||{};
 const event=key+"|"+mode+"|"+String(state.digest||"");
 if(event===lastEvent)return;
 lastEvent=event;
 if(mode==="read"){
  const saved=await read(key);
  send({state:saved,source:saved?"browser":"empty"});
 }else if(args.hydrated&&valid(state)){
  send({saved:await write(key,state),digest:state.digest});
 }
}
window.addEventListener("message",event=>{
 if(event.data?.type==="streamlit:render")queue=queue.then(()=>apply(event.data.args||{}));
});
post("streamlit:componentReady",{apiVersion:1});post("streamlit:setFrameHeight",{height:0});
})();
</script></body></html>
