<!doctype html>
<!-- OWNERSHIP / EDITING NOTES
EDIT THIS FILE FOR: Vertical Options pricing mode preference in this browser.
DO NOT EDIT THIS FILE FOR: order placement, shared theme, Risk Sizing, GEX, or other tabs.
-->
<html lang="en">
<head><meta charset="utf-8"><style>html,body{margin:0;padding:0;height:0;overflow:hidden;background:transparent}</style></head>
<body>
<script>
(() => {
  "use strict";
  const KEY = "raj-terminal-vo-pricing-mode-v1";
  function post(type, props) {
    window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},props||{}), "*");
  }
  function send(value) {
    post("streamlit:setComponentValue", {value, dataType:"json"});
  }
  function read() {
    try {
      const saved = localStorage.getItem(KEY);
      return {ready:true,mode:saved==="NORMAL"||saved==="SMART FILL"?saved:null,available:true};
    } catch (_) {
      return {ready:true,mode:null,available:false};
    }
  }
  function write(value) {
    if (value!=="NORMAL" && value!=="SMART FILL") return;
    try { localStorage.setItem(KEY, value); } catch (_) {}
  }
  window.addEventListener("message", e => {
    if (!e.data || e.data.type!=="streamlit:render") return;
    const args = e.data.args || {};
    if (args.action==="read") send(read());
    else if (args.action==="write") write(args.value);
    post("streamlit:setFrameHeight",{height:0});
  });
  post("streamlit:componentReady",{apiVersion:1});
  post("streamlit:setFrameHeight",{height:0});
})();
</script>
</body></html>
