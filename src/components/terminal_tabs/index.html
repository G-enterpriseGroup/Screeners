<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bb-black:#000000;
      --bb-orange:#fb8b1e;
      --bb-blue:#0068ff;
      --bb-green:#4af6c3;
      --bb-red:#ff433d;
    }

    html, body {
      margin:0;
      padding:0;
      background:var(--bb-black);
      color:var(--bb-orange);
      font-family:"Courier New",monospace;
      overflow:hidden;
    }

    #tabs {
      display:flex;
      align-items:stretch;
      gap:2px;
      width:100%;
      min-height:42px;
      border-bottom:1px solid var(--bb-orange);
      background:var(--bb-black);
      box-sizing:border-box;
      padding:0 0 1px 0;
      user-select:none;
      -webkit-user-select:none;
    }

    .tab {
      position:relative;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:40px;
      padding:0 13px;
      border:1px solid transparent;
      border-bottom:0;
      background:var(--bb-black);
      color:var(--bb-orange);
      font:900 14px/1 "Courier New",monospace;
      letter-spacing:.015em;
      white-space:nowrap;
      cursor:grab;
      box-sizing:border-box;
      touch-action:pan-y;
      transition:background 80ms ease,color 80ms ease,border-color 80ms ease,transform 80ms ease,opacity 80ms ease;
    }

    .tab:hover {
      background:#111111;
      border-color:var(--bb-orange);
      color:#ffffff;
    }

    .tab.active {
      background:var(--bb-orange);
      color:var(--bb-black);
      border-color:var(--bb-orange);
    }

    .tab.pointer-down {
      transform:translateY(1px);
    }

    .tab.dragging {
      opacity:.72;
      background:var(--bb-blue) !important;
      color:#ffffff !important;
      border-color:#66adff !important;
      cursor:grabbing;
      transform:scale(.985);
      z-index:5;
    }

    .tab.drop-before::before,
    .tab.drop-after::after {
      content:"";
      position:absolute;
      top:3px;
      bottom:3px;
      width:4px;
      background:var(--bb-green);
      box-shadow:0 0 8px rgba(74,246,195,.75);
      pointer-events:none;
    }

    .tab.drop-before::before { left:-3px; }
    .tab.drop-after::after { right:-3px; }

    .drag-hint {
      margin-left:auto;
      align-self:center;
      color:#777777;
      font:700 10px/1 "Courier New",monospace;
      padding:0 8px 0 12px;
      white-space:nowrap;
      pointer-events:none;
    }

    body.drag-mode,
    body.drag-mode * {
      cursor:grabbing !important;
    }

    @media (max-width:900px) {
      .tab { padding:0 9px; font-size:12px; }
      .drag-hint { display:none; }
    }
  </style>
</head>
<body>
  <div id="tabs"></div>

  <script>
    function sendMessageToStreamlitClient(type, data) {
      const outData = Object.assign({
        isStreamlitMessage:true,
        type:type,
      }, data);
      window.parent.postMessage(outData, "*");
    }

    function init() {
      sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion:1 });
    }

    function setFrameHeight(height) {
      sendMessageToStreamlitClient("streamlit:setFrameHeight", { height:height });
    }

    function sendDataToPython(value) {
      sendMessageToStreamlitClient("streamlit:setComponentValue", {
        value:value,
        dataType:"json",
      });
    }

    let tabs = [];
    let active = "";
    let storageKey = "raj-terminal-tabs-v2";
    let storageChecked = false;
    let interaction = null;
    let pendingPythonArgs = null;
    let lastEmittedSignature = "";

    const DRAG_THRESHOLD_PX = 8;

    function cleanOrder(candidate, allowed) {
      if (!Array.isArray(candidate)) return [...allowed];
      const out = [];
      candidate.forEach((item) => {
        const text = String(item);
        if (allowed.includes(text) && !out.includes(text)) out.push(text);
      });
      allowed.forEach((item) => {
        if (!out.includes(item)) out.push(item);
      });
      return out;
    }

    function stateSignature(order, selected) {
      return JSON.stringify({ order:order, active:selected });
    }

    function persist() {
      try {
        localStorage.setItem(storageKey, stateSignature(tabs, active));
      } catch (_) {}
    }

    function emit(action) {
      persist();
      const signature = stateSignature(tabs, active) + "|" + String(action);
      if (signature === lastEmittedSignature) return;
      lastEmittedSignature = signature;
      sendDataToPython({ order:[...tabs], active:active, action:action });
    }

    function clearVisualState() {
      document.querySelectorAll(".tab").forEach((el) => {
        el.classList.remove("drop-before", "drop-after", "pointer-down", "dragging");
      });
    }

    function getTabElements() {
      return Array.from(document.querySelectorAll(".tab"));
    }

    function dropTargetFromX(clientX, sourceIndex) {
      const elements = getTabElements();
      let insertion = tabs.length;
      for (let i = 0; i < elements.length; i += 1) {
        const rect = elements[i].getBoundingClientRect();
        if (clientX < rect.left + rect.width / 2) {
          insertion = i;
          break;
        }
      }
      let target = insertion;
      if (sourceIndex < target) target -= 1;
      return Math.max(0, Math.min(target, tabs.length - 1));
    }

    function markDropTarget(clientX) {
      document.querySelectorAll(".tab").forEach((el) => {
        el.classList.remove("drop-before", "drop-after");
      });
      const elements = getTabElements();
      if (!elements.length) return;

      let markerIndex = elements.length - 1;
      let before = false;
      for (let i = 0; i < elements.length; i += 1) {
        const rect = elements[i].getBoundingClientRect();
        if (clientX < rect.left + rect.width / 2) {
          markerIndex = i;
          before = true;
          break;
        }
      }
      elements[markerIndex].classList.add(before ? "drop-before" : "drop-after");
    }

    function finishInteraction(event) {
      if (!interaction || event.pointerId !== interaction.pointerId) return;

      const current = interaction;
      interaction = null;
      document.body.classList.remove("drag-mode");
      clearVisualState();

      try {
        current.element.releasePointerCapture(event.pointerId);
      } catch (_) {}

      let localStateChanged = false;

      if (current.dragging) {
        event.preventDefault();
        event.stopPropagation();

        const targetIndex = dropTargetFromX(event.clientX, current.sourceIndex);
        if (targetIndex !== current.sourceIndex) {
          const next = [...tabs];
          const [moved] = next.splice(current.sourceIndex, 1);
          next.splice(targetIndex, 0, moved);
          tabs = next;
          localStateChanged = true;
          render();
          emit("reorder");
        } else {
          render();
        }
      } else {
        const label = current.label;
        if (active !== label) {
          active = label;
          localStateChanged = true;
          render();
          emit("select");
        } else {
          render();
        }
      }

      // A render message queued while the pointer was down can represent the
      // pre-interaction state. Never replay that stale state after a local drag
      // or tab selection; wait for Streamlit's fresh acknowledgment instead.
      if (localStateChanged) {
        pendingPythonArgs = null;
      } else if (pendingPythonArgs) {
        const args = pendingPythonArgs;
        pendingPythonArgs = null;
        applyPythonArgs(args);
      }
    }

    function cancelInteraction(event) {
      if (!interaction || (event.pointerId !== undefined && event.pointerId !== interaction.pointerId)) return;
      const current = interaction;
      interaction = null;
      document.body.classList.remove("drag-mode");
      clearVisualState();
      try {
        current.element.releasePointerCapture(current.pointerId);
      } catch (_) {}
      render();

      if (pendingPythonArgs) {
        const args = pendingPythonArgs;
        pendingPythonArgs = null;
        applyPythonArgs(args);
      }
    }

    function wireTab(button, label, index) {
      button.addEventListener("pointerdown", (event) => {
        if (event.button !== 0 || interaction) return;

        interaction = {
          pointerId:event.pointerId,
          sourceIndex:index,
          label:label,
          startX:event.clientX,
          startY:event.clientY,
          dragging:false,
          element:button,
        };
        button.classList.add("pointer-down");
        try {
          button.setPointerCapture(event.pointerId);
        } catch (_) {}
      });

      button.addEventListener("pointermove", (event) => {
        if (!interaction || event.pointerId !== interaction.pointerId) return;

        const dx = event.clientX - interaction.startX;
        const dy = event.clientY - interaction.startY;
        const horizontalDrag = Math.abs(dx) >= DRAG_THRESHOLD_PX && Math.abs(dx) > Math.abs(dy);

        if (!interaction.dragging && horizontalDrag) {
          interaction.dragging = true;
          interaction.element.classList.remove("pointer-down");
          interaction.element.classList.add("dragging");
          document.body.classList.add("drag-mode");
        }

        if (interaction.dragging) {
          event.preventDefault();
          markDropTarget(event.clientX);
        }
      });

      button.addEventListener("pointerup", finishInteraction);
      button.addEventListener("pointercancel", cancelInteraction);
      button.addEventListener("lostpointercapture", (event) => {
        if (interaction && event.pointerId === interaction.pointerId) {
          cancelInteraction(event);
        }
      });

      button.addEventListener("contextmenu", (event) => {
        if (interaction && interaction.dragging) event.preventDefault();
      });

      button.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          if (active !== label) {
            active = label;
            render();
            emit("select");
          }
          return;
        }

        if (event.altKey && (event.key === "ArrowLeft" || event.key === "ArrowRight")) {
          event.preventDefault();
          const direction = event.key === "ArrowLeft" ? -1 : 1;
          const target = Math.max(0, Math.min(tabs.length - 1, index + direction));
          if (target !== index) {
            const next = [...tabs];
            const [moved] = next.splice(index, 1);
            next.splice(target, 0, moved);
            tabs = next;
            render();
            emit("reorder");
          }
        }
      });
    }

    function render() {
      const root = document.getElementById("tabs");
      root.innerHTML = "";

      tabs.forEach((label, index) => {
        const button = document.createElement("div");
        button.className = "tab" + (label === active ? " active" : "");
        button.textContent = label;
        button.dataset.index = String(index);
        button.dataset.label = label;
        button.title = "Click to open. Drag horizontally to reorder.";
        button.setAttribute("role", "tab");
        button.setAttribute("aria-selected", label === active ? "true" : "false");
        button.setAttribute("tabindex", "0");
        wireTab(button, label, index);
        root.appendChild(button);
      });

      const hint = document.createElement("div");
      hint.className = "drag-hint";
      hint.textContent = "CLICK = OPEN  //  DRAG = REORDER";
      root.appendChild(hint);

      window.setTimeout(() => setFrameHeight(Math.max(44, root.scrollHeight + 2)), 0);
    }

    function applyPythonArgs(args) {
      const allowed = Array.isArray(args.tabs) ? args.tabs.map(String) : [];
      if (!allowed.length) return;

      storageKey = String(args.storage_key || "raj-terminal-tabs-v2");
      const pythonOrder = cleanOrder(allowed, allowed);
      const pythonActive = allowed.includes(String(args.active)) ? String(args.active) : (allowed[0] || "");

      if (!storageChecked) {
        storageChecked = true;
        try {
          const raw = localStorage.getItem(storageKey);
          if (raw) {
            const saved = JSON.parse(raw);
            const savedOrder = cleanOrder(saved.order, allowed);
            const savedActive = allowed.includes(String(saved.active)) ? String(saved.active) : pythonActive;
            if (stateSignature(savedOrder, savedActive) !== stateSignature(pythonOrder, pythonActive)) {
              tabs = savedOrder;
              active = savedActive;
              render();
              emit("restore");
              return;
            }
          }
        } catch (_) {}
      }

      tabs = pythonOrder;
      active = pythonActive;
      render();
    }

    function onDataFromPython(event) {
      if (!event.data || event.data.type !== "streamlit:render") return;
      const args = event.data.args || {};

      // Never interrupt a live drag/click gesture with a Streamlit rerender.
      if (interaction) {
        pendingPythonArgs = args;
        return;
      }
      applyPythonArgs(args);
    }

    window.addEventListener("message", onDataFromPython);
    window.addEventListener("blur", () => {
      if (interaction) cancelInteraction({ pointerId:interaction.pointerId });
    });
    window.addEventListener("load", () => setFrameHeight(46));
    init();
  </script>
</body>
</html>
