<!doctype html>
<!-- OWNERSHIP / EDITING NOTES
EDIT THIS FILE FOR: Rebalance browser-memory hydration and save acknowledgements.
DO NOT EDIT THIS FILE FOR: Risk Sizing memory, broker data, authentication or orders.
Keep the existing component name/storage keys in Python to migrate v1 browser data.
-->
<html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;overflow:hidden;background:transparent}</style></head><body><script>
(() => {
  let lastEvent = "";
  function post(type, data) { window.parent.postMessage({isStreamlitMessage:true,type,...data}, "*"); }
  function send(value) {
    const event = JSON.stringify(value);
    if (event !== lastEvent) { lastEvent = event; post("streamlit:setComponentValue", {value,dataType:"json"}); }
  }
  function read(key) {
    const raw = localStorage.getItem(key);
    const value = raw ? JSON.parse(raw) : null;
    return value && typeof value === "object" && !Array.isArray(value) ? value : null;
  }
  function newer(a, b) {
    return Number(a?.revision || 0) > Number(b?.revision || 0) ||
      (Number(a?.revision || 0) === Number(b?.revision || 0) && Number(a?.saved_at || 0) > Number(b?.saved_at || 0));
  }
  window.addEventListener("message", e => {
    if (e.source !== window.parent || e.data?.type !== "streamlit:render") return;
    const args = e.data.args || {}, key = String(args.storage_key || "");
    try {
      const browser = read(key);
      if (args.read_only) {
        send({ready:true, available:true, state:browser});
      } else {
        const server = args.server_state || {};
        if (newer(browser, server)) {
          send({ready:true, available:true, state:browser});
        } else {
          localStorage.setItem(key, JSON.stringify(server));
          send({ready:true, available:true, saved_revision:server.revision});
        }
      }
    } catch (_) { send({ready:true, available:false}); }
    post("streamlit:setFrameHeight", {height:0});
  });
  post("streamlit:componentReady", {apiVersion:1});
  post("streamlit:setFrameHeight", {height:0});
})();
</script></body></html>
