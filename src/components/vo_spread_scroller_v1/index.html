<!doctype html>
<!-- OWNERSHIP / EDITING NOTES
EDIT THIS FILE FOR: Vertical Options ranked-spread table, column filters, annual highlights, selection, and OptionStrat / TradingView links.
DO NOT EDIT THIS FILE FOR: Protective Puts, shared theme, broker order submission, or other tabs.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;color:#f6b56a;overflow:hidden;font-family:"Courier New",monospace}
#head,.row{display:grid;grid-template-columns:5% 8% 5% 7% 7% 6% 6% 7% 7% 7% 8% 9% 9% 9%;width:100%}
#table{overflow-x:auto;scrollbar-color:#fb8b1e #111}
#table-content{min-width:1200px}
#head{height:43px;background:#fb8b1e;color:#000;font-size:.68rem;font-weight:900}
#head>span,.row>.cell{display:flex;align-items:center;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px;border-right:1px solid #a65c16;border-bottom:1px solid #a65c16}
#head>span{border-top:1px solid #fb8b1e;white-space:normal;line-height:1.2}
#head>span:has(.filter-button){padding:0}
.filter-button{display:flex;align-items:center;justify-content:space-between;gap:2px;width:100%;height:100%;min-width:0;padding:0 3px;border:0;border-radius:0;background:transparent;color:#000;font:900 .64rem/1.1 "Courier New",monospace;cursor:pointer;text-align:left}
.filter-button:hover,.filter-button:focus-visible,.filter-button.active{background:#c96c0c;outline:none}
.filter-name{min-width:0;overflow:hidden;text-overflow:ellipsis}
.filter-icon{flex:none;font-size:.7rem}
.row.unreliable>.cell:last-child{box-shadow:inset 3px 0 #000}
.row:has(.select[aria-pressed="true"]){outline:2px solid #fb8b1e;outline-offset:-2px}
#head>span:first-child,.row>.select{border-left:1px solid #fb8b1e}
#head>span:nth-child(-n+3),.row>.cell:nth-child(3){justify-content:center}
#head>span:nth-child(n+5),.row>.cell:nth-child(n+5){justify-content:flex-end}
#head>span:nth-child(4),.row>.cell:nth-child(4),#head>span:last-child,.row>.cell:last-child{justify-content:center}
#scroll{height:52px;max-height:516px;overflow-y:auto;overflow-x:hidden;scrollbar-color:#fb8b1e #111;overscroll-behavior:contain}
#space{position:relative;width:100%}
#visible{position:absolute;left:0;right:0;top:0}
.row{height:43px;min-height:43px;font-size:.73rem;font-weight:800;color:#000;font-variant-numeric:tabular-nums}
.row.call,.row.call>.cell,.row.call>.select,.row.call .open{background:#a3e635!important;color:#000!important;-webkit-text-fill-color:#000!important}
.row.put,.row.put>.cell,.row.put>.select,.row.put .open{background:#ea0101!important;color:#000!important;-webkit-text-fill-color:#000!important}
.row>.cell.expiry{flex-direction:column;justify-content:center;align-items:flex-end;gap:2px}
.expiry-detail{font-size:.50rem;line-height:1;font-weight:600;white-space:nowrap}
.row.annual>.cell{font-weight:900!important}
.row.annual>.select{box-shadow:inset 3px 0 #fff}
.row>.cell:nth-child(10),.row>.cell:nth-child(11),.row>.cell:nth-child(13){font-weight:900!important;text-decoration:underline;text-underline-offset:2px}
.select,.open{height:43px;width:100%;padding:0!important;display:flex;align-items:center;justify-content:center;border:0;border-right:1px solid #a65c16;border-bottom:1px solid #a65c16;border-radius:0;font:900 .7rem/1 "Courier New",monospace}
.link-pair{height:43px;min-width:0;display:flex}
.link-pair .open{width:50%;flex:1 1 0;font-size:.65rem}
.select{background:#000;cursor:pointer}
.select:hover{background:#120a02}
.select:focus-visible,.open:focus-visible{outline:2px solid #fff;outline-offset:-3px}
.square{display:flex;align-items:center;justify-content:center;width:16px;height:16px;border:2px solid #fb8b1e;border-radius:0;background:#000;color:transparent;flex:none;font:bold 12px/1 "Courier New",monospace}
.select[aria-pressed="true"] .square{background:#fb8b1e;color:#000}
.open{color:#fb8b1e;text-decoration:underline;background:#000}
.open.disabled{text-decoration:none;cursor:default}
#empty{padding:18px;font-size:13px;color:#fb8b1e;display:none}
#filter-panel{position:absolute;z-index:5;width:min(270px,calc(100vw - 8px));max-height:330px;overflow-y:auto;padding:8px;border:1px solid #fb8b1e;background:#080808;box-shadow:0 4px 16px #000;color:#f6b56a;font-size:.7rem}
#filter-panel[hidden]{display:none}
.filter-title{margin-bottom:6px;color:#fb8b1e;font-weight:900}
.filter-actions{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.filter-actions button{min-height:25px;padding:2px 5px;border:1px solid #fb8b1e;border-radius:0;background:#050505;color:#fb8b1e;font:900 .65rem/1 "Courier New",monospace;cursor:pointer}
.filter-actions button:hover,.filter-actions button:focus-visible{background:#fb8b1e;color:#000}
.filter-field{display:flex;align-items:center;gap:5px;margin:5px 0;color:#fb8b1e;font-weight:900}
.filter-field input{width:100%;min-width:0;height:27px;padding:3px 5px;border:1px solid #fb8b1e;border-radius:0;background:#000;color:#fff;font:700 .72rem/1 "Courier New",monospace}
.filter-choices{max-height:165px;overflow-y:auto;border:1px solid #5d3605}
.filter-choice{display:flex;align-items:center;gap:6px;min-height:24px;padding:2px 4px;cursor:pointer}
.filter-choice:hover{background:#1b1106}
.filter-choice input{accent-color:#fb8b1e}
.filter-choice span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filter-empty{padding:6px;color:#8f99a8}
</style>
</head>
<body>
<div id="table" role="region" aria-label="Spread columns; scroll horizontally on smaller screens" tabindex="0"><div id="table-content">
<div id="head" aria-label="Vertical option spread columns"></div>
<div id="scroll" role="region" aria-label="Scrollable vertical option spreads" tabindex="0">
  <div id="space"><div id="visible"></div></div>
  <div id="empty">NO MATCHING VERTICAL SPREADS</div>
</div>
</div></div>
<div id="filter-panel" role="dialog" aria-label="Spread column filter" hidden></div>
<script>
(()=>{
"use strict";
const ROW_HEIGHT=43;
const HEAD=["SELECT","OS / TV","TICKER","TYPE","EXP / YEAR","BUY STRIKE","SELL STRIKE","BUY LAST","SELL LAST","COST / MAX LOSS","BREAKEVEN","RISK:REWARD","MAX PROFIT","FILL"];
const KEYS=["ticker","side","expiry","buy","sell","buy_last","sell_last","cost","breakeven","ratio","profit","basis"];
const NUMERIC=new Set(["buy","sell","buy_last","sell_last","cost","breakeven","ratio","profit"]);
const table=document.getElementById("table"),head=document.getElementById("head"),scroll=document.getElementById("scroll"),space=document.getElementById("space"),visible=document.getElementById("visible"),empty=document.getElementById("empty"),panel=document.getElementById("filter-panel");
let scope="",sortKey="",rows=[],selected=new Set(),pendingSelection=null;
let start=-1,end=-1,revision=0,pendingRevision=0,acknowledgedRevision=0;
let columnFilters={},filterChoices={},pendingFilters=null,filterRevision=0,pendingFilterRevision=0,acknowledgedFilterRevision=0;
let openKey="",searchTerm="",filterTimer=null;
function post(type,props){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},props||{}),"*");}
function syncHeight(){
 head.style.paddingRight=(scroll.offsetWidth-scroll.clientWidth)+"px";
 const panelBottom=panel.hidden?0:Number.parseFloat(panel.style.top||"0")+panel.offsetHeight;
 post("streamlit:setFrameHeight",{height:Math.max(table.offsetHeight,panelBottom)});
}
function normalizedFilters(raw){
 const clean={};
 if(!raw||typeof raw!=="object"||Array.isArray(raw))return clean;
 for(const key of KEYS){
  const value=raw[key];
  if(NUMERIC.has(key)){
   if(!value||typeof value!=="object"||Array.isArray(value))continue;
   const range={};
   for(const bound of ["min","max"]){
    if(value[bound]===null||value[bound]===undefined||value[bound]==="")continue;
    const number=Number(value[bound]);if(Number.isFinite(number))range[bound]=number;
   }
   if(Object.keys(range).length)clean[key]=range;
  }else if(Array.isArray(value))clean[key]=[...new Set(value.map(item=>String(item)))].sort();
 }
 return clean;
}
function normalizedChoices(raw){
 const clean={};
 if(!raw||typeof raw!=="object")return clean;
 for(const key of KEYS){
  if(NUMERIC.has(key))continue;
  const values=Array.isArray(raw[key])?raw[key]:[];
  const choices=new Map();
  for(const item of values){
   const value=item&&typeof item==="object"&&!Array.isArray(item)?item.value:item;
   const label=item&&typeof item==="object"&&!Array.isArray(item)?item.label:item;
   if(value===null||value===undefined)continue;
   const name=String(value);if(!choices.has(name))choices.set(name,{value:name,label:String(label??value)});
  }
  clean[key]=[...choices.values()];
 }
 return clean;
}
function sameFilters(left,right){return JSON.stringify(normalizedFilters(left))===JSON.stringify(normalizedFilters(right));}
function emitValue(){
 if(filterTimer!==null){clearTimeout(filterTimer);filterTimer=null;}
 post("streamlit:setComponentValue",{value:{scope,selected_ids:[...selected],revision,
  column_filters:normalizedFilters(columnFilters),filter_revision:filterRevision},dataType:"json"});
}
function changeFilters(next,delay=0){
 columnFilters=normalizedFilters(next);
 filterRevision=Math.max(filterRevision,acknowledgedFilterRevision)+1;
 pendingFilterRevision=filterRevision;pendingFilters=normalizedFilters(columnFilters);
 updateFilterHeaders();
 if(filterTimer!==null)clearTimeout(filterTimer);
 filterTimer=delay?setTimeout(emitValue,delay):null;
 if(!delay)emitValue();
}
function updateFilterHeaders(){
 for(const button of head.querySelectorAll(".filter-button")){
  const key=button.dataset.key,active=Object.hasOwn(columnFilters,key);
  button.classList.toggle("active",active);
  button.setAttribute("aria-pressed",active?"true":"false");
  button.querySelector(".filter-icon").textContent=active?"●":"▾";
  button.title=HEAD[KEYS.indexOf(key)+2]+(active?" • filtered":"")+" — open column filter";
 }
}
function closePanel(){panel.hidden=true;openKey="";syncHeight();}
function menuButton(label,handler){
 const button=document.createElement("button");button.type="button";button.textContent=label;
 button.addEventListener("click",handler);return button;
}
function renderPanel(){
 if(!openKey)return;
 const key=openKey,titleText=HEAD[KEYS.indexOf(key)+2];
 panel.replaceChildren();
 const title=document.createElement("div");title.className="filter-title";title.textContent="FILTER "+titleText;panel.appendChild(title);
 const actions=document.createElement("div");actions.className="filter-actions";
 actions.append(
  menuButton("CLEAR COLUMN",()=>{const next={...columnFilters};delete next[key];changeFilters(next);renderPanel();}),
  menuButton("CLEAR ALL",()=>{changeFilters({});renderPanel();})
 );panel.appendChild(actions);
 if(NUMERIC.has(key)){
  const range=columnFilters[key]||{};
  for(const bound of ["min","max"]){
   const label=document.createElement("label");label.className="filter-field";label.textContent=bound.toUpperCase();
   const input=document.createElement("input");input.type="number";input.step="any";input.inputMode="decimal";
   input.value=range[bound]??"";input.setAttribute("aria-label",titleText+" "+bound);
   input.addEventListener("input",()=>{
    const next={...columnFilters},updated={...(next[key]||{})};
    if(input.value==="")delete updated[bound];
    else if(Number.isFinite(Number(input.value)))updated[bound]=Number(input.value);
    else return;
    if(Object.keys(updated).length)next[key]=updated;else delete next[key];
    changeFilters(next,300);
   });
   label.appendChild(input);panel.appendChild(label);
  }
 }else{
  const choices=filterChoices[key]||[];
  const search=document.createElement("label");search.className="filter-field";search.textContent="FIND";
  const input=document.createElement("input");input.type="search";input.value=searchTerm;
  input.setAttribute("aria-label","Find "+titleText+" values");search.appendChild(input);panel.appendChild(search);
  const choicesActions=document.createElement("div");choicesActions.className="filter-actions";
  choicesActions.append(
   menuButton("SELECT ALL",()=>{const next={...columnFilters};delete next[key];changeFilters(next);renderChoices();}),
   menuButton("SELECT NONE",()=>{changeFilters({...columnFilters,[key]:[]});renderChoices();})
  );panel.appendChild(choicesActions);
  const list=document.createElement("div");list.className="filter-choices";
  list.setAttribute("role","group");list.setAttribute("aria-label",titleText+" values");panel.appendChild(list);
  function renderChoices(){
   list.replaceChildren();const query=searchTerm.trim().toLowerCase();let visibleCount=0;
   for(const choice of choices){
    if(query&&!((choice.label+" "+choice.value).toLowerCase().includes(query)))continue;
    visibleCount++;
    const label=document.createElement("label");label.className="filter-choice";
    const check=document.createElement("input");check.type="checkbox";
    check.checked=!Object.hasOwn(columnFilters,key)||columnFilters[key].includes(choice.value);
    check.addEventListener("change",()=>{
     const selectedValues=Object.hasOwn(columnFilters,key)?new Set(columnFilters[key]):new Set(choices.map(item=>item.value));
     if(check.checked)selectedValues.add(choice.value);else selectedValues.delete(choice.value);
     const next={...columnFilters};
     if(selectedValues.size===choices.length)delete next[key];
     else next[key]=[...selectedValues];
     changeFilters(next);
    });
    const text=document.createElement("span");text.textContent=choice.label;
    text.title=choice.label===choice.value?choice.label:choice.label+" ("+choice.value+")";
    label.append(check,text);list.appendChild(label);
   }
   if(!visibleCount){const note=document.createElement("div");note.className="filter-empty";note.textContent="NO VALUES FOUND";list.appendChild(note);}
   syncHeight();
  }
  input.addEventListener("input",()=>{searchTerm=input.value;renderChoices();});
  renderChoices();
 }
 syncHeight();
}
function openPanel(key,button){
 if(openKey===key){closePanel();return;}
 openKey=key;searchTerm="";panel.hidden=false;
 const width=Math.min(270,window.innerWidth-8),left=button.getBoundingClientRect().left;
 panel.style.left=Math.max(4,Math.min(left,window.innerWidth-width-4))+"px";
 panel.style.top=head.getBoundingClientRect().bottom+"px";
 renderPanel();
}
function safeTradingViewUrl(raw){
 try{
  const url=new URL(String(raw||""));
  return url.protocol==="https:"&&!url.username&&!url.password&&
   url.hostname==="www.tradingview.com"&&url.pathname==="/chart/"&&
   /^OPRA:[A-Z][A-Z0-9.]*\d{6}[CP]\d+\.\d+-OPRA:[A-Z][A-Z0-9.]*\d{6}[CP]\d+\.\d+$/.test(url.searchParams.get("symbol")||"")?url.href:"";
 }catch{return "";}
}
function safeOptionStratUrl(raw){
 try{
  const url=new URL(String(raw||""));
  if(url.protocol!=="https:"||url.username||url.password)return "";
  const host=url.hostname.toLowerCase();
  return host==="optionstrat.com"||host.endsWith(".optionstrat.com")?url.href:"";
 }catch{return "";}
}
for(let index=0;index<HEAD.length;index++){
 const title=HEAD[index],cell=document.createElement("span");cell.title=title;
 if(index<2)cell.textContent=title;
 else{
  const button=document.createElement("button");button.type="button";button.className="filter-button";
  button.dataset.key=KEYS[index-2];button.setAttribute("aria-label","Filter "+title);
  const name=document.createElement("span");name.className="filter-name";name.textContent=title;
  const icon=document.createElement("span");icon.className="filter-icon";icon.textContent="▾";
  button.append(name,icon);cell.appendChild(button);
 }
 head.appendChild(cell);
}
head.addEventListener("click",event=>{
 const button=event.target.closest("button.filter-button");
 if(button)openPanel(button.dataset.key,button);
});
document.addEventListener("pointerdown",event=>{
 if(!panel.hidden&&!panel.contains(event.target)&&!head.contains(event.target))closePanel();
});
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!panel.hidden)closePanel();});
function makeRow(row,index){
 const line=document.createElement("div");
 const values=Array.isArray(row.values)?row.values:[];
 line.className="row"+(row.annual?" annual":"")+(values[1]==="PUT"?" put":values[1]==="CALL"?" call":"")+(values[11]==="LAST*"?" unreliable":"");line.dataset.index=String(index);
 const description=[values[0],values[1],values[2],"BUY",values[3],"SELL",values[4]].filter(Boolean).join(" ");
 const select=document.createElement("button");
 select.type="button";select.className="select";select.dataset.index=String(index);
 select.setAttribute("aria-label","SELECT / DESELECT "+description);
 select.setAttribute("aria-pressed",selected.has(row.id)?"true":"false");
 select.title="Select or deselect this exact vertical spread; no order is sent";
 const square=document.createElement("span");square.className="square";square.textContent="✓";square.setAttribute("aria-hidden","true");
 select.appendChild(square);line.appendChild(select);
 const links=document.createElement("div");links.className="link-pair";
 for(const [label,href,service,descriptionText] of [
  ["OS",safeOptionStratUrl(row.optionstrat_url),"OptionStrat","Exact debit spread payoff"],
  ["TV",safeTradingViewUrl(row.tradingview_url),"TradingView","Exact spread chart: BUY option premium minus SELL option premium"]
 ]){
  if(href){
   const open=document.createElement("a");open.className="open";open.textContent=label;open.href=href;
   open.target="_blank";open.rel="noopener noreferrer";
   open.setAttribute("aria-label","OPEN "+description+" IN "+service.toUpperCase()+" (NEW TAB)");
   open.title=descriptionText+" in "+service;links.appendChild(open);
  }else{
   const disabled=document.createElement("span");disabled.className="open disabled";disabled.textContent="—";
   disabled.title=service+" link unavailable for this spread";links.appendChild(disabled);
  }
 }
 line.appendChild(links);
 for(let i=0;i<HEAD.length-2;i++){
  const cell=document.createElement("span");cell.className="cell";
  cell.textContent=String(values[i]??"—");cell.title=HEAD[i+2]+": "+cell.textContent;
  if(i===2 && row.expiry_detail){
   cell.classList.add("expiry");
   const date=document.createElement("span");date.textContent=cell.textContent;
   const detail=document.createElement("small");detail.className="expiry-detail";
   detail.textContent=String(row.expiry_detail);detail.title="Calendar days and years (365.25 days/year) until expiration";
   cell.replaceChildren(date,detail);
  }
  line.appendChild(cell);
 }
 return line;
}
function paint(force=false){
 const first=Math.max(0,Math.floor(scroll.scrollTop/ROW_HEIGHT)-5);
 const last=Math.min(rows.length,first+Math.ceil(scroll.clientHeight/ROW_HEIGHT)+12);
 if(!force&&first===start&&last===end)return;
 start=first;end=last;visible.style.transform="translateY("+(start*ROW_HEIGHT)+"px)";
 const fragment=document.createDocumentFragment();
 for(let i=first;i<last;i++)fragment.appendChild(makeRow(rows[i],i));
 visible.replaceChildren(fragment);
}
scroll.addEventListener("scroll",()=>paint(),{passive:true});
visible.addEventListener("click",event=>{
 const button=event.target.closest("button.select");if(!button)return;
 const row=rows[Number(button.dataset.index)];if(!row||typeof row.id!=="string")return;
 if(selected.has(row.id))selected.delete(row.id);else selected.add(row.id);
 button.setAttribute("aria-pressed",selected.has(row.id)?"true":"false");
 pendingSelection=new Set(selected);
 revision=Math.max(revision,acknowledgedRevision)+1;pendingRevision=revision;
 emitValue();
});
window.addEventListener("message",event=>{
 if(!event.data||event.data.type!=="streamlit:render")return;
 const args=event.data.args||{};
 const newScope=String(args.scope||""),newSort=String(args.sort_key||"");
 const needsReset=newScope!==scope||newSort!==sortKey,scopeChanged=newScope!==scope;
 scope=newScope;sortKey=newSort;rows=Array.isArray(args.rows)?args.rows:[];
 const priorFilters=columnFilters,priorChoices=filterChoices;
 const serverFilters=normalizedFilters(args.column_filters);
 filterChoices=normalizedChoices(args.filter_choices);
 const hasFilterAck=Number.isInteger(args.filter_ack_revision)&&args.filter_ack_revision>=0;
 const serverFilterRevision=hasFilterAck?args.filter_ack_revision:0;
 let replayPending=false;
 if(scopeChanged){
  if(filterTimer!==null){clearTimeout(filterTimer);filterTimer=null;}
  closePanel();columnFilters=serverFilters;pendingFilters=null;pendingFilterRevision=0;
  acknowledgedFilterRevision=serverFilterRevision;filterRevision=serverFilterRevision;
 }else if(!pendingFilters){
  columnFilters=serverFilters;
  acknowledgedFilterRevision=Math.max(acknowledgedFilterRevision,serverFilterRevision);
  filterRevision=Math.max(filterRevision,serverFilterRevision);
 }else if(hasFilterAck&&serverFilterRevision>=pendingFilterRevision){
  columnFilters=serverFilters;pendingFilters=null;pendingFilterRevision=0;
  acknowledgedFilterRevision=serverFilterRevision;filterRevision=Math.max(filterRevision,serverFilterRevision);
 }else if(!hasFilterAck&&sameFilters(serverFilters,pendingFilters)){
  columnFilters=serverFilters;pendingFilters=null;pendingFilterRevision=0;
 }else if(hasFilterAck&&serverFilterRevision>acknowledgedFilterRevision){
  acknowledgedFilterRevision=serverFilterRevision;replayPending=true;
 }
 const serverSelection=new Set(Array.isArray(args.selected_ids)?args.selected_ids:[]);
 const hasAck=Number.isInteger(args.ack_revision)&&args.ack_revision>=0;
 const serverRevision=hasAck?args.ack_revision:0;
 if(scopeChanged){
  pendingSelection=null;pendingRevision=0;acknowledgedRevision=serverRevision;revision=serverRevision;selected=serverSelection;
 }else if(!pendingSelection){
  selected=serverSelection;acknowledgedRevision=Math.max(acknowledgedRevision,serverRevision);revision=Math.max(revision,serverRevision);
 }else if(hasAck&&serverRevision>=pendingRevision){
  selected=serverSelection;pendingSelection=null;pendingRevision=0;acknowledgedRevision=serverRevision;revision=Math.max(revision,serverRevision);
 }else if(!hasAck&&serverSelection.size===pendingSelection.size&&[...serverSelection].every(id=>pendingSelection.has(id))){
  selected=serverSelection;pendingSelection=null;pendingRevision=0;
 }else if(hasAck&&serverRevision>acknowledgedRevision){
  acknowledgedRevision=serverRevision;
  replayPending=true;
 }
 if(replayPending)emitValue();
 updateFilterHeaders();
 if(!panel.hidden&&(JSON.stringify(priorFilters[openKey])!==JSON.stringify(columnFilters[openKey])
                    ||(!NUMERIC.has(openKey)&&JSON.stringify(priorChoices[openKey])
                       !==JSON.stringify(filterChoices[openKey]))))renderPanel();
 if(needsReset)scroll.scrollTop=0;
 scroll.style.height=Math.min(516,Math.max(52,rows.length*ROW_HEIGHT))+"px";
 space.style.height=(rows.length*ROW_HEIGHT)+"px";
 empty.style.display=rows.length?"none":"block";
 start=-1;end=-1;paint(true);syncHeight();
});
new ResizeObserver(()=>syncHeight()).observe(document.getElementById("table"));
post("streamlit:componentReady",{apiVersion:1});syncHeight();
})();
</script>
</body>
</html>
